<html lang="zh-CN"><head><meta charset="utf-8">

<style>
  :root{--bg:#0e1116;--card:#171c24;--ink:#e8ecf3;--ink2:#9aa6b8;--brand:#6d5efc;--cyan:#22c1c3;

  .btns{margin:10px 0 18px;display:flex;gap:8px;flex-wrap:wrap}
  button{background:linear-gradient(90deg,var(--brand),var(--cyan));color:#fff;border:0;border-radius:10px;
         padding:8px 14px;font-size:13px;cursor:pointer}
  .pill{font-size:11px;color:var(--ink2)}
