<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>个人工作任务台</title>
<style>/* ============================================================
   个人工作任务台 · 样式
   浅色主题 / 卡片式 / 大量留白 / 柔和阴影
   ============================================================ */
:root{
  --bg:#f6f7fb;
  --bg-soft:#eef1f8;
  --card:#ffffff;
  --ink:#1b1f35;
  --ink-2:#4b5273;
  --ink-3:#7b83a3;
  --line:#e4e7f2;
  --line-2:#eef1f8;
  --brand:#6d5efc;
  --brand-2:#22c1c3;
  --brand-soft:#efecff;
  --brand-soft-2:#e4f8f9;
  --ok:#16a34a;
  --ok-soft:#eafaf0;
  --warn:#f59e0b;
  --warn-soft:#fff7e6;
  --danger:#ef4444;
  --danger-soft:#fef2f2;
  --r:16px;
  --r-sm:10px;
  --sh:0 2px 6px rgba(27,31,53,.05), 0 12px 28px rgba(27,31,53,.06);
  --sh-sm:0 1px 3px rgba(27,31,53,.07);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 500px at 10% -10%, #ece9ff 0%, rgba(236,233,255,0) 58%),
    radial-gradient(900px 420px at 95% -4%, #dcf5f6 0%, rgba(220,245,246,0) 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.3;letter-spacing:-.2px}
p{margin:0}

/* ---------- 布局 ---------- */
.layout{display:flex;min-height:100vh}
.sidebar{
  width:228px;flex:none;padding:22px 14px 24px;
  border-right:1px solid var(--line);
  background:rgba(255,255,255,.66);
  backdrop-filter:blur(8px);
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.view{max-width:1180px;width:100%;margin:0 auto;padding:22px 26px 90px;flex:1}

/* ---------- 品牌 ---------- */
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 20px}
.brand .logo{
  width:36px;height:36px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  display:grid;place-items:center;color:#fff;font-size:17px;font-weight:700;
  box-shadow:0 6px 14px rgba(109,94,252,.28);
}
.brand .t{font-size:15px;font-weight:700;letter-spacing:-.3px}
.brand .s{font-size:11.5px;color:var(--ink-3);line-height:1.2}

/* ---------- 导航 ---------- */
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:12px;border:none;background:none;
  cursor:pointer;color:var(--ink-2);font-size:14.5px;font-weight:500;
  min-height:44px;text-align:left;width:100%;transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--bg-soft);color:var(--ink)}
.nav-item.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-item .ic{width:20px;text-align:center;font-size:15px;flex:none}
.nav-item .bdg{
  margin-left:auto;font-size:11px;font-weight:700;min-width:20px;height:20px;
  padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;
  display:grid;place-items:center;line-height:1;
}
.nav-item .bdg.mute{background:var(--bg-soft);color:var(--ink-3)}
.nav-sub{display:flex;flex-direction:column;gap:2px;margin:2px 0 6px 18px;padding-left:10px;border-left:1.5px solid var(--line)}
.nav-sub button{
  border:none;background:none;cursor:pointer;text-align:left;
  padding:7px 10px;border-radius:9px;color:var(--ink-3);font-size:13.5px;min-height:38px;
}
.nav-sub button:hover{background:var(--bg-soft);color:var(--ink-2)}
.nav-sub button.on{color:var(--brand);font-weight:600;background:var(--brand-soft)}
.nav-label{font-size:11px;color:var(--ink-3);letter-spacing:.6px;padding:14px 12px 6px;font-weight:600}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  padding:14px 26px;
  background:rgba(246,247,251,.82);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.topbar .ttl{font-size:18px;font-weight:700;flex:1;min-width:150px}
.topbar .sub{font-size:12.5px;color:var(--ink-3);font-weight:400;margin-left:8px}
.topbar .clock{font-family:var(--mono);font-size:13px;color:var(--ink-2);letter-spacing:-.2px}

/* ---------- 卡片 ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:20px 22px;margin-bottom:18px;
}
.card.tight{padding:16px 18px}
.card-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-hd h3{font-size:15.5px;font-weight:700;flex:1;min-width:120px}
.card-hd .hint{font-size:12.5px;color:var(--ink-3);font-weight:400}
.card-hd .ico{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  font-size:14px;flex:none;background:var(--brand-soft);color:var(--brand);
}
.card-hd .ico.ok{background:var(--ok-soft);color:var(--ok)}
.card-hd .ico.warn{background:var(--warn-soft);color:#a35c00}
.card-hd .ico.danger{background:var(--danger-soft);color:var(--danger)}

.sec-title{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}
.sec-title h2{font-size:17px;font-weight:700}
.sec-title .n{font-size:12.5px;color:var(--ink-3)}

/* ---------- 页面头 ---------- */
.page-head{margin-bottom:20px}
.page-head h1{font-size:26px;letter-spacing:-.6px}
.page-head .desc{color:var(--ink-2);font-size:14px;margin-top:6px}

/* ---------- KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--sh);position:relative;overflow:hidden;
}
.kpi .lbl{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;min-height:20px}
.kpi .lbl .dot{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none}
.kpi .val{font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px;font-weight:600;color:var(--ink-3);margin-left:2px}
.kpi .ft{font-size:12px;color:var(--ink-3);margin-top:2px}
.kpi .bar{height:5px;border-radius:99px;background:var(--bg-soft);margin-top:9px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.kpi.v-ok .val{color:var(--ok)} .kpi.v-ok .lbl .dot{background:var(--ok)}
.kpi.v-warn .val{color:#b45309} .kpi.v-warn .lbl .dot{background:var(--warn)}
.kpi.v-danger .val{color:var(--danger)} .kpi.v-danger .lbl .dot{background:var(--danger)}
.kpi.click{cursor:pointer} .kpi.click:hover{border-color:#cfd4ea}

/* ---------- 统计条（今日工作台顶部） ---------- */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh);
}
.stat .n{font-size:33px;font-weight:800;letter-spacing:-1.4px;line-height:1.02;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.stat.s-ok .n{color:var(--ok)} .stat.s-warn .n{color:#b45309} .stat.s-danger .n{color:var(--danger)}
.stat.s-brand .n{color:var(--brand)}
/* 带图标变体（今日工作台 KPI） */
.stat.ic{display:flex;align-items:center;gap:14px;padding:16px 18px}
.stat.ic .st-ic{
  width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;
  font-size:23px;background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:0 8px 16px rgba(109,94,252,.22);
}
.stat.ic .st-b{flex:1;min-width:0}
.stat.ic .l{margin-top:2px}
.stat.s-ok.ic .st-ic{background:linear-gradient(135deg,#22c1c3,#16a34a);box-shadow:0 8px 16px rgba(34,193,195,.24)}
.stat.s-warn.ic .st-ic{background:linear-gradient(135deg,#f59e0b,#f472b6);box-shadow:0 8px 16px rgba(245,158,11,.24)}
.stat.s-danger.ic .st-ic{background:linear-gradient(135deg,#ef4444,#f472b6);box-shadow:0 8px 16px rgba(239,68,68,.24)}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:40px;padding:0 15px;border-radius:11px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  font-size:14px;font-weight:500;transition:.15s;white-space:nowrap;
}
.btn:hover{background:var(--bg-soft);border-color:#d5daee}
.btn:active{transform:translateY(1px)}
.btn.pri{
  background:linear-gradient(135deg,var(--brand),#7c6cff);color:#fff;border:none;
  box-shadow:0 4px 12px rgba(109,94,252,.26);
}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ok{background:var(--ok);color:#fff;border:none}
.btn.ok:hover{filter:brightness(1.05)}
.btn.danger{background:var(--danger);color:#fff;border:none}
.btn.danger:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-3)}
.btn.ghost:hover{background:var(--bg-soft);color:var(--ink-2)}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.lg{min-height:48px;padding:0 22px;font-size:15px;border-radius:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{
  width:34px;height:34px;min-width:34px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink-3);
  display:grid;place-items:center;font-size:14px;transition:.15s;
}
.icon-btn:hover{background:var(--bg-soft);color:var(--ink)}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger);border-color:#fbcaca}

/* ---------- 标签/徽章 ---------- */
.tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;
  background:var(--bg-soft);color:var(--ink-2);line-height:1.7;white-space:nowrap;
}
.tag.p-high{background:#fef2f2;color:#b91c1c}
.tag.p-mid{background:#fff7e6;color:#a35c00}
.tag.p-low{background:var(--bg-soft);color:var(--ink-3)}
.tag.s-todo{background:var(--bg-soft);color:var(--ink-2)}
.tag.s-doing{background:var(--brand-soft);color:var(--brand)}
.tag.s-waiting{background:#fff7e6;color:#a35c00}
.tag.s-done{background:var(--ok-soft);color:#10703c}
.tag.ok{background:var(--ok-soft);color:#10703c}
.tag.warn{background:#fff7e6;color:#a35c00}
.tag.danger{background:#fef2f2;color:#b91c1c}
.tag.brand{background:var(--brand-soft);color:var(--brand)}
.due{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.due.red{color:var(--danger);font-weight:600}
.due.amber{color:#b45309;font-weight:600}

/* ---------- 任务行 ---------- */
.list{display:flex;flex-direction:column;gap:0}
.row{
  display:flex;align-items:flex-start;gap:11px;
  padding:12px 4px;border-bottom:1px solid var(--line-2);
}
.row:last-child{border-bottom:none}
.row .cb{
  width:22px;height:22px;flex:none;margin-top:2px;border-radius:7px;cursor:pointer;
  border:1.8px solid #cfd4ea;background:var(--card);display:grid;place-items:center;
  font-size:12px;color:transparent;transition:.15s;
}
.row .cb:hover{border-color:var(--brand);background:var(--brand-soft)}
.row.done .cb{background:var(--ok);border-color:var(--ok);color:#fff}
.row .body{flex:1;min-width:0}
.row .t1{font-size:14.5px;font-weight:500;word-break:break-word}
.row.done .t1{color:var(--ink-2);text-decoration:line-through;text-decoration-color:rgba(75,82,115,.5)}
.due.done-due{color:var(--ok)}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px}
.row .acts{display:flex;gap:4px;flex:none;opacity:.55;transition:.15s}
.row:hover .acts{opacity:1}
.row .note{font-size:12.5px;color:var(--ink-3);margin-top:3px;word-break:break-word}

/* ---------- 今日三件事 ---------- */
.top3{display:flex;flex-direction:column;gap:10px}
.top3-item{
  display:flex;gap:13px;align-items:flex-start;padding:14px 16px;
  border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,#fff,#fcfcff);
}
.top3-item .rk{
  width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-2));
}
.top3-item.r1 .rk{background:linear-gradient(135deg,#ef4444,#f97316)}
.top3-item.r2 .rk{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.top3-item.r3 .rk{background:linear-gradient(135deg,#6d5efc,#22c1c3)}
.top3-item .b{flex:1;min-width:0}
.top3-item .tt{font-size:15.5px;font-weight:600;word-break:break-word}
.top3-item .mm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}

/* ---------- 项目卡 ---------- */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.proj{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:18px 20px;display:flex;flex-direction:column;gap:11px;
}
.proj .ph{display:flex;align-items:flex-start;gap:8px}
.proj .ph .wn{flex:0 0 auto;width:24px;height:24px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.proj .pn{font-size:16px;font-weight:700;flex:1;min-width:0;word-break:break-word}
.proj .pd{font-size:13px;color:var(--ink-2);word-break:break-word}
.proj .pbar{height:7px;border-radius:99px;background:var(--bg-soft);overflow:hidden}
.proj .pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.proj .pnfo{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.proj .pnfo b{color:var(--ink);font-weight:700;font-size:14px}
.proj .next{
  font-size:13px;background:var(--bg-soft);border-radius:10px;padding:9px 12px;color:var(--ink-2);
}
.proj .next b{display:block;font-size:11px;color:var(--ink-3);font-weight:600;margin-bottom:1px}
.proj .pf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}

/* ---------- 文档库：知识库标签 / 要点 / 路径 / 知识库管理 ---------- */
.kb-tag{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand);
  border:1px solid rgba(109,94,252,.28);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.kb-tag.off{background:var(--bg-soft);color:var(--ink-3);border-color:var(--line);font-weight:500}
.dc-ex{
  font-size:12.5px;line-height:1.62;color:var(--ink-2);background:#f7f9ff;
  border-left:3px solid var(--brand-2);border-radius:0 9px 9px 0;padding:7px 11px;word-break:break-word;
}
.dc-path{
  font-size:12.5px;color:var(--ink-3);font-family:var(--mono);word-break:break-all;
  background:var(--bg-soft);padding:7px 10px;border-radius:9px;
}
.kb-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:11px;background:var(--card);
}
.kb-row + .kb-row{margin-top:8px}
.kb-ic{font-size:17px;flex:none}
.kb-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.kb-b b{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-b i{font-style:normal;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 文档库：两段式协同（IMA 收碎片 · Obsidian 沉淀） ---------- */
.doc-pipe{display:flex;align-items:stretch;gap:8px;margin-bottom:16px}
.doc-pipe-cell{
  flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;cursor:pointer;
  border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:13px 15px;
  transition:border-color .15s,transform .15s,box-shadow .15s;
}
.doc-pipe-cell:hover{border-color:#d5daee;transform:translateY(-1px);box-shadow:var(--sh)}
.doc-pipe-cell.on{border-color:var(--brand);background:var(--brand-soft)}
.doc-pipe-cell .dpn{font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1.1;font-variant-numeric:tabular-nums}
.doc-pipe-cell .dpl{font-size:13px;font-weight:600}
.doc-pipe-cell .dps{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-pipe-ar{align-self:center;flex:none;color:var(--ink-3);font-size:15px}

.doc-lanes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.lane{
  display:flex;flex-direction:column;gap:11px;padding:16px 18px;
  border:1px solid var(--line);background:var(--card);border-radius:var(--r);
}
.lane-hd{display:flex;align-items:center;gap:11px}
.lane-hd .lane-ic{
  width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;
}
.lane-ima .lane-ic{background:linear-gradient(135deg,#6d5efc,#22c1c3);box-shadow:0 8px 16px rgba(109,94,252,.22)}
.lane-obs .lane-ic{background:linear-gradient(135deg,#7c3aed,#6d5efc);box-shadow:0 8px 16px rgba(124,58,237,.22)}
.lane-hd b{display:block;font-size:15px;font-weight:700}
.lane-hd i{font-style:normal;font-size:12.5px;color:var(--ink-3)}
.lane-desc{font-size:12.5px;line-height:1.62;color:var(--ink-2)}
.lane-acts{display:flex;gap:7px;flex-wrap:wrap}
.lane-ask{display:flex;gap:7px;flex-wrap:wrap}
.lane-ask input{flex:1;min-width:150px}
.lane-ask select{width:auto;max-width:150px}
.lane-kbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
.lane-kb{
  display:flex;align-items:center;gap:7px;font:inherit;cursor:pointer;max-width:100%;
  border:1px solid var(--line);background:var(--bg-soft);border-radius:10px;padding:6px 10px;
}
.lane-kb:hover{border-color:#d5daee;background:var(--card)}
.lane-kb b{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-kb i{font-style:normal;font-size:11.5px;color:var(--ink-3);flex:none}

.tag.stage-inbox{background:var(--brand-soft);color:var(--brand)}
.tag.stage-refine{background:var(--warn-soft);color:#a35c00}
.tag.stage-archive{background:var(--ok-soft);color:#10703c}
.doc-card{position:relative;overflow:hidden}
.doc-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.doc-card.s-inbox::before{background:linear-gradient(180deg,#6d5efc,#22c1c3)}
.doc-card.s-refine::before{background:#f59e0b}
.doc-card.s-archive::before{background:#16a34a}
.doc-nx{border-color:rgba(109,94,252,.42);color:var(--brand)}
.doc-nx:hover{background:var(--brand-soft)}
@media (max-width:880px){
  .doc-lanes{grid-template-columns:1fr}
  .doc-pipe{flex-direction:column}
  .doc-pipe-ar{transform:rotate(90deg);align-self:flex-start;margin-left:18px}
}

/* ---------- 项目中心（主线项目 / 其他项目） ---------- */
.proj-list{display:flex;flex-direction:column;gap:14px}
.proj-entry{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:16px 18px;transition:box-shadow .18s;
}
.proj-entry.open{box-shadow:0 3px 8px rgba(27,31,53,.06),0 16px 34px rgba(27,31,53,.09)}
.pe-hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pe-ic{
  width:38px;height:38px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:linear-gradient(135deg,rgba(109,94,252,.14),rgba(34,193,195,.16));
}
.pe-ic.grp{background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(239,68,68,.14))}
.pe-t{flex:1;min-width:180px}
.pe-t h3{font-size:15.5px;font-weight:700;word-break:break-word}
.pe-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
.pe-sum{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.pe-sum b{font-size:15px;color:var(--ink);font-weight:700}
.pe-bar{margin-top:11px}
.pe-bar .progress-bar{height:7px}
.pe-body{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.pe-empty{font-size:13px;color:var(--ink-3);padding:6px 2px}
.pe-acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.pe-group{margin-bottom:14px}
.pe-group:last-child{margin-bottom:0}
.pe-group-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.pe-group-hd .pg-name{font-size:13.5px;font-weight:700;flex:1;min-width:150px;word-break:break-word}
.pe-group-n{font-size:12.5px;color:var(--ink-3);white-space:nowrap}

/* ---------- 风险项 ---------- */
.risk{
  display:flex;gap:12px;align-items:flex-start;padding:13px 15px;
  border:1px solid var(--line);border-left:3px solid var(--ink-3);
  border-radius:11px;background:var(--card);margin-bottom:9px;
}
.risk.sev-red{border-left-color:var(--danger);background:linear-gradient(90deg,#fef6f6,#fff 40%)}
.risk.sev-amber{border-left-color:var(--warn);background:linear-gradient(90deg,#fffaf0,#fff 40%)}
.risk.sev-green{border-left-color:var(--ok)}
.risk .ri{width:24px;height:24px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:13px}
.risk.sev-red .ri{background:var(--danger-soft);color:var(--danger)}
.risk.sev-amber .ri{background:var(--warn-soft);color:#b45309}
.risk.sev-green .ri{background:var(--ok-soft);color:var(--ok)}
.risk .rb{flex:1;min-width:0}
.risk .rt{font-size:14.5px;font-weight:600;word-break:break-word}
.risk .rm{font-size:12.5px;color:var(--ink-3);margin-top:3px;word-break:break-word}

/* ---------- 任务行图标 ---------- */
.t-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-right:5px;font-size:13px;color:var(--ink-3);vertical-align:-1px}
.row.done .t-icon{color:var(--ok)}
.t-prio{margin-right:5px;font-size:12px;vertical-align:1px}

/* ---------- 小型月历（3D / 干净背景） ---------- */
.today-top{display:grid;grid-template-columns:minmax(286px,322px) 1fr;gap:14px;align-items:start;margin-bottom:18px}
.mini-cal{
  background:linear-gradient(180deg,#ffffff 0%,#f7f8fd 100%);
  border:1px solid #e8ebf7;border-radius:18px;
  box-shadow:0 1px 2px rgba(27,31,53,.04),0 12px 26px rgba(27,31,53,.07),inset 0 1px 0 #fff;
  padding:14px 15px;
}
.cal-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-hd .cal-t{flex:1;text-align:center;font-size:14px;font-weight:700}
.cal-hd .cal-t i{font-style:normal;font-size:11.5px;font-weight:500;color:var(--ink-3);margin-left:5px}
.cal-hd .icon-btn{width:26px;height:26px;border-radius:8px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(27,31,53,.05)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.cal-week div{text-align:center;font-size:10.5px;color:var(--ink-3);font-weight:600}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{
  min-height:42px;border-radius:10px;border:1px solid transparent;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  padding:3px 0;cursor:pointer;position:relative;transition:.14s;
}
.cal-cell:hover{background:#eef0fa;box-shadow:0 2px 6px rgba(27,31,53,.06)}
.cal-cell.empty{cursor:default}
.cal-cell.empty:hover{background:transparent;box-shadow:none}
.cal-cell .cd-n{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1}
.cal-cell .cd-l{font-size:8.5px;line-height:1;color:var(--ink-3);white-space:nowrap}
.cal-cell .cd-dots{display:flex;gap:2px;height:4px;align-items:center;margin-top:1px}
.cal-cell .cd{width:4px;height:4px;border-radius:50%;display:block}
.cd-high{background:#ef4444}.cd-mid{background:#f59e0b}.cd-low{background:#6d5efc}.cd-done{background:#16a34a}
.cal-cell.today{background:linear-gradient(180deg,#f1eeff,#fbfaff);box-shadow:inset 0 0 0 1.5px rgba(109,94,252,.4)}
.cal-cell.today .cd-n{color:var(--brand)}
.cal-cell.on{background:linear-gradient(135deg,#6d5efc,#22c1c3);box-shadow:0 8px 16px rgba(109,94,252,.3)}
.cal-cell.on .cd-n,.cal-cell.on .cd-l{color:#fff}
.cal-cell.on .cd{background:#fff}

/* ---------- 专注模式 ---------- */
.focus-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.focus-view{padding:10px 0}
.focus-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.focus-head h1{font-size:24px;letter-spacing:-.5px}
.focus-body .list{display:flex;flex-direction:column;gap:0}
body.in-focus .sidebar,
body.in-focus .topbar{display:none}
body.in-focus .view{padding-top:20px}

/* ---------- 表单 ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field label .req{color:var(--danger);margin-left:2px}
.field .tip{font-size:11.5px;color:var(--ink-3);font-weight:400;margin-top:4px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{
  width:100%;min-height:42px;padding:9px 12px;border-radius:11px;
  border:1px solid var(--line);background:#fcfcff;outline:none;transition:.15s;
}
textarea{min-height:80px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(109,94,252,.12)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:9px;min-height:44px;cursor:pointer;user-select:none}
.check input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.check span{font-size:14px}

/* ---------- 空状态 ---------- */
.empty{
  text-align:center;padding:34px 18px;color:var(--ink-3);
}
.empty .e-ic{font-size:30px;opacity:.5}
.empty .e-t{font-size:14.5px;margin-top:6px;color:var(--ink-2)}
.empty .e-s{font-size:12.5px;margin-top:3px}

/* ---------- 弹窗 ---------- */
#modal-root{position:fixed;inset:0;z-index:100;pointer-events:none}
#modal-root.open{pointer-events:auto}
.mask{
  position:absolute;inset:0;background:rgba(22,26,45,.42);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:18px;
  animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal{
  background:var(--card);border-radius:18px;width:100%;max-width:520px;
  max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 24px 60px rgba(20,24,45,.28);animation:pop .18s ease;
}
.modal.wide{max-width:680px}
.modal-hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line-2);flex:none}
.modal-hd h3{font-size:16px;flex:1;min-width:0}
.modal-bd{padding:18px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-ft{
  display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;
  border-top:1px solid var(--line-2);flex:none;flex-wrap:wrap;
}

/* ---------- Toast ---------- */
.toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;padding:0 12px;width:max-content;max-width:92vw}
.toast{
  background:#1b1f35;color:#fff;padding:10px 17px;border-radius:12px;font-size:13.5px;
  box-shadow:0 10px 26px rgba(20,24,45,.28);animation:pop .18s ease;max-width:100%;
}
.toast.ok{background:#10703c}
.toast.error{background:#b91c1c}
.toast.warn{background:#a35c00}

/* ---------- 分栏 chip ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{
  min-height:38px;padding:0 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:13.5px;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;
}
.chip:hover{background:var(--bg-soft)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.chip .n{font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}

/* 技能库筛选：分组行 —— 两组独立单选筛选（分类 / 状态），分行显示避免被误认为一组多选 */
.sk-frow{display:flex;align-items:flex-start;gap:10px;margin-top:12px}
.sk-frow .chip-lbl{
  flex:0 0 auto;padding-top:9px;font-size:12.5px;color:var(--ink-3);
  font-weight:600;letter-spacing:.4px;user-select:none;
}
.sk-frow .chips{margin-bottom:0;flex:1 1 auto;gap:7px}
.sk-frow + .sk-frow{margin-top:8px}

/* 页顶说明条：全站通用的 .page-note（含推荐快照过期警告变体） */
.page-note{
  margin-bottom:12px;padding:9px 13px;border-radius:10px;
  background:var(--bg-soft);border:1px solid var(--line);
  font-size:12.5px;line-height:1.7;color:var(--ink-3);
}
.page-note.warn{color:#b45309;background:#fffbeb;border-color:#fde68a}

/* ---------- 周报 ---------- */
.report{
  background:#fcfcff;border:1px solid var(--line);border-radius:13px;padding:18px 20px;
  font-size:14px;line-height:1.85;white-space:pre-wrap;word-break:break-word;
  max-height:440px;overflow-y:auto;
}
.report h4{margin:14px 0 4px;font-size:14.5px;color:var(--brand)}
.report h4:first-child{margin-top:0}

/* ---------- 打卡热力 ---------- */
.heat{display:flex;gap:5px;flex-wrap:wrap}
.heat i{
  width:26px;height:26px;border-radius:7px;background:var(--bg-soft);
  display:grid;place-items:center;font-size:10px;color:var(--ink-3);font-style:normal;
}
.heat i.on{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:700}
.heat i.today{outline:2px solid var(--brand);outline-offset:1px}

/* ---------- 进度环 ---------- */
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rv{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:700;font-size:19px;letter-spacing:-.5px;
}
.ring .rv small{font-size:9.5px;font-weight:600;color:var(--ink-3);letter-spacing:0;line-height:1}

/* ---------- 概览 hero ---------- */
.hero{
  background:linear-gradient(135deg,#6d5efc 0%,#7c6cff 45%,#22c1c3 100%);
  border-radius:20px;padding:24px 26px;color:#fff;box-shadow:0 14px 34px rgba(109,94,252,.26);
  margin-bottom:18px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;
  background:rgba(255,255,255,.10);
}
.hero .h-row{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;position:relative;z-index:1}
.hero .h-clock{font-family:var(--mono);font-size:38px;font-weight:700;letter-spacing:-1.5px;line-height:1.1}
.hero .h-date{font-size:14px;opacity:.9;margin-top:2px}
.hero .h-wx{display:flex;align-items:center;gap:10px;font-size:14.5px;margin-top:12px;opacity:.96;flex-wrap:wrap}
.hero .h-wx .w-ic{font-size:22px}
.hero .h-right{margin-left:auto;text-align:right;min-width:190px}
.hero .h-greet{font-size:15px;font-weight:600;opacity:.95}
.hero .h-sub{font-size:12.5px;opacity:.8;margin-top:2px}
.hero .h-ft{
  margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22);
  display:flex;gap:22px;flex-wrap:wrap;font-size:13px;position:relative;z-index:1;
}
.hero .h-ft b{font-size:17px;font-weight:700;display:block;letter-spacing:-.3px}

/* ---------- 运势 ---------- */
.fortune{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.fortune .f-score{
  width:70px;height:70px;flex:none;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(135deg,#fff7e6,#ffe9c2);color:#a35c00;
  font-size:26px;font-weight:700;letter-spacing:-1px;
}
.fortune .f-b{flex:1;min-width:180px}
.fortune .f-line{font-size:13.5px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fortune .f-tip{font-size:13px;color:var(--ink-3);margin-top:5px}
.f-color{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px;border:1px solid rgba(0,0,0,.08)}

/* ---------- AI 每日一句 ---------- */
.ai-quote{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 16px;
  background:linear-gradient(90deg,var(--brand-soft),var(--brand-soft-2));
  border:1px solid var(--line);border-radius:12px;color:var(--ink-2);font-size:13.5px;
}
.ai-quote .ai-tag{
  flex:none;font-size:11px;font-weight:700;color:var(--brand);
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px;
}
.ai-quote .ai-txt{line-height:1.5}

/* ---------- 新版 Hero（时间 / 天气 / 星座运势 一体化） ---------- */
.hero.v2{padding:22px 26px 18px}
.hero.v2 .h-main{display:flex;gap:22px;position:relative;z-index:1;align-items:stretch}
.hero.v2 .h-left{flex:1.1;min-width:220px;display:flex;flex-direction:column}
.hero.v2 .h-greet{font-size:15px;font-weight:500;opacity:.92;margin-bottom:4px}
.hero.v2 .h-greet b{font-weight:700}
.hero.v2 .h-clock{font-size:44px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin-top:4px}
.hero.v2 .h-date{font-size:14px;opacity:.85;margin-top:4px}
.hero.v2 .h-wx{display:flex;align-items:center;gap:10px;font-size:13.5px;margin-top:auto;padding-top:14px;opacity:.96;flex-wrap:wrap}
.hero.v2 .h-wx .w-ic{font-size:20px}
.hero.v2 .h-divider{width:1px;background:rgba(255,255,255,.22);margin:4px 0;flex:none}
.hero.v2 .h-right{flex:1.3;min-width:260px;display:flex;flex-direction:column;gap:10px;text-align:left}
.hero.v2 .h-actions{
  display:flex;gap:9px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap;
  padding-top:14px;border-top:1px solid rgba(255,255,255,.18);
}
.hero.v2 .h-actions .btn{
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);
  color:#fff;min-height:34px;padding:0 13px;font-size:12.5px;
}
.hero.v2 .h-actions .btn:hover{background:rgba(255,255,255,.26)}

.z-top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.z-name{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700}
.z-ic{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:18px}
.z-stars{font-size:17px;letter-spacing:1px;color:#ffe9a8}
.z-stars span{font-size:13px;color:#fff;margin-left:6px;letter-spacing:0;opacity:.9}
.z-tags{display:flex;gap:8px;flex-wrap:wrap}
.z-tag{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16);
  border-radius:999px;padding:4px 10px;color:#fff;
}
.z-tag i{font-style:normal;opacity:.72;font-size:10.5px}
.z-yiji{display:flex;gap:8px;flex-wrap:wrap}
.z-yi,.z-ji{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}
.z-yi{background:rgba(22,163,74,.22);color:#d1fae5}
.z-ji{background:rgba(239,68,68,.20);color:#fee2e2}
.z-tip{font-size:13px;opacity:.88;line-height:1.5}

/* ---------- 学习进度独立卡片 ---------- */
.learn-card{padding:18px 22px;cursor:pointer;transition:.15s}
.learn-card:hover{border-color:#cfd4ea}
.learn-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}
.learn-head .card-hd{margin-bottom:0;flex:none}
.learn-sub{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.learn-pct{font-size:34px;font-weight:700;letter-spacing:-1.5px;color:var(--brand);line-height:1}
.learn-pct small{font-size:13px;font-weight:600;margin-left:2px}
.progress-bar{height:8px;border-radius:99px;background:var(--bg-soft);overflow:hidden}
.progress-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}

/* ---------- 表格 ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{
  text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;
  padding:8px 10px;border-bottom:1px solid var(--line);
}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}

/* ---------- 工具格 ---------- */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tool{
  display:flex;flex-direction:column;gap:6px;padding:14px 15px;
  border:1px solid var(--line);border-radius:13px;background:var(--card);
  box-shadow:var(--sh-sm);cursor:pointer;transition:.15s;min-height:88px;position:relative;
}
.tool:hover{border-color:#cfd4ea;transform:translateY(-1px);box-shadow:var(--sh)}
.tool .ti{font-size:20px}
.tool .tn{font-size:14px;font-weight:600;word-break:break-word}
.tool .tc{font-size:11.5px;color:var(--ink-3)}
.tool .tx{
  position:absolute;top:6px;right:6px;opacity:0;font-size:12px;color:var(--ink-3);
}
.tool:hover .tx{opacity:.7}

/* ---------- 数据管理 ---------- */
.danger-zone{border:1px solid #fbcaca;background:linear-gradient(180deg,#fffafa,#fff);border-radius:var(--r);padding:18px 20px}

/* ============================================================
   模块宫格（首页 · INS 风格图标入口）
   ============================================================ */
.tone,.m-ic,.nav-item .ic.t1,.nav-item .ic.t2,.nav-item .ic.t3,.nav-item .ic.t4,
.nav-item .ic.t5,.nav-item .ic.t6,.nav-item .ic.t7,.nav-item .ic.t8,.nav-item .ic.t9{color:#fff}
.t1,.m-ic.t1,.nav-item .ic.t1{background:linear-gradient(135deg,#6d5efc,#8b7cff)}
.t2,.m-ic.t2,.nav-item .ic.t2{background:linear-gradient(135deg,#22c1c3,#4bd6d0)}
.t3,.m-ic.t3,.nav-item .ic.t3{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.t4,.m-ic.t4,.nav-item .ic.t4{background:linear-gradient(135deg,#16a34a,#4ade80)}
.t5,.m-ic.t5,.nav-item .ic.t5{background:linear-gradient(135deg,#3b82f6,#60a5fa)}
.t6,.m-ic.t6,.nav-item .ic.t6{background:linear-gradient(135deg,#ec4899,#f472b6)}
.t7,.m-ic.t7,.nav-item .ic.t7{background:linear-gradient(135deg,#0ea5e9,#38bdf8)}
.t8,.m-ic.t8,.nav-item .ic.t8{background:linear-gradient(135deg,#8b5cf6,#c084fc)}
.t9,.m-ic.t9,.nav-item .ic.t9{background:linear-gradient(135deg,#f97316,#fb923c)}
.nav-item .ic{border-radius:7px;width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.nav-item:not(.on) .ic{box-shadow:0 2px 6px rgba(27,31,53,.12)}

.mod-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:10px;margin-bottom:18px}
.mod{
  position:relative;border:1px solid var(--line);background:var(--card);border-radius:var(--r);
  box-shadow:var(--sh-sm);cursor:pointer;padding:14px 8px 12px;min-height:104px;
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:.16s;
}
.mod:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:#d5daee}
.mod:active{transform:translateY(0)}
.mod.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(109,94,252,.14),var(--sh)}
.mod .m-ic{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  font-size:19px;color:#fff;box-shadow:0 5px 12px rgba(27,31,53,.16);flex:none;
}
.mod .m-lb{font-size:12.5px;font-weight:600;color:var(--ink);text-align:center;line-height:1.3}
.mod .m-sb{display:none;font-size:10.5px;color:var(--ink-3);text-align:center;line-height:1.2}
.mod .m-n{
  position:absolute;top:8px;right:8px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;
  background:var(--bg-soft);color:var(--ink-2);font-size:11px;font-weight:700;
  display:grid;place-items:center;font-variant-numeric:tabular-nums;
}
.mod .m-n i{font-style:normal;font-size:9px;margin-left:1px;font-weight:600}
.mod .m-n.hot{background:var(--danger-soft);color:var(--danger)}
.mod.on .m-n{background:var(--brand-soft);color:var(--brand)}

/* ---------- 写作入口卡 ---------- */
.entry-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:18px}
.entry{
  display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;
  border:1px solid var(--line);background:var(--card);border-radius:var(--r);
  box-shadow:var(--sh);padding:16px 18px;min-height:76px;transition:.15s;
}
.entry:hover{border-color:#d5daee;transform:translateY(-1px);box-shadow:var(--sh)}
.entry .e-ic{
  width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;
  font-size:21px;color:#fff;box-shadow:0 5px 12px rgba(27,31,53,.14);
}
.entry .e-b{flex:1;min-width:0;display:flex;flex-direction:column}
.entry .e-b b{font-size:15px;font-weight:700}
.entry .e-b i{font-style:normal;font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .e-go{font-size:13px;color:var(--brand);font-weight:600;flex:none}

/* ---------- 柱状图 ---------- */
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}
.bar-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar-wrap i{
  display:block;width:100%;max-width:34px;border-radius:7px 7px 0 0;
  background:linear-gradient(180deg,var(--brand),#8b7cff);min-height:3px;transition:height .3s;
}
.bar-col.hot .bar-wrap i{background:linear-gradient(180deg,#22c1c3,#4bd6d0)}
.bar-wrap i.zero{background:var(--bg-soft)}
.bar-wrap i.danger{background:linear-gradient(180deg,#ef4444,#f97316)}
.bar-col b{font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bar-col span{font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis}

/* ---------- 横向堆叠条 ---------- */
.hbars{display:flex;flex-direction:column;gap:11px}
.hb .hb-t{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.hb .hb-t b{color:var(--ink);font-variant-numeric:tabular-nums}
.hb .hb-b{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--bg-soft)}
.hb .hb-b i{display:block;height:100%}
.hb .hb-b i.d{background:linear-gradient(90deg,#16a34a,#4ade80)}
.hb .hb-b i.o{background:#e6e9f5}

/* ---------- 键值列表 ---------- */
.kv{display:flex;flex-direction:column}
.kv .kv-r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;color:var(--ink-2)}
.kv .kv-r:last-child{border-bottom:none}
.kv .kv-r b{color:var(--ink);font-weight:700}

.stat-row.s3{grid-template-columns:repeat(3,1fr)}
.proj.dim{opacity:.62}

/* ---------- 底部 tab（移动端） ---------- */
.tabbar{display:none}

/* ============================================================
   首页 V3：AI 每日一句 / 时间天气 / 星座运势 / 任务卡 / 自动化 / 页脚
   ============================================================ */

/* AI 每日一句 V2 */
.ai-quote.v2{
  display:flex;align-items:center;gap:18px;
  background:linear-gradient(90deg,#f7f5ff,#f0fcfc);
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:18px 22px;margin-bottom:18px;
  position:relative;overflow:hidden;
}
.ai-quote.v2::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}
.aq-pet{flex:none;position:relative}
.pet-avatar{
  width:72px;height:72px;cursor:pointer;position:relative;
  border-radius:50%;background:#fff;box-shadow:0 6px 16px rgba(109,94,252,.22);
  transition:transform .15s;
}
.pet-avatar:hover{transform:scale(1.05) rotate(-3deg)}
.pet-avatar:active{transform:scale(.95)}
.pet-bubble{
  position:absolute;left:78px;top:8px;white-space:nowrap;
  background:#1b1f35;color:#fff;font-size:12.5px;font-weight:600;
  padding:7px 12px;border-radius:10px;box-shadow:0 6px 14px rgba(27,31,53,.18);
  opacity:1;transform:translateY(0);transition:.18s;
}
.pet-bubble.hidden{opacity:0;transform:translateY(6px);pointer-events:none}
.pet-bubble::before{
  content:"";position:absolute;left:-5px;top:12px;width:0;height:0;
  border-top:5px solid transparent;border-bottom:5px solid transparent;
  border-right:6px solid #1b1f35;
}
.aq-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.aq-top{display:flex;align-items:center;gap:10px}
.aq-tag{
  flex:none;font-size:11px;font-weight:700;color:var(--brand);
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;
}
.aq-date{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.aq-marquee{overflow:hidden;position:relative;white-space:nowrap}
.aq-track{
  display:inline-block;padding-left:100%;
  font-size:15.5px;color:var(--ink-2);font-weight:500;
  animation:marquee 24s linear infinite;
}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* Hero V3 */
.hero.v3{
  background:linear-gradient(120deg,#6d5efc 0%,#9b5cf6 42%,#ef6bd0 76%,#f472b6 100%);
  border-radius:20px;padding:16px 20px 18px;color:#fff;
  box-shadow:0 14px 34px rgba(124,92,252,.26);
  margin-bottom:16px;position:relative;overflow:hidden;
}
.hero.v3::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(500px 300px at 10% 20%, rgba(255,255,255,.20) 0%, transparent 60%),
    radial-gradient(400px 260px at 90% 80%, rgba(255,255,255,.12) 0%, transparent 55%),
    radial-gradient(360px 220px at 100% 0%, rgba(34,193,195,.26) 0%, transparent 62%);
  pointer-events:none;
}
.hero.v3 .h-main{
  display:grid;grid-template-columns:1fr 1.15fr;gap:18px;
  position:relative;z-index:1;align-items:stretch;
}
.hero.v3 .h-left{
  display:flex;flex-direction:column;gap:4px;
  padding:2px 0;
}
.hero.v3 .h-greet{font-size:14px;font-weight:500;opacity:.94;margin-bottom:0}
.hero.v3 .h-greet b{font-weight:700}
.hero.v3 .h-clock{
  font-family:var(--mono);font-size:36px;font-weight:700;
  letter-spacing:-1.5px;line-height:1;margin-top:2px;
  text-shadow:0 4px 14px rgba(0,0,0,.12);
}
.hero.v3 .h-date{font-size:13.5px;opacity:.9;margin-top:2px}
.hero.v3 .h-wx{
  display:flex;align-items:center;gap:9px;font-size:13px;margin-top:auto;
  padding-top:10px;opacity:.96;flex-wrap:wrap;
}
.hero.v3 .h-wx .w-ic{font-size:20px}
.hero.v3 .h-actions{
  display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;
}
.hero.v3 .h-actions .btn{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  color:#fff;min-height:30px;padding:0 12px;font-size:12px;border-radius:9px;
}
.hero.v3 .h-actions .btn:hover{background:rgba(255,255,255,.28)}
.hero.v3 .h-right{display:flex;align-items:stretch}

/* 星座运势卡片 */
.fortune-card{
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.22);
  border-radius:16px;padding:14px 16px;
  display:flex;flex-direction:column;gap:9px;
  flex:1;
}
.fc-hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.fc-sign{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
.fc-sign .fc-ic{
  width:32px;height:32px;border-radius:10px;
  background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:17px;
}
.fc-sign small{
  font-size:11.5px;font-weight:600;color:#fff;opacity:.82;
  background:rgba(255,255,255,.14);padding:3px 8px;border-radius:999px;
}
.fc-score{
  display:flex;align-items:flex-end;gap:2px;
  background:rgba(255,255,255,.18);border-radius:12px;padding:5px 11px;
}
.fc-score span{font-size:23px;font-weight:700;line-height:1}
.fc-score small{font-size:11px;opacity:.85;margin-bottom:3px}
.fc-stars{
  font-size:17px;letter-spacing:1.5px;color:#ffe9a8;
  display:flex;align-items:center;gap:10px;
}
.fc-stars span{
  font-size:13px;color:#fff;font-weight:600;
  background:rgba(255,255,255,.16);padding:3px 9px;border-radius:999px;
}
.fc-dims{display:flex;gap:8px;flex-wrap:wrap}
.fc-d{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.10);border-radius:999px;padding:4px 10px;
  font-size:12px;
}
.fc-d i{opacity:.75;font-style:normal}
.fc-d b{font-weight:700;font-size:13px}
.fc-d.h b{color:#ffd6e0}
.fc-d.m b{color:#fef3c7}
.fc-d.l b{color:#e5e7ff}
.fc-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.fc-tags span{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;
  background:rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;
}
.fc-tags i{font-style:normal;opacity:.7;font-size:10.5px}
.fc-yiji{display:flex;gap:8px;flex-wrap:wrap}
.fc-yi,.fc-ji{
  font-size:12px;font-weight:600;border-radius:999px;padding:4px 11px;
}
.fc-yi{background:rgba(22,163,74,.22);color:#d1fae5}
.fc-ji{background:rgba(239,68,68,.20);color:#fee2e2}
.fc-tip{font-size:13px;opacity:.9;line-height:1.55;margin-top:2px}

/* 任务统计卡 */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat-card{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:16px 18px;cursor:pointer;transition:.15s;
}
.stat-card:hover{border-color:#cfd4ea;transform:translateY(-1px)}
.stat-card .sc-ic{
  width:48px;height:48px;border-radius:15px;flex:none;
  display:grid;place-items:center;font-size:23px;
  background:linear-gradient(135deg,#6d5efc,#22c1c3);
  box-shadow:0 8px 16px rgba(109,94,252,.24);
}
.stat-card.s-warn .sc-ic{background:linear-gradient(135deg,#f59e0b,#f472b6);box-shadow:0 8px 16px rgba(245,158,11,.24)}
.stat-card.s-danger .sc-ic{background:linear-gradient(135deg,#ef4444,#f472b6);box-shadow:0 8px 16px rgba(239,68,68,.24)}
.stat-card.s-ok .sc-ic{background:linear-gradient(135deg,#22c1c3,#16a34a);box-shadow:0 8px 16px rgba(34,193,195,.24)}
.stat-card .sc-body{flex:1;min-width:0}
.stat-card .sc-lb{font-size:12.5px;color:var(--ink-3);font-weight:600}
.stat-card .sc-val{font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin-top:2px}
.stat-card .sc-val small{font-size:13px;font-weight:600;color:var(--ink-3);margin-left:2px}
.stat-card .sc-ft{font-size:12px;color:var(--ink-3);margin-top:3px}
.stat-card.s-ok .sc-val{color:var(--ok)}
.stat-card.s-warn .sc-val{color:#b45309}
.stat-card.s-danger .sc-val{color:var(--danger)}

/* 自动化列表 */
.auto-list{display:flex;flex-direction:column;gap:10px}
.auto-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:13px 14px;border-radius:13px;border:1px solid var(--line-2);
  background:#fcfcff;transition:.15s;
}
.auto-item:hover{background:#f8f9ff;border-color:#e0e5f5}
.auto-item.on{border-left:3px solid var(--ok);background:linear-gradient(90deg,#f6fdf9,#fff 40%)}
.auto-item.off{border-left:3px solid var(--ink-3);background:linear-gradient(90deg,#f9f9fb,#fff 40%)}
.auto-item .ai-dot{
  width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px;
  background:var(--ink-3);
}
.auto-item.on .ai-dot{background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.12)}
.auto-item.off .ai-dot{background:#9ca3af}
.auto-item .ai-main{flex:1;min-width:0}
.auto-item .ai-name{
  font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.auto-item .ai-tag{
  font-size:10.5px;font-weight:600;color:var(--brand);
  background:var(--brand-soft);padding:2px 8px;border-radius:999px;
}
.auto-item .ai-meta{font-size:12px;color:var(--ink-3);margin-top:4px}
.auto-item .ai-desc{font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.45}
.auto-item .ai-acts{display:flex;gap:5px;flex:none;opacity:.6;transition:.15s}
.auto-item:hover .ai-acts{opacity:1}

/* 首页页脚 */
.home-footer{
  margin-top:36px;padding-top:26px;border-top:1px solid var(--line);
  color:var(--ink-3);position:relative;
}
.home-footer::before{
  content:"";position:absolute;top:-2px;left:0;right:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--brand),#ef6bd0,var(--brand-2));
  opacity:.75;
}
.hf-top{
  display:flex;align-items:flex-start;justify-content:space-between;gap:28px;flex-wrap:wrap;
}
.hf-brand{display:flex;align-items:flex-start;gap:14px;max-width:330px}
.hf-logo{
  width:46px;height:46px;border-radius:14px;flex:none;
  background:linear-gradient(135deg,var(--brand),#ef6bd0);
  display:grid;place-items:center;color:#fff;font-size:18px;font-weight:700;
  box-shadow:0 8px 18px rgba(109,94,252,.28);
}
.hf-title{font-size:16px;font-weight:700;color:var(--ink)}
.hf-desc{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.hf-tag{
  font-size:12px;color:var(--brand);margin-top:8px;
  background:var(--brand-soft);display:inline-block;padding:3px 10px;border-radius:999px;
}
.hf-cols{display:flex;gap:46px;flex-wrap:wrap}
.hf-col{display:flex;flex-direction:column;gap:9px}
.hf-col-h{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:1px}
.hf-link{color:var(--ink-3);font-size:13px;transition:.15s;display:inline-block}
.hf-link:hover{color:var(--brand);transform:translateX(2px)}
.hf-copy{
  font-size:12px;color:var(--ink-3);margin-top:22px;padding-top:16px;
  border-top:1px dashed var(--line);text-align:center;
}

/* ============================================================
   首页青春风点缀（INS / 青春）
   ============================================================ */
.sec-title h2{display:flex;align-items:center;gap:7px}
.sec-title .n{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;font-weight:700;padding:2px 10px;border-radius:999px;font-size:11.5px;
}
.card-hd .ico{
  width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
  font-size:15px;flex:none;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  box-shadow:0 4px 10px rgba(109,94,252,.22);
}
.card.click{cursor:pointer;transition:box-shadow .18s,transform .18s}
.card.click:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(27,31,53,.07),0 20px 44px rgba(27,31,53,.10)}
.ai-quote.v2{background:linear-gradient(105deg,#f3efff,#eefbfb 58%,#fff0f7)}
.pet-bubble{
  position:absolute;left:80px;top:6px;white-space:normal;max-width:300px;
  background:linear-gradient(135deg,#6d5efc,#ef6bd0);color:#fff;
  font-size:13px;font-weight:600;line-height:1.4;
  padding:9px 13px;border-radius:14px;box-shadow:0 8px 18px rgba(109,94,252,.30);
  opacity:1;transform:translateY(0);transition:.18s;
}
.pet-bubble::before{
  content:"";position:absolute;left:-5px;top:13px;width:0;height:0;
  border-top:5px solid transparent;border-bottom:5px solid transparent;
  border-right:6px solid #6d5efc;
}

/* ============================================================
   任务台账（ONES 字段：ONS-ID / 进度 / 完成情况 / 计划时间）
   ============================================================ */
.ons-badge{
  font-family:var(--mono);font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:7px;
  background:var(--brand-soft);color:var(--brand);
  border:1px solid rgba(109,94,252,.18);white-space:nowrap;
}
.ons-badge.none{background:var(--bg-soft);color:var(--ink-3);border-color:transparent}
.ones-meta{margin-top:4px}
.prog-chip{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  height:19px;min-width:66px;padding:0 9px;border-radius:999px;overflow:hidden;
  background:var(--bg-soft);font-size:11px;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--ink-2);
}
.prog-chip i{position:absolute;left:0;top:0;bottom:0;background:currentColor;opacity:.18;z-index:0;transition:width .3s}
.prog-chip b{position:relative;z-index:1}
.prog-chip.ok{color:#10703c;background:var(--ok-soft)}
.prog-chip.doing{color:var(--brand);background:var(--brand-soft)}
.prog-chip.todo,.prog-chip.mut{color:var(--ink-3)}
.plan-chip{
  font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  background:var(--bg-soft);padding:2px 8px;border-radius:7px;white-space:nowrap;
}

.led-filters{display:grid;grid-template-columns:minmax(200px,1.6fr) repeat(4,minmax(118px,1fr));gap:9px}
.led-filters input,.led-filters select{width:100%;min-width:0}
.chip-sep{width:1px;height:20px;background:var(--line);margin:0 3px;align-self:center}
.led-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px 2px}
.led{min-width:890px;display:flex;flex-direction:column}
.led-hd,.led-row{
  display:grid;
  grid-template-columns:88px minmax(230px,1fr) 70px 106px 84px 158px 96px;
  gap:12px;align-items:center;
}
.led-hd{
  font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.4px;
  padding:0 10px 8px;border-bottom:1.5px solid var(--line);
}
.led-row{
  padding:11px 10px;border-bottom:1px solid var(--line-2);
  transition:background .14s;
}
.led-row:hover{background:var(--bg-soft)}
.led-row:last-child{border-bottom:none}
.led-row.done .lt{color:var(--ink-3)}
.led-row .lc-main{min-width:0;overflow:hidden}
.led-row .lt{font-size:14px;font-weight:600;word-break:break-word;display:flex;align-items:flex-start;gap:6px;line-height:1.45}
.led-row .lm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;overflow:hidden}
.led-row .lm .tag.brand{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
.led-row .lc-owner{font-size:13px;color:var(--ink-2);white-space:nowrap}
.led-row .lc-st{display:flex}
.led-row .lc-plan{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.55}
.led-row .lc-plan .arw{color:var(--brand);font-weight:700}
.led-row .lc-acts{display:flex;gap:4px;opacity:.5;transition:.15s;justify-content:flex-end}
.led-row:hover .lc-acts{opacity:1}
.led-row .lc-prog{display:flex}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:1400px){
  .mod-grid{grid-template-columns:repeat(9,1fr)}
}
@media (max-width:1080px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .mod-grid{grid-template-columns:repeat(5,1fr)}
}
@media (max-width:880px){
  .sidebar{display:none}
  .tabbar{
    display:block;position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  .tabbar .tb-in{display:flex;gap:2px;min-width:100%}
  .tabbar button{
    flex:1 0 auto;min-width:62px;border:none;background:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 2px;min-height:52px;color:var(--ink-3);font-size:10.5px;border-radius:10px;
  }
  .tabbar button.on{color:var(--brand);background:var(--brand-soft)}
  .tabbar .ic{font-size:16px;line-height:1;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff}
  .view{padding:16px 14px 110px}
  .topbar{padding:12px 14px}
  .topbar .ttl{font-size:16px;width:100%}
  .topbar .clock{display:none}
  .card{padding:16px 15px;border-radius:14px}
  .grid-2,.grid-3,.kpi-grid,.stat-row,.stat-row.s3,.today-top{grid-template-columns:1fr}
  .mod-grid{grid-template-columns:repeat(3,1fr)}
  .entry-grid{grid-template-columns:1fr}
  .bars{height:130px;gap:4px}
  .f-row,.f-row-3{grid-template-columns:1fr}
  .led-filters{grid-template-columns:1fr 1fr}
  .hero{padding:20px 18px;border-radius:16px}
  .hero .h-clock{font-size:32px}
  .hero .h-right{margin-left:0;text-align:left;width:100%}
  .hero .h-ft{gap:16px}
  .row .acts{opacity:1}
  .modal{max-height:92vh}
  .mask{padding:12px;align-items:flex-end}
  .modal{border-radius:18px 18px 0 0;max-height:92vh}
  .modal-ft .btn{flex:1;min-width:120px}
  .f-row-3{grid-template-columns:1fr}
}
@media (max-width:400px){
  .kpi .val{font-size:24px}
  .tools{grid-template-columns:1fr 1fr}
}

/* ============================================================
   AI 资讯：资讯框（AI HOT Top 10）
   ============================================================ */
.news-list{display:flex;flex-direction:column}
.news-row{display:flex;gap:13px;padding:13px 2px;border-top:1px solid var(--line-2)}
.news-row:first-child{border-top:0;padding-top:2px}
.news-n{
  flex:none;width:26px;height:26px;border-radius:9px;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);
}
.news-row:nth-child(-n+3) .news-n{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
.news-b{flex:1;min-width:0}
.news-t{display:block;font-size:14.5px;font-weight:600;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.news-t:hover{color:var(--brand)}
.news-m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.news-src{font-size:12px;color:var(--ink-3);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news-time{font-size:12px;color:var(--ink-3)}
.news-sum{
  margin-top:7px;font-size:13px;line-height:1.62;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.news-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.news-foot a{font-weight:600}

/* ============================================================
   AI 资讯：公众号精选卡片
   ============================================================ */
.art-card{
  display:flex;flex-direction:column;gap:9px;padding:16px 18px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);transition:border-color .16s,box-shadow .16s;
}
.art-card:hover{border-color:var(--brand);box-shadow:0 6px 16px rgba(109,94,252,.13),0 16px 34px rgba(109,94,252,.10)}
.art-src{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.art-t{font-size:15px;font-weight:700;line-height:1.52}
.art-t a{color:var(--ink)}
.art-t a:hover{color:var(--brand)}
.art-sum{
  font-size:13px;line-height:1.66;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
}
.art-f{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:4px}
.art-hd{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.art-cat{background:var(--bg-soft);color:var(--ink-2)}
.art-star{font-size:14px;color:#f59e0b;line-height:1}
.art-card.starred{border-color:rgba(245,158,11,.55)}
/* 来源类型：公众号 = 品牌渐变；腾讯社区 = 中性 */
.art-src-we{background:var(--brand-soft);color:var(--brand);border-color:rgba(109,94,252,.35)}
.art-src-co{background:var(--bg-soft);color:var(--ink-3)}
/* 用到的技能小标签 */
.art-skills{display:flex;gap:6px;flex-wrap:wrap}
.art-skill{
  font-size:11.5px;line-height:1.5;padding:2px 8px;border-radius:999px;
  background:#f0fbfb;color:#0f766e;border:1px solid rgba(34,193,195,.30);white-space:nowrap;
}
.btn.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}

/* 每日 AI 资讯：热度榜 / 火花 / 底部 #标签 */
.news-fire{margin-right:5px;font-size:13px}
.news-heat{
  font-size:11.5px;font-weight:700;color:#b45309;background:#fff7e6;
  padding:1px 7px;border-radius:99px;font-variant-numeric:tabular-nums;line-height:1.7;
}
.news-tags{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px}
.news-tag{font-size:12px;font-weight:600;color:var(--brand);letter-spacing:.2px}

/* ============================================================
   FDE 学习 · 90 天计划
   ============================================================ */
.fde-kpi{margin-bottom:18px}
.fde-kpi .stat.ic .n{font-size:29px}

/* 三个阶段 */
.fde-phases{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fde-phase{
  border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;
  background:linear-gradient(180deg,#fff,var(--bg-soft));position:relative;overflow:hidden;
}
.fde-phase::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc,var(--brand))}
.fp-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fp-top b{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.3px}
.fp-pct{font-size:19px;font-weight:800;color:var(--pc,var(--brand));letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.fp-t{font-size:14px;font-weight:700;margin-top:2px}
.fp-h{font-size:12.5px;color:var(--ink-2);margin-top:3px;font-weight:600}
.fp-p{font-size:12px;color:var(--ink-3);line-height:1.6;margin-top:5px}
.fde-phase .progress-bar{margin-top:9px}
.fp-n{font-size:11.5px;color:var(--ink-3);margin-top:5px}

/* 周卡片 */
.fde-week{margin-bottom:12px;padding:0;overflow:hidden}
.fde-week>.fw-head{
  display:flex;align-items:center;gap:11px;padding:14px 18px;cursor:pointer;transition:.15s;
  border-left:4px solid var(--wc,var(--brand));
}
.fde-week>.fw-head:hover{background:var(--bg-soft)}
.fw-arrow{font-size:12px;color:var(--ink-3);width:12px;flex:none}
.fw-n{
  flex:none;color:#fff;font-size:12px;font-weight:800;letter-spacing:.3px;
  padding:4px 9px;border-radius:8px;
}
.fw-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fw-main b{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fw-range{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fw-prog{flex:none;display:flex;align-items:center;gap:8px}
.fw-prog .fp-n{margin:0;font-variant-numeric:tabular-nums}
.fw-bar{display:block;width:70px;height:6px;border-radius:99px;background:var(--line-2);overflow:hidden}
.fw-bar i{display:block;height:100%;border-radius:99px}
.fw-min{flex:none;font-size:12px;color:var(--ink-3);white-space:nowrap}
.fw-body{border-top:1px solid var(--line-2);padding:14px 18px 6px;background:#fcfcfe}
.fw-meta{margin-bottom:12px}
.fwm-row{display:flex;gap:10px;font-size:12.5px;line-height:1.7;margin-bottom:3px}
.fwm-k{
  flex:none;width:74px;color:var(--ink-3);font-weight:600;
}
.fwm-v{color:var(--ink-2);min-width:0}

/* 每日条目 */
.fde-days{display:flex;flex-direction:column;gap:7px}
.fde-day{border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;overflow:hidden}
.fde-day.done{border-color:rgba(22,163,74,.4);background:#fbfefc}
.fd-head{display:flex;align-items:center;gap:10px;padding:10px 13px}
.fd-cb{
  flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:12px;color:#fff;cursor:pointer;transition:.15s;background:#fff;
}
.fd-cb:hover{border-color:var(--ok);background:var(--ok-soft)}
.fde-day.done .fd-cb{background:var(--ok);border-color:var(--ok)}
.fd-n{
  flex:none;font-size:11.5px;font-weight:800;color:var(--brand);background:var(--brand-soft);
  padding:3px 8px;border-radius:7px;letter-spacing:.3px;font-variant-numeric:tabular-nums;
}
.fde-day.done .fd-n{color:var(--ok);background:var(--ok-soft)}
.fd-t{flex:1;min-width:0;font-size:13.5px;font-weight:600;cursor:pointer}
.fd-t:hover{color:var(--brand)}
.fde-day.done .fd-t{color:var(--ink-2)}
.fd-min{flex:none;font-size:12px;color:var(--ink-3);white-space:nowrap}
.fd-arrow{flex:none;font-size:11px;color:var(--ink-3);cursor:pointer;padding:0 3px}
.fd-body{border-top:1px dashed var(--line);padding:12px 14px 14px;background:#fcfcfe}
.fd-sec{margin-bottom:13px}
.fd-sec:last-child{margin-bottom:0}
.fd-sh{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:7px;letter-spacing:.2px}
.fd-steps{margin:0;padding-left:20px;font-size:13px;line-height:1.8;color:var(--ink-2)}
.fd-steps li{margin-bottom:3px}
.fd-concept{
  border-left:3px solid var(--brand);background:#fff;border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:11px 14px;
}
.fd-concept b{font-size:13.5px;display:block;margin-bottom:4px}
.fd-concept p{margin:0;font-size:12.8px;line-height:1.75;color:var(--ink-2)}
.fd-code{
  margin:0;padding:13px 15px;background:#1b1f35;color:#e6e9f5;border-radius:var(--r-sm);
  font-family:var(--mono);font-size:12.2px;line-height:1.7;overflow-x:auto;white-space:pre;
}
.fd-chips{display:flex;gap:7px;flex-wrap:wrap}
.fd-chip{
  font-size:12px;color:var(--ink-2);background:var(--bg-soft);border:1px solid var(--line);
  padding:3px 10px;border-radius:99px;
}
.fd-quiz{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px}
.fdq-q{font-size:13px;font-weight:600;line-height:1.7}
.fdq-a{font-size:12.8px;line-height:1.75;color:var(--ink-2);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.fdq-tag{
  display:inline-block;font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-soft);
  padding:1px 7px;border-radius:6px;margin-right:6px;
}

/* 概念词典 */
.fde-gsearch{margin-bottom:11px}
.fde-gsearch input{
  width:100%;min-height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg-soft);font-size:14px;color:var(--ink);font-family:var(--sans);
}
.fde-gsearch input:focus{outline:none;border-color:var(--brand);background:#fff}
.fde-gloss{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.fg-item{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:#fff}
.fg-t{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13.5px;font-weight:700;margin-bottom:5px}
.fg-en{font-size:12px;font-weight:500;color:var(--ink-3);font-family:var(--mono)}
.fg-d{font-size:12.6px;line-height:1.72;color:var(--ink-2)}

/* 练习题库 */
.fde-exs{display:flex;flex-direction:column;gap:11px}
.fe-item{border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;background:#fff}
.fe-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.fe-n{
  font-size:11.5px;font-weight:800;color:var(--brand);background:var(--brand-soft);
  padding:2px 8px;border-radius:7px;letter-spacing:.3px;
}
.fe-t{font-size:13.8px;font-weight:700}
.fe-d{font-size:12.8px;line-height:1.72;color:var(--ink-2)}
.fe-x{font-size:12.4px;line-height:1.7;color:var(--ink-3);margin-top:6px}
.fe-xk{
  display:inline-block;font-size:11px;font-weight:700;color:var(--ink-2);background:var(--bg-soft);
  padding:1px 7px;border-radius:6px;margin-right:6px;
}
.fe-fold{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}
.fe-fold-h{font-size:12.4px;font-weight:600;color:var(--brand);cursor:pointer;user-select:none}
.fe-fold-b{display:none;margin-top:9px}
.fe-fold.on .fe-fold-b{display:block}
.fe-fold.on .fe-fold-h{color:var(--ink-3)}

/* 验收清单 */
.fde-checks{display:flex;flex-direction:column;gap:16px}
.fc-g{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;margin-bottom:8px}
.fc-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fc-item{
  display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px 12px;background:#fff;cursor:pointer;transition:.15s;
}
.fc-item:hover{border-color:#cfd4ea}
.fc-item.on{background:var(--ok-soft);border-color:rgba(22,163,74,.4)}
.fc-item input{margin-top:2px;flex:none;accent-color:var(--ok)}
.fc-t{font-size:12.8px;line-height:1.6;color:var(--ink-2)}
.fc-t em{display:block;font-style:normal;font-size:11.8px;color:var(--ink-3);margin-top:2px}
.fc-item.on .fc-t{color:var(--ink)}

/* 数据来源条 */
.fde-src{margin-top:18px}
.fs-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.4px;margin-bottom:6px}
.fs-k{
  flex:none;font-weight:700;color:var(--ink-3);background:var(--bg-soft);
  padding:2px 8px;border-radius:6px;
}
.fs-v{color:var(--ink-2);font-family:var(--mono);font-size:12px;word-break:break-all;min-width:0}
.fs-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fs-tip{font-size:12px;line-height:1.7;color:var(--ink-3);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.fs-tip code{font-family:var(--mono);font-size:11.6px;background:var(--bg-soft);padding:1px 6px;border-radius:5px}

/* 首页学习卡片尾部 */
.learn-foot{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.2px;color:var(--ink-3);
}
.learn-foot .btn{margin-left:auto}

/* ============================================================
   FDE 学习 · AI 知识练习
   ============================================================ */
.qm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.qm-card{
  display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer;transition:.15s;
  border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:#fff;
  font-family:var(--sans);
}
.qm-card:hover{border-color:#cfd4ea;background:var(--bg-soft)}
.qm-card.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 4px 14px rgba(109,94,252,.13)}
.qm-ic{font-size:19px;flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg-soft)}
.qm-card.on .qm-ic{background:#fff}
.qm-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.qm-b b{font-size:13.4px;font-weight:700;color:var(--ink)}
.qm-b em{font-style:normal;font-size:11.6px;color:var(--ink-3);line-height:1.5}
.qm-n{flex:none;font-size:12px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.qm-tag{flex:none;font-size:11px;color:var(--ink-3);background:var(--bg-soft);padding:2px 7px;border-radius:6px}
.quiz-size{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.qs-l{font-size:13px;font-weight:700;color:var(--ink-2);margin-right:2px}
.qs-tip{font-size:12px;color:var(--ink-3);margin-left:4px}
.fq-start{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* 各知识点正确率 */
.fq-mods{display:flex;flex-direction:column;gap:9px}
.fqm-row{display:flex;align-items:center;gap:10px}
.fqm-n{flex:none;width:172px;font-size:12.6px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fqm-bar{flex:1;height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.fqm-bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.fqm-bar i.ok{background:linear-gradient(90deg,#22c1c3,#16a34a)}
.fqm-bar i.warn{background:linear-gradient(90deg,#f59e0b,#f472b6)}
.fqm-bar i.danger{background:linear-gradient(90deg,#ef4444,#f472b6)}
.fqm-p{flex:none;width:76px;text-align:right;font-size:12.6px;font-weight:700;font-variant-numeric:tabular-nums}
.fqm-p em{display:block;font-style:normal;font-size:11px;font-weight:500;color:var(--ink-3)}
.fq-weak{font-size:12.4px;color:var(--ink-3);margin-top:13px;padding-top:11px;border-top:1px dashed var(--line)}
.fq-weak-b{
  font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);
  border:1px solid rgba(109,94,252,.25);border-radius:99px;padding:3px 11px;margin-left:6px;cursor:pointer;
}
.fq-weak-b:hover{background:var(--brand);color:#fff}

/* 得分记录 */
.fq-hist{display:flex;flex-direction:column;gap:8px}
.fq-h-row{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
.fq-h-s{
  flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;
}
.fq-h-s.ok{background:var(--ok-soft);color:var(--ok)}
.fq-h-s.warn{background:var(--warn-soft);color:#b45309}
.fq-h-s.danger{background:var(--danger-soft);color:var(--danger)}
.fq-h-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fq-h-b b{font-size:13.2px}
.fq-h-b em{font-style:normal;font-size:11.8px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fq-h-m{flex:none;text-align:right;font-size:11.6px;color:var(--ink-3);line-height:1.55}

/* 答题页 */
.fq-top{margin-bottom:14px}
.fq-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fq-prog{font-size:13.4px;color:var(--ink-2)}
.fq-prog b{font-size:16px;color:var(--brand);font-variant-numeric:tabular-nums}
.fq-timer{
  font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink-2);
  background:var(--bg-soft);padding:3px 10px;border-radius:8px;font-variant-numeric:tabular-nums;
}
.fq-done{font-size:12.4px;color:var(--ink-3)}
.fq-bar .btn{margin-left:auto}
.fq-nav{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.fq-nav-b{
  width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font-size:11.6px;font-weight:700;color:var(--ink-3);cursor:pointer;transition:.15s;
  font-variant-numeric:tabular-nums;padding:0;
}
.fq-nav-b:hover{border-color:var(--brand);color:var(--brand)}
.fq-nav-b.done{background:var(--brand-soft);color:var(--brand);border-color:rgba(109,94,252,.3)}
.fq-nav-b.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.fq-qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.fq-q{font-size:16px;font-weight:700;line-height:1.72;margin-bottom:16px}
.fq-opts{display:flex;flex-direction:column;gap:9px}
.fq-opt{
  display:flex;align-items:flex-start;gap:11px;text-align:left;cursor:pointer;transition:.15s;
  border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 15px;background:#fff;
  font-size:13.6px;line-height:1.65;color:var(--ink-2);font-family:var(--sans);
}
.fq-opt:hover{border-color:#cfd4ea;background:var(--bg-soft)}
.fq-opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--ink);font-weight:600}
.fq-key{
  flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  font-size:12px;font-weight:800;background:var(--bg-soft);color:var(--ink-3);
}
.fq-opt.on .fq-key{background:var(--brand);color:#fff}
.fq-foot{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:20px;padding-top:15px;border-top:1px dashed var(--line)}
.fq-foot .btn.ok{margin-left:auto}
.fq-foot .btn[disabled]{opacity:.45;cursor:not-allowed}

/* 结果页 */
.fq-res{margin-bottom:16px}
.fq-res-top{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.fq-res-b{flex:1;min-width:240px}
.fq-res-kv{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);margin-top:9px}
.fq-res-kv b{color:var(--ink);font-size:14.5px}
.fq-res-kv b.ok{color:var(--ok)} .fq-res-kv b.warn{color:#b45309} .fq-res-kv b.danger{color:var(--danger)}
.fq-res-acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.fq-review{display:flex;flex-direction:column;gap:11px}
.fq-rv{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 15px;background:#fff;border-left-width:4px}
.fq-rv.ok{border-left-color:var(--ok)}
.fq-rv.bad{border-left-color:var(--danger)}
.fq-rv-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fq-rv-n{
  flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;
  font-size:11.5px;font-weight:800;background:var(--bg-soft);color:var(--ink-3);
}
.fq-rv-s{flex:none;font-size:14px;font-weight:800}
.fq-rv.ok .fq-rv-s{color:var(--ok)} .fq-rv.bad .fq-rv-s{color:var(--danger)}
.fq-rv-t{flex:1;min-width:180px;font-size:13.4px;font-weight:600;line-height:1.6}
.fq-rv-b{display:flex;flex-direction:column;gap:5px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:12.6px;line-height:1.7;color:var(--ink-2)}
.fq-rv-b i{font-style:normal;display:inline-block;font-size:11px;font-weight:700;color:var(--ink-3);background:var(--bg-soft);padding:1px 7px;border-radius:6px;margin-right:7px}
.fq-rv-a{color:var(--ok);font-weight:600}
.fq-rv-e{color:var(--ink-2)}
.fq-un{color:var(--danger);font-weight:600}

/* 错题本 */
.fq-wrong{display:flex;flex-direction:column;gap:12px}
.fqw-item{border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;background:#fff;border-left:4px solid var(--danger)}
.fqw-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.fqw-n{font-size:11.5px;font-weight:700;color:var(--danger);background:var(--danger-soft);padding:2px 8px;border-radius:99px}
.fqw-q{font-size:13.4px;font-weight:600;line-height:1.7}
.fqw-o{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.fqw-oo{font-size:12.6px;line-height:1.65;color:var(--ink-3);padding:5px 10px;border-radius:8px;background:var(--bg-soft)}
.fqw-oo.right{color:var(--ok);background:var(--ok-soft);font-weight:600}
.fqw-e{font-size:12.5px;line-height:1.72;color:var(--ink-2);margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.fqw-e i{font-style:normal;display:inline-block;font-size:11px;font-weight:700;color:var(--ink-3);background:var(--bg-soft);padding:1px 7px;border-radius:6px;margin-right:7px}

/* 窄屏 */
@media (max-width:900px){
  .fde-phases{grid-template-columns:1fr}
  .fde-gloss,.fc-list,.qm-grid{grid-template-columns:1fr}
  .fqm-n{width:118px}
  .fde-kpi{grid-template-columns:repeat(2,1fr)}
}

/* ============================================================
   技能库 · 技能 / 连接器
   ============================================================ */
.sk-tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sk-tab{
  display:flex;align-items:center;gap:7px;cursor:pointer;font-family:var(--sans);
  border:1px solid var(--line);background:#fff;color:var(--ink-2);
  padding:8px 15px;border-radius:11px;font-size:13.5px;font-weight:700;transition:.15s;
}
