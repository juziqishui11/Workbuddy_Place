.sk-tab:hover{border-color:#cfd4ea;color:var(--ink)}
.sk-tab.on{border-color:transparent;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 4px 14px rgba(109,94,252,.25)}
.sk-tab .n{font-size:11.5px;font-weight:800;background:var(--bg-soft);color:var(--ink-2);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.sk-tab.on .n{background:rgba(255,255,255,.26);color:#fff}
.sk-tab-sp{flex:1;min-width:8px}
.sk-search{margin-top:11px}
.sk-search input{
  width:100%;min-height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg-soft);font-size:14px;color:var(--ink);
}
.sk-search input:focus{outline:none;border-color:var(--brand);background:#fff}
.sk-catnote{
  display:flex;flex-direction:column;gap:3px;margin-top:12px;padding-top:11px;
  border-top:1px dashed var(--line);font-size:12px;color:var(--ink-3);line-height:1.6;
}
.sk-catnote b{color:var(--ink-2);margin-right:7px;font-weight:700}
.chip.dim{opacity:.48}

/* 卡片网格 */
.sk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:start}
.sk-card{
  --sk:var(--brand);
  background:var(--card);border:1px solid var(--line);border-top:3px solid var(--sk);
  border-radius:var(--r);padding:16px 18px 14px;box-shadow:var(--sh-sm);
  display:flex;flex-direction:column;gap:10px;
}
.sk-card.dim{opacity:.6}

/* 分类标签：卡片里最先看到的东西 */
.sk-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sk-badge{
  font-size:12px;font-weight:800;letter-spacing:.4px;color:#fff;background:var(--sk);
  padding:3px 11px;border-radius:999px;box-shadow:0 2px 8px rgba(27,31,53,.14);
}
.sk-or{font-size:11.5px;font-weight:600;color:var(--ink-3);background:var(--bg-soft);padding:2px 8px;border-radius:6px}
.sk-ver{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}

.sk-title{font-size:16.5px;font-weight:800;letter-spacing:-.2px;line-height:1.35}
.sk-id{font-family:var(--mono);font-size:11.8px;color:var(--ink-3);word-break:break-all;margin-top:-5px}
.sk-desc{font-size:13px;line-height:1.78;color:var(--ink-2)}

.sk-block{border-top:1px dashed var(--line);padding-top:10px}
.sk-bt{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:7px}
.sk-bt-tip{font-size:11px;font-weight:500;color:var(--brand);background:var(--brand-soft);padding:1px 8px;border-radius:999px}
.sk-steps{margin:0;padding-left:19px;font-size:12.6px;line-height:1.8;color:var(--ink-2)}
.sk-steps li{margin-bottom:2px}

.sk-prompts{display:flex;flex-direction:column;gap:6px}
.sk-p{
  display:flex;gap:8px;text-align:left;cursor:pointer;font-family:var(--sans);
  border:1px solid var(--line);background:var(--bg-soft);border-radius:var(--r-sm);
  padding:8px 11px;font-size:12.5px;line-height:1.6;color:var(--ink-2);transition:.15s;
}
.sk-p:hover{border-color:var(--sk);background:#fff;color:var(--ink)}
.sk-pi{flex:none;color:var(--ink-3);font-size:12px;line-height:1.7}
.sk-pt{flex:1;min-width:0;word-break:break-word}

.sk-foot{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin-top:auto;padding-top:11px;border-top:1px dashed var(--line);
}
.sk-tag{font-size:11.5px;color:var(--ink-3);background:var(--bg-soft);padding:2px 8px;border-radius:999px}
.sk-fsp{flex:1;min-width:6px}
.sk-card .btn.sm{padding:4px 9px;font-size:12px}
.btn.on-star{border-color:rgba(245,158,11,.55);background:var(--warn-soft);color:#a35c00}

/* 九种分类配色 */
.sk-card.c-write{--sk:#6d5efc}
.sk-card.c-visual{--sk:#0891b2}
.sk-card.c-media{--sk:#db2777}
.sk-card.c-data{--sk:#2563eb}
.sk-card.c-know{--sk:#d97706}
.sk-card.c-eng{--sk:#475569}
.sk-card.c-info{--sk:#0284c7}
.sk-card.c-collab{--sk:#16a34a}
.sk-card.c-sys{--sk:#e11d48}

.sk-help{font-size:12.6px;line-height:1.95;color:var(--ink-2)}
.sk-help div{margin-bottom:2px}
.sk-help code{font-family:var(--mono);font-size:11.6px;background:var(--bg-soft);padding:1px 6px;border-radius:5px;word-break:break-all}
/* 安装引导弹窗（市场优先 / 任务兜底） */
.sk-im-step{border:1px solid #e4e7f2;border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fafbff}
.sk-im-t{font-weight:700;font-size:13.5px;margin-bottom:4px;color:var(--ink)}
.sk-im-d{font-size:12.6px;line-height:1.8;color:var(--ink-2);margin-bottom:8px}
.sk-im-d b{color:var(--ink)}
.sk-im-btns{display:flex;gap:8px;flex-wrap:wrap}

/* 疑似重复 / 功能重叠 警告块 */
.sk-dup{margin:8px 0 2px;padding:8px 10px;border:1px dashed #f0a84b;border-radius:10px;background:rgba(245,158,11,.07)}
.sk-dup-row{font-size:12.4px;line-height:1.7;color:var(--ink-2)}
.sk-dup-row + .sk-dup-row{margin-top:4px}
.sk-dup-badge{display:inline-block;font-size:11px;font-weight:600;color:#b45309;background:#fde9c8;border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:middle}
.sk-dup-sug{display:inline-block;font-size:10.6px;font-weight:600;border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:middle}
.sk-dup-sug.d{color:#b91c1c;background:#fde2e2}
.sk-dup-sug.c{color:#b45309;background:#fde9c8}
.sk-dup-sug.m{color:#6d28d9;background:#ede9fe}
.sk-dup-sug.k{color:#15803d;background:#dcfce7}
.sk-tag.dup{color:#b45309;background:#fde9c8;border-color:#f6d28a}

/* 提示词行：复制 + 生成任务 */
.sk-prow{display:flex;gap:6px;align-items:stretch}
.sk-prow .sk-p{flex:1;min-width:0}
.sk-gen{flex:none;align-self:stretch;white-space:nowrap}

/* 技能启动器（命令框） */
.sk-cmd{background:linear-gradient(180deg,var(--brand-soft),var(--card));border:1px solid var(--line)}
.sk-cmd-hd{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:10px}
.sk-cmd-row{margin-bottom:8px}
.sk-cmd-sel{width:100%;max-width:360px}
.sk-cmd-subs{display:flex;flex-direction:column;gap:6px;margin:4px 0 10px}
.sk-cmd-subt{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.sk-cmd-hint{font-size:12px;color:var(--ink-3);font-style:italic}
.sk-chip{display:flex;align-items:center;gap:8px;background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 8px}
.sk-chip-t{flex:1;min-width:0;font-size:12.4px;line-height:1.6;color:var(--ink-2);word-break:break-word}
.sk-cmd-free{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.sk-cmd-free input{flex:1;min-width:200px}

/* SkillHub 每日推荐 */
.sk-hub-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.sk-hub-note{font-size:12px;line-height:1.7;color:var(--ink-2);flex:1;min-width:200px}
.sk-hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.sk-hub-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:8px}
.sk-hub-top{display:flex;align-items:center;gap:9px}
.sk-hub-ic{width:34px;height:34px;border-radius:9px;object-fit:cover;background:var(--bg-soft);flex:none}
.sk-hub-icx{display:flex;align-items:center;justify-content:center;color:var(--brand);font-size:18px;font-weight:800}
.sk-hub-name{font-size:15px;font-weight:800;line-height:1.35;flex:1;min-width:0;word-break:break-word}
.sk-hub-v{color:var(--ok);font-weight:900}
.sk-hub-ver{font-size:11px;color:var(--ink-3);font-family:var(--mono);flex:none}
.sk-hub-meta{font-size:11.6px;color:var(--ink-3);font-family:var(--mono)}
.sk-hub-desc{font-size:12.6px;line-height:1.7;color:var(--ink-2);max-height:5.1em;overflow:hidden}
.sk-hub-subs{display:flex;flex-wrap:wrap;gap:5px}
.sk-hub-sub{font-size:11px;color:var(--brand);background:var(--brand-soft);padding:1px 8px;border-radius:999px}
.sk-hub-foot{display:flex;gap:6px;margin-top:auto;padding-top:8px}

@media (max-width:900px){
  .sk-grid{grid-template-columns:1fr}
  .sk-tab-sp{display:none}
}

/* ============================================================
   文档库：两块（IMA 知识库 / Obsidian 仓库）+ 文件树
   ============================================================ */
.blk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh-sm);margin-bottom:14px}
.blk-hd{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.blk-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--bg-soft);border:1px solid var(--line);flex:none}
.blk-ima .blk-ic{background:linear-gradient(135deg,rgba(109,94,252,.14),rgba(34,193,195,.14));border-color:rgba(109,94,252,.24)}
.blk-obs .blk-ic{background:linear-gradient(135deg,rgba(124,77,252,.14),rgba(245,158,11,.14));border-color:rgba(245,158,11,.24)}
.blk-tt{flex:1;min-width:170px}
.blk-tt b{display:block;font-size:15.5px;font-weight:800;color:var(--ink)}
.blk-tt i{font-style:normal;font-size:12.4px;color:var(--ink-3);line-height:1.6}
.blk-acts{display:flex;gap:7px;flex-wrap:wrap}
.blk-note{margin-top:10px;font-size:12.4px;line-height:1.75;color:var(--ink-3);background:var(--bg-soft);border-radius:10px;padding:8px 11px}
.blk-note.warn{background:#fff7e6;color:#b45309}
.dx-path-inline{font-family:var(--mono);font-size:11.4px;word-break:break-all}

/* 库切换 */
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.tab{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg-soft);color:var(--ink-2);font-size:13px;font-family:inherit;cursor:pointer;transition:.15s}
.tab:hover{border-color:#d5daee}
.tab.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700}
.tab .n{font-size:11.4px;opacity:.72;font-family:var(--mono)}

/* 搜索行 */
.tree-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.tree-tools input{flex:1;min-width:200px}
.tt-cnt{font-size:12.2px;color:var(--ink-3)}
.tt-cnt a{color:var(--brand);cursor:pointer;text-decoration:underline}

/* 三大目录说明 */
.dx-maindirs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.dx-md{background:var(--bg-soft);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.dx-md b{display:block;font-size:12.8px;font-weight:800;color:var(--ink)}
.dx-md i{font-style:normal;font-size:11.6px;color:var(--ink-3);line-height:1.6}

/* 文件树 */
.tree{margin-top:11px;border-top:1px solid var(--line);padding-top:5px}
.tree-child{margin-left:10px;padding-left:14px;border-left:1px dashed var(--line)}
.tn{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;cursor:pointer;font-size:13px;min-height:34px;transition:background .12s}
.tn:hover{background:var(--bg-soft)}
.tn-ar{width:13px;flex:none;text-align:center;color:var(--ink-3);font-size:11px}
.tn-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.tn-dir .tn-nm{font-weight:700}
.tn-dir.dx-mdir{background:linear-gradient(90deg,rgba(109,94,252,.06),transparent 70%)}
.tn.k-file .tn-nm{color:var(--ink-2)}
.tn-meta{flex:none;font-size:11.3px;color:var(--ink-3);font-family:var(--mono);white-space:nowrap}
.tn-tag{flex:none;font-size:10.4px;padding:1px 6px;border-radius:6px;background:var(--bg-soft);border:1px solid var(--line);color:var(--ink-3);text-transform:uppercase}
.tn-star{font-size:10px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:5px;padding:0 5px}
.tn.dx-attach{opacity:.62}
.tn.dx-attach .tn-nm{color:var(--ink-3);font-weight:600}
.tn.dx-attach-f{opacity:.5}
.tn.dx-attach-f .tn-nm{color:var(--ink-3)}
.tn-acts{display:flex;gap:5px;flex:none;opacity:0;transition:opacity .15s}
.tn:hover .tn-acts{opacity:1}

/* 小按钮 */
.btn.xs{min-height:26px;padding:0 9px;font-size:12px;border-radius:8px;gap:4px;font-weight:600}

/* 详情弹窗 */
.frow2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.frow2 > div{background:var(--bg-soft);border-radius:10px;padding:8px 11px}
.f-lb{display:block;font-size:11.2px;color:var(--ink-3);margin-bottom:2px}
.frow2 b{font-size:13px;color:var(--ink)}
.dx-path{font-family:var(--mono);font-size:12px;color:var(--ink-2);background:var(--bg-soft);border-radius:9px;padding:8px 11px;word-break:break-all;line-height:1.6}
.dx-intro{font-size:12.6px;line-height:1.85;color:var(--ink-2);background:var(--bg-soft);border-radius:9px;padding:10px 12px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word}

/* 同步方式选项 */
.opt{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--brand);background:var(--brand-soft)}
.opt-h{font-size:13.4px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opt-h em{font-style:normal;font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:1px 8px}
.opt-d{font-size:12.3px;line-height:1.7;color:var(--ink-3)}

/* 窄屏 */
@media (max-width:900px){
  .tn-acts{opacity:1}
  .tn-meta{display:none}
  .dx-maindirs{grid-template-columns:1fr}
  .frow2{grid-template-columns:1fr}
}

/* 视图切换（目录树 / 知识图谱） + 知识图谱 */
.obs-view-tabs{display:flex;gap:6px;margin-top:12px}
.obs-view-tabs .vtab{font-size:12.6px;font-weight:700;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg-soft);color:var(--ink-3);cursor:pointer;font-family:inherit;transition:.15s}
.obs-view-tabs .vtab:hover{border-color:#d5daee}
.obs-view-tabs .vtab.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.graph-wrap{margin-top:12px}
.g-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-bottom:8px}
.g-leg{display:inline-flex;align-items:center;gap:6px}
.g-leg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.graph-svg{width:100%;height:auto;max-height:620px;background:var(--bg-soft);border:1px solid var(--line);border-radius:14px;display:block;touch-action:none}
.g-node{cursor:pointer}
.g-node .g-label{font-size:11px;fill:var(--ink-2);pointer-events:none;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.g-edge{stroke:var(--ink-3);stroke-width:1.7px;stroke-linecap:round;transition:stroke .12s,stroke-width .12s,opacity .12s}
.g-edge.hi{stroke-width:2.8px}
.g-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg-soft);color:var(--ink-3);cursor:pointer;font-family:inherit;transition:.15s}
.g-chip i{width:10px;height:10px;border-radius:3px;background:#c7ccdd;display:inline-block;flex:none}
.g-chip.on{color:var(--ink);border-color:var(--brand)}
.g-chip.on i{background:var(--c,var(--brand))}
.g-chip.tog.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.g-chip:hover{border-color:#d5daee}
.g-chip em{font-style:normal;font-size:10px;font-weight:700;color:var(--ink-3);background:var(--card);border-radius:6px;padding:0 5px;margin-left:1px}
.g-node.g-file circle{opacity:.9}
.g-node .g-label-sm{font-size:9.5px;fill:var(--ink-3)}
/* 附件节点数量远多于笔记（63 个文件里 32 个是附件/原件），标签全铺出来会糊屏 →
   默认隐藏，悬停本体/邻接、或搜索命中时（.on）才放出 */
.g-node.g-file .g-label{opacity:0;transition:opacity .12s}
.g-node.g-file.on .g-label{opacity:1}
.dx-ima-open .tn-nm{font-weight:600;color:var(--ink)}

function migrate(raw) {
  var base = defaultState();
  var out = base;

     （已改名为「技能推荐」，WB案例库另立为案例）。不覆盖用户手动新增的作品。 */
  (function mergeSeedWorks() {
    var byName = {};
    out.works.forEach(function (w) { if (w && w.name) byName[w.name] = w; });
    /* 删除废弃 / 改名前的旧条目 */
    out.works = out.works.filter(function (w) {

    });
    seedWorks().forEach(function (w) {
      var cur = byName[w.name];
      if (!cur) {
        out.works.push(w);
      } else {
        /* 幂等同步分类与链接（不覆盖用户手动改过的其他字段） */
        if (w.cat) cur.cat = w.cat;
        if (w.group) cur.group = w.group;
        if (w.type) cur.type = w.type;
        if (w.url && !cur.url) cur.url = w.url;
        if (w.github && !cur.github) cur.github = w.github;
        if (w.online && !cur.online) cur.online = w.online;
        if (w.prompt && !cur.prompt) cur.prompt = w.prompt;
        if (w.status && !cur.status) cur.status = w.status;
      }
    });

/* ---------------- 读 ---------------- */
function loadState() {
  var raw = null;
  try {
    raw = localStorage.getItem(STORE_KEY);
  } catch (e) {
    S = defaultState();
    return { ok: false, error: '无法访问浏览器本地存储（可能处于隐私模式或被禁用），本次改动不会被保存。', fatal: true };
  }
  if (raw === null || raw === '') {
    S = defaultState();
    return { ok: true, fresh: true };
  }
  try {
    var parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('根节点不是对象');
    S = migrate(parsed);
    return { ok: true };
  } catch (e) {
    S = defaultState();
    S.__brokenRaw = raw;
    return { ok: false, error: '本地数据无法解析（' + (e && e.message ? e.message : e) + '）', broken: true };
  }
}

/* ---------------- 写 ---------------- */
function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(S));
    LAST_SAVE_OK = true;
    return { ok: true };
  } catch (e) {
    LAST_SAVE_OK = false;
    var msg = '保存失败：本地存储不可用或空间不足。请及时导出 JSON 备份。';
    if (e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014)) {
      msg = '保存失败：本地存储空间已满。请导出备份后清理数据。';
    }
    return { ok: false, error: msg };
  }
}

function commit(silent) {
  var r = saveState();
  if (!r.ok && !silent) toast(r.error, 'error', 6000);
  return r.ok;
}

/* ---------------- 导入校验 ---------------- */
function validateImport(obj) {
  var errs = [];
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return ['文件根节点不是一个 JSON 对象'];
  if (typeof obj.version !== 'number') errs.push('缺少 version 字段（应为数字）');
  ARR_FIELDS.forEach(function (k) {
    if (obj[k] !== undefined && !Array.isArray(obj[k])) errs.push('字段 ' + k + ' 不是数组');
  });
  var count = 0;
  ARR_FIELDS.forEach(function (k) {
    if (Array.isArray(obj[k])) {
      count += obj[k].length;
      obj[k].forEach(function (it, i) {
        if (!it || typeof it !== 'object') errs.push(k + '[' + i + '] 不是对象');
        else if (!it.id) errs.push(k + '[' + i + '] 缺少 id 字段');
      });
    }
  });
  /* 兼容 v1 备份：允许只带 knowledge */
  if (count === 0 && !Array.isArray(obj.knowledge)) errs.push('数据中没有任何条目，可能不是本工作台的备份文件');
  return errs;
}

function applyImport(obj) {
  S = migrate(obj);
  return commit();
}

/* ---------------- 导出 ---------------- */
function exportJSON() {
  var data = JSON.parse(JSON.stringify(S));
  delete data.__brokenRaw;
  var text = JSON.stringify(data, null, 2);
  var name = 'workbench-backup-' + ymd(new Date()) + '.json';
  try {
    var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    toast('已导出备份：' + name, 'ok');
    return true;
  } catch (e) {
    toast('导出失败：' + (e && e.message ? e.message : e), 'error');
    return false;
  }
}

/* ---------------- 清空 ---------------- */
function clearAll() {
  S = defaultState();
  S.meta.seeded = true; // 清空后不再自动灌示例
  return commit();
}

/* ==================== 07-ones-seed.js ==================== */
/* ============================================================
   07-ones-seed.js —— 把 ONES 数据合并进工作台
   - 需求(ONES_PARENTS) → 项目；任务(ONES_TASKS) → 任务
   - 按 onsId 幂等 upsert：重复导入只更新、不重复新增
   - 用 meta.onesSeed 记录已导入的数据版本；提升 ONES_SEED_VERSION 即可重导
   - 数据来源文件：06-ones-data.js（自动生成）
   - 注意：ONES 数据不计 demo 标记，因此「清空示例数据」不会误删真实任务
   ============================================================ */
var ONES_STATUS_MAP = {
  '未开始': 'todo',
  '进行中': 'doing',
  '实现中': 'doing',
  '已完成': 'done',
  '已实现': 'done'
};
function onesStatusToLocal(s) {
  if (!s) return 'todo';
  if (ONES_STATUS_MAP[s]) return ONES_STATUS_MAP[s];
  if (s.indexOf('完成') >= 0 || s.indexOf('已实现') >= 0) return 'done';
  if (s.indexOf('进行') >= 0 || s.indexOf('实现中') >= 0) return 'doing';
  return 'todo';
}
function onesProjectStatus(s) { return onesStatusToLocal(s) === 'done' ? 'done' : 'normal'; }

/** ONES 已完成条目的完成时间：取「计划完成日期 → 截止日期」，缺失才用当前时间（避免污染本周/本月统计） */
function onesCompletedAt(planEnd, dueDate) {
  var d = planEnd || dueDate || '';
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d));
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], 12, 0, 0).toISOString();
  return nowISO();
}

/** 判断某任务是否来自 ONES 导入 */
function isOnesTask(t) { return !!(t && (t.source === 'ones' || t.onsId)); }

/**
 * 合并 ONES 数据。
 * @param {boolean} force 忽略版本号强制重导
 * @returns {null|{projects:number,tasks:number,updP:number,updT:number}}
 */
function seedOnes(force) {
  if (typeof ONES_PARENTS === 'undefined' || typeof ONES_TASKS === 'undefined') return null;
  S.meta = S.meta || {};
  if (!force && (S.meta.onesSeed || 0) >= ONES_SEED_VERSION) return null;

  var now = nowISO();
  var stat = { projects: 0, tasks: 0, updP: 0, updT: 0 };
  var titleToPid = {};

  /* 1) 需求 → 项目 */
  (S.projects || []).forEach(function (p) { if (p.onsId) titleToPid[p.name] = p.id; });
  ONES_PARENTS.forEach(function (p) {
    var exist = (S.projects || []).filter(function (x) { return x.onsId === p.onsId; })[0] ||
      (S.projects || []).filter(function (x) { return x.name === p.name; })[0];
    var pstatus = onesProjectStatus(p.onesStatus);
    var fields = {
      onsId: p.onsId, name: p.name, desc: p.desc || '', source: 'ones',
      owner: p.owner || '', onesStatus: p.onesStatus,
      startDate: p.startDate || '', dueDate: p.dueDate || '',
      priority: 'mid', progress: p.progress === null ? 0 : p.progress,
      status: pstatus
    };
    if (exist) {
      Object.keys(fields).forEach(function (k) {
        if (k === 'name') return; /* 名称保持用户可能改过的值 */
        if (exist[k] !== fields[k]) { exist[k] = fields[k]; stat.updP++; }
      });
      exist.status = pstatus;
      if (pstatus === 'done') exist.completedAt = onesCompletedAt(p.planEnd || p.dueDate, '');
      else exist.completedAt = '';
      exist.updatedAt = now;
      titleToPid[p.name] = exist.id;
    } else {
      var np = Object.assign({
        id: uid(), nextAction: '', note: '',
        createdAt: now, updatedAt: now,
        completedAt: pstatus === 'done' ? onesCompletedAt(p.planEnd, p.dueDate) : ''
      }, fields);
      S.projects.push(np);
      titleToPid[p.name] = np.id;
      stat.projects++;
    }
  });

  /* 2) 任务 → 任务 */
  ONES_TASKS.forEach(function (t) {
    var pid = titleToPid[t.parentTitle] || null;
    var status = onesStatusToLocal(t.onesStatus);
    var fields = {
      onsId: t.onsId, title: t.title, projectId: pid, source: 'ones',
      owner: t.owner || '', followers: t.followers || '',
      onesStatus: t.onesStatus, onesPriority: t.onesPriority || '普通',
      progress: t.progress === null ? (status === 'done' ? 100 : null) : t.progress,
      planStart: t.planStart || '', planEnd: t.planEnd || '',
      dueDate: t.dueDate || '', note: t.desc || '',
      worklog: t.worklog || '', logged: t.logged || ''
    };
    var exist = (S.tasks || []).filter(function (x) { return x.onsId === t.onsId; })[0];
    if (exist) {
      var statusChanged = exist.status !== status;
      Object.keys(fields).forEach(function (k) {
        if (exist[k] !== fields[k]) { exist[k] = fields[k]; stat.updT++; }
      });
      exist.status = status;
      if (statusChanged) exist.statusChangedAt = now;
      if (status === 'done') exist.completedAt = onesCompletedAt(t.planEnd, t.dueDate);
      else exist.completedAt = '';
      exist.updatedAt = now;
    } else {
      var nt = Object.assign({
        id: uid(), dueTime: '', priority: 'mid', focus: false,
        statusChangedAt: now, createdAt: now, updatedAt: now,
        completedAt: status === 'done' ? onesCompletedAt(t.planEnd, t.dueDate) : ''
      }, fields);
      nt.status = status;
      S.tasks.push(nt);
      stat.tasks++;
    }
  });

  S.meta.onesSeed = ONES_SEED_VERSION;
  S.meta.onesAt = now;
  commit(true);
  return stat;
}

/** 台账筛选用：从 ONES 数据里取去重后的负责人 / 状态 / 计划完成月份 */
function onesFacets() {
  var owners = {}, statuses = {}, months = {};
  ONES_TASKS.forEach(function (t) {
    if (t.owner) owners[t.owner] = 1;
    if (t.onesStatus) statuses[t.onesStatus] = 1;
    if (t.planEnd) months[String(t.planEnd).slice(0, 7)] = 1;
  });
  return {
    owners: Object.keys(owners),
    statuses: Object.keys(statuses),
    months: Object.keys(months).sort()
  };
}

function newsCat(c) { return NEWS_CAT[c] || { t: 'AI 动态', c: '' }; }

/* AI HOT 公开只读接口（匿名、无需 Key、已开放跨域） */
var NEWS_API = 'https://aihot.virxact.com/api/public/items?mode=selected&take=10';
var NEWS_SITE = 'https://aihot.news/';

/* 拉取今日精选 Top 10；成功写入 S.news 快照，失败保留旧快照 */
function fetchAIHot(cb) {
  var done = false;
  var timer = setTimeout(function () {
    if (done) return; done = true;
    cb({ error: 'AI HOT 请求超时' });
  }, 8000);
  fetch(NEWS_API).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (j) {
    if (done) return; done = true; clearTimeout(timer);
    var raw = (j && j.items) || [];
    var items = raw.slice(0, 10).map(function (it) {
      return {
        id: it.id || '',
        title: it.title || it.title_en || '（无标题）',
        url: it.url || it.permalink || '',
        permalink: it.permalink || '',
        source: it.source || '',
        publishedAt: it.publishedAt || it.discoveredAt || '',
        summary: it.summary || '',
        category: it.category || '',
        score: (typeof it.score === 'number') ? it.score : null
      };
    });
    if (!items.length) { cb({ error: 'AI HOT 暂无数据' }); return; }
    S.news = { at: nowISO(), items: items };
    commit();
    cb({ ok: true, n: items.length });
  }).catch(function (e) {
    if (done) return; done = true; clearTimeout(timer);
    cb({ error: (e && e.message) ? e.message : 'AI HOT 获取失败' });
  });
}

/* ---- 热度排行榜：按 AI HOT 的 score 从高到低重排 ---- */
function newsScore(it) { return (it && typeof it.score === 'number') ? it.score : null; }
function newsRanked() {
  return newsItems().slice().sort(function (a, b) {
    var sa = newsScore(a), sb = newsScore(b);
    if (sa === null && sb === null) return 0;
    if (sa === null) return 1;   /* 没有分数的排到最后 */
    if (sb === null) return -1;
    return sb - sa;
  });
}

  ['芯片', /芯片|GPU|算力|推理|部署/i],
  ['办公', /办公|文档|表格|PPT|会议|邮件/]
];
function newsTags(it) {
  if (!it) return [];
  var hay = (it.title || '') + ' ' + (it.summary || '') + ' ' + (it.source || '');
  var low = hay.toLowerCase();
  var out = [];
  NEWS_TAG_BRANDS.forEach(function (b) {
    if (out.length >= 3) return;
    if (low.indexOf(b.toLowerCase()) >= 0 && out.indexOf(b) < 0) out.push(b);
  });
  NEWS_TAG_RULES.forEach(function (r) {
    if (out.length >= 4) return;
    if (r[1].test(hay) && out.indexOf(r[0]) < 0) out.push(r[0]);
  });
  if (!out.length) out.push(newsCat(it.category).t);
  return out.slice(0, 4);
}

/* 快照是否还新鲜（30 分钟内不再自动重拉） */
function newsFresh() {
  var at = S.news && S.news.at;
  if (!at) return false;
  var t = new Date(at).getTime();
  if (isNaN(t)) return false;
  return (Date.now() - t) < 30 * 60 * 1000;
}
function newsItems() { return (S.news && S.news.items) || []; }
function newsUpdatedText() {
  var at = S.news && S.news.at;
  return at ? (ymd(new Date(at)) + ' ' + hm(new Date(at))) : '尚未更新';
}

/* WB案例种子：按 sid 幂等 upsert；同一 scene（具体落地场景）只保留一条。
   重导入时会清理历史种子，但保留「手动新增 / 打标 / 二创过 / 编辑过」的条目。 */
function seedArticles(force) {
  var gate = (S.meta && S.meta.articlesSeed) || 0;
  if (!force && gate >= ARTICLES_SEED_VERSION) return false;
  S.articles = S.articles || [];

  var sids = {};
  ARTICLES_SEED.forEach(function (s) { sids[s.sid] = 1; });

  /* 剪枝：无 sid 的（用户新增/二创）保留；打标 / 编辑过的保留；sid 仍在新种子里的保留 */
  S.articles = S.articles.filter(function (a) {
    if (!a || !a.sid) return true;
    if (a.starred || a.userEdited || a.forkedFrom) return true;
    return !!sids[a.sid];
  });

  /* 场景去重：种子内部同种场景只留一条（优先公众号来源）；已被用户打标/编辑的条目不动 */
  var sceneKept = {};
  var kept = [];
  ARTICLES_SEED.forEach(function (s) {
    var sc = s.scene || s.sid;
    if (sceneKept[sc]) return;
    sceneKept[sc] = 1;
    kept.push(s);
  });

  var bySid = {}, byUrl = {};
  S.articles.forEach(function (a) {
    if (a && a.sid) bySid[a.sid] = a;
    if (a && a.url) byUrl[a.url] = a;
  });
  kept.forEach(function (s) {
    var ex = bySid[s.sid] || byUrl[s.url];
    if (ex) {
      if (ex.userEdited) return;   /* 用户改过的不覆盖 */
      ex.source = s.source; ex.title = s.title; ex.howto = s.howto;
      ex.skills = s.skills || []; ex.scene = s.scene || '';
      ex.srcType = s.srcType || 'wechat'; ex.summary = s.howto;
      ex.sid = s.sid; ex.url = s.url; ex.category = s.category || '工作场景';
      ex.updatedAt = nowISO();
    } else {
      S.articles.push({
        id: uid(), sid: s.sid, scene: s.scene || '', srcType: s.srcType || 'wechat',
        source: s.source, title: s.title, howto: s.howto, summary: s.howto,
        skills: s.skills || [], category: s.category || '工作场景', url: s.url,
        createdAt: nowISO(), updatedAt: nowISO()
      });
    }
  });
  S.meta.articlesSeed = ARTICLES_SEED_VERSION;
  commit();
  return true;
}

/* ---- WB案例资讯：重载内置快照（公众号无法在浏览器实时抓取） ---- */
function artSnapshotAgeDays() {
  var iso = (typeof ARTICLES_FETCHED_AT === 'string') ? ARTICLES_FETCHED_AT : '';
  if (!iso) return null;
  var t = new Date(iso).getTime();
  if (isNaN(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}
var ART_STALE_DAYS = 45;

function uid() {
  return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function p2(n) { return (n < 10 ? '0' : '') + n; }

/* ---------------- 转义（防 XSS） ---------------- */
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ---------------- 日期 ---------------- */
function ymd(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function hm(d) { return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function dOff(n) { var d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
function shiftISO(n) { var d = new Date(); d.setDate(d.getDate() + (n || 0)); return d.toISOString(); }
function nowISO() { return new Date().toISOString(); }

/** 把 YYYY-MM-DD [+ HH:mm] 解析为「本地时间」的 Date。禁止用 new Date('2026-09-10')（按 UTC 解析会差时区）。 */
function parseLocal(dateStr, timeStr) {
  if (!dateStr) return null;
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr).trim());
  if (!m) return null;
  var hh = 23, mm = 59;
  if (timeStr) {
    var t = /^(\d{1,2}):(\d{2})$/.exec(String(timeStr).trim());
    if (t) { hh = parseInt(t[1], 10); mm = parseInt(t[2], 10); }
  }
  return new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10), hh, mm, 0, 0);
}
/** 今天 00:00 */
function todayStart() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
/** 距今天的天数差（今天=0，未来为正，过去为负），只按日期算 */
function dayDiff(dateStr) {
  var d = parseLocal(dateStr, '00:00');
  if (!d) return null;
  var a = todayStart();
  var b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.round((b - a) / 86400000);
}
/** 周一为一周起点 */
function startOfWeek(d) {
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var w = x.getDay(); // 0=周日
  var back = (w + 6) % 7;
  x.setDate(x.getDate() - back);
  x.setHours(0, 0, 0, 0);
  return x;
}
function inThisWeek(iso) {
  if (!iso) return false;
  var d = new Date(iso);
  if (isNaN(d.getTime())) return false;
  var s = startOfWeek(new Date());
  var e = new Date(s); e.setDate(e.getDate() + 7);
  return d >= s && d < e;
}
function fmtDue(dateStr, timeStr) {
  if (!dateStr) return '无截止';
  var n = dayDiff(dateStr);
  var base = dateStr.slice(5).replace('-', '/');
  if (n === 0) return '今天' + (timeStr ? ' ' + timeStr : '');
  if (n === 1) return '明天' + (timeStr ? ' ' + timeStr : '');
  if (n === 2) return '后天' + (timeStr ? ' ' + timeStr : '');
  if (n === -1) return '昨天' + (timeStr ? ' ' + timeStr : '');
  if (n !== null && n < 0) return base + (timeStr ? ' ' + timeStr : '') + ' · 逾期' + (-n) + '天';
  return base + (timeStr ? ' ' + timeStr : '');
}
function dueClass(dateStr) {
  var n = dayDiff(dateStr);
  if (n === null) return '';
  if (n < 0) return 'red';
  if (n === 0) return 'amber';
  return '';
}
function fmtDT(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return ymd(d) + ' ' + hm(d);
}
function relTime(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  var s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  if (s < 86400 * 7) return Math.floor(s / 86400) + ' 天前';
  return ymd(d);
}
/** 两个 ISO 之间相差天数（用于等待超时判定） */
function daysSince(iso) {
  if (!iso) return null;
  var d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

  '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
  '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];
var LUNAR_MONTH_NAMES = ['', '正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '冬月', '腊月'];

function lunarYearDays(y) {
  var i, sum = 348;
  for (i = 0x8000; i > 0x8; i >>= 1) sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0;
  return sum + lunarLeapDays(y);
}
function lunarLeapMonth(y) { return LUNAR_INFO[y - 1900] & 0xf; }
function lunarLeapDays(y) { return lunarLeapMonth(y) ? ((LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29) : 0; }
function lunarMonthDays(y, m) { return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
/** 公历 Y/M/D → 农历 {y,m,d,leap} */
function solarToLunar(y, m, d) {
  var i, temp = 0;
  var base = Date.UTC(1900, 0, 31); // 1900-01-31 = 农历 1900 正月初一
  var off = Math.floor((Date.UTC(y, m - 1, d) - base) / 86400000);
  for (i = 1900; i < 2101 && off > 0; i++) { temp = lunarYearDays(i); off -= temp; }
  if (off < 0) { off += temp; i--; }
  var lYear = i;
  var leap = lunarLeapMonth(lYear), isLeap = false;
  for (i = 1; i < 13 && off > 0; i++) {
    if (leap > 0 && i === leap + 1 && isLeap === false) { --i; isLeap = true; temp = lunarLeapDays(lYear); }
    else { temp = lunarMonthDays(lYear, i); }
    if (isLeap === true && i === leap + 1) isLeap = false;
    off -= temp;
  }
  if (off === 0 && leap > 0 && i === leap + 1) {
    if (isLeap) { isLeap = false; } else { isLeap = true; --i; }
  }
  if (off < 0) { off += temp; --i; }
  return { y: lYear, m: i, d: off + 1, leap: isLeap };
}
/** 「YYYY-MM-DD」→ 农历文字：初一显示月份名（如「八月」），其余显示日名（如「廿三」） */
function lunarText(dateStr) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr || '').trim());
  if (!m) return '';
  var L = solarToLunar(parseInt(m[1], 10), parseInt(m[2], 10), parseInt(m[3], 10));
  if (L.d === 1) return (L.leap ? '闰' : '') + LUNAR_MONTH_NAMES[L.m];
  return LUNAR_DAY_NAMES[L.d];
}

/* ---------------- Toast ---------------- */
function toast(msg, type, ms) {
  var root = document.getElementById('toast-root');
  if (!root) return;
  var el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(function () {
    el.style.transition = 'opacity .25s';
    el.style.opacity = '0';
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 260);
  }, ms || 2600);
}

/* ---------------- 弹窗 ---------------- */
var MODAL_STACK = [];
function openModal(opt) {
  var root = document.getElementById('modal-root');
  var wrap = document.createElement('div');
  wrap.className = 'mask';
  wrap.innerHTML =
    '<div class="modal ' + (opt.size || '') + '" data-stop="1">' +
      '<div class="modal-hd"><h3>' + esc(opt.title || '') + '</h3>' +
        '<button class="icon-btn" data-mclose="1" aria-label="关闭">✕</button></div>' +
      '<div class="modal-bd">' + (opt.body || '') + '</div>' +
      (opt.footer ? '<div class="modal-ft">' + opt.footer + '</div>' : '') +
    '</div>';
  root.appendChild(wrap);
  root.classList.add('open');
  MODAL_STACK.push(wrap);
  wrap.addEventListener('click', function (e) {
    if (e.target === wrap) closeModal(wrap);
    if (e.target && e.target.getAttribute && e.target.getAttribute('data-mclose')) closeModal(wrap);
  });
  var first = wrap.querySelector('input,textarea,select');
  if (first && window.innerWidth > 880) setTimeout(function () { first.focus(); }, 60);
  return wrap;
}
function closeModal(wrap) {
  var root = document.getElementById('modal-root');
  if (!wrap) { wrap = MODAL_STACK[MODAL_STACK.length - 1]; }
  if (!wrap) return;
  if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
  MODAL_STACK = MODAL_STACK.filter(function (x) { return x !== wrap; });
  if (MODAL_STACK.length === 0) root.classList.remove('open');
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && MODAL_STACK.length) closeModal();
});

/** 确认对话框，返回 Promise<boolean> */
function confirmDialog(opt) {
  return new Promise(function (resolve) {
    var yesTxt = opt.confirmText || '确定';
    var wrap = openModal({
      title: opt.title || '请确认',
      size: '',
      body: '<div style="font-size:14.5px;color:var(--ink-2);line-height:1.7">' + (opt.message || '') + '</div>' +
        (opt.requireText ? '<div class="field" style="margin-top:14px"><label>请输入「' + esc(opt.requireText) + '」以确认<span class="req">*</span></label><input type="text" id="cd-input" autocomplete="off"></div>' : ''),
      footer: '<button class="btn" data-no="1">' + esc(opt.cancelText || '取消') + '</button>' +
        '<button class="btn ' + (opt.danger ? 'danger' : 'pri') + '" data-yes="1">' + esc(yesTxt) + '</button>'
    });
    var input = wrap.querySelector('#cd-input');
    wrap.querySelector('[data-yes]').onclick = function () {
      if (opt.requireText) {
        if (!input || input.value.trim() !== opt.requireText) {
          toast('请输入「' + opt.requireText + '」以确认', 'warn');
          if (input) input.focus();
          return;
        }
      }
      closeModal(wrap); resolve(true);
    };
    wrap.querySelector('[data-no]').onclick = function () { closeModal(wrap); resolve(false); };
    if (input) input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') wrap.querySelector('[data-yes]').click();
    });
  });
}

/* ---------------- 复制 ---------------- */
function copyText(text) {
  function fallback() {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function () { return true; }).catch(function () { return fallback(); });
  }
  return Promise.resolve(fallback());
}

/* ============================================================
   25-domain.js —— 业务计算：任务/项目/风险/周统计/周报
   ============================================================ */
var PRIO = { high: { t: '高', c: 'p-high', w: 3 }, mid: { t: '中', c: 'p-mid', w: 2 }, low: { t: '低', c: 'p-low', w: 1 } };
var STATUS = {
  todo: { t: '待处理', c: 's-todo' },
  doing: { t: '进行中', c: 's-doing' },
  waiting: { t: '等待别人', c: 's-waiting' },
  done: { t: '已完成', c: 's-done' }
};
var PROJ_STATUS = {
  normal: { t: '正常', c: 'ok' },
  due_soon: { t: '临期', c: 'warn' },
  blocked: { t: '阻塞', c: 'danger' },
  done: { t: '已完成', c: 'ok' }
};

/* ---------------- 任务 ---------------- */
function taskDueTs(t) {
  if (!t || !t.dueDate) return null;
  var d = parseLocal(t.dueDate, t.dueTime || '23:59');
  return d ? d.getTime() : null;
}
function isOverdueTask(t) {
  if (!t || t.status === 'done') return false;
  var ts = taskDueTs(t);
  return ts !== null && ts < Date.now();
}
function isDueToday(t) {
  return !!(t && t.status !== 'done' && t.dueDate && dayDiff(t.dueDate) === 0);
}
function dueSoon24h(t) {
  if (!t || t.status === 'done') return false;
  var ts = taskDueTs(t);
  if (ts === null || ts < Date.now()) return false;
  return (ts - Date.now()) <= 24 * 3600 * 1000;
}
function projectOf(id) {
  if (!id) return null;
  return (S.projects || []).filter(function (p) { return p.id === id; })[0] || null;
}
/** 按名称取项目；不存在则创建一个（用于「新增任务」的自定义项目菜单）。 */
function findOrCreateProject(name) {
  name = (name || '').trim();
  if (!name) return null;
  var p = (S.projects || []).filter(function (x) { return x.name === name; })[0];
  if (p) return p.id;
  var now = nowISO();
  p = {
    id: uid(), name: name, status: 'normal', progress: 0, priority: 'mid',
    owner: '', nextAction: '', note: '', startDate: '', dueDate: '',
    onsId: '', source: 'local', createdAt: now, updatedAt: now, completedAt: ''
  };
  S.projects.push(p);
  return p.id;
}
function openTasksOf(pid) {
  return (S.tasks || []).filter(function (t) { return t.projectId === pid && t.status !== 'done'; });
}

/** 重要度打分（越大越靠前） */
function taskScore(t) {
  if (t.status === 'done') return -1;
  var high = t.priority === 'high';
  if (isOverdueTask(t)) return high ? 100 : 92;
  if (isDueToday(t)) return high ? 90 : 80;
  if (t.focus) return 70;
  var ts = taskDueTs(t);
  if (ts === null) return 40;
  var days = (ts - Date.now()) / 86400000;
  return 40 + Math.max(0, 20 - days) + (high ? 3 : 0);
}
function sortTasks(a, b) {
  var sa = taskScore(a), sb = taskScore(b);
  if (sb !== sa) return sb - sa;
  var ta = taskDueTs(a), tb2 = taskDueTs(b);
  if (ta === null && tb2 === null) return (PRIO[b.priority] ? PRIO[b.priority].w : 0) - (PRIO[a.priority] ? PRIO[a.priority].w : 0);
  if (ta === null) return 1;
  if (tb2 === null) return -1;
  if (ta !== tb2) return ta - tb2;
  return (PRIO[b.priority] ? PRIO[b.priority].w : 0) - (PRIO[a.priority] ? PRIO[a.priority].w : 0);
}
/** 今日最重要的 3 件事 */
function top3Tasks() {
  return (S.tasks || []).filter(function (t) { return t.status !== 'done'; })
    .sort(sortTasks).slice(0, 3);
}
function todayStats() {
  var t = S.tasks || [];
  var open = t.filter(function (x) { return x.status !== 'done'; });
  return {
    todayTodo: open.filter(function (x) { return x.dueDate && dayDiff(x.dueDate) === 0; }).length,
    todayDone: t.filter(function (x) {
      return x.status === 'done' && x.completedAt && ymd(new Date(x.completedAt)) === ymd(new Date());
    }).length,
    overdue: t.filter(isOverdueTask).length,
    openProjects: (S.projects || []).filter(function (p) { return p.status !== 'done'; }).length,
    waiting: open.filter(function (x) { return x.status === 'waiting'; }).length,
    openTotal: open.length
  };
}

/* ---------------- 项目 ---------------- */
function projectRisk(p) {
  if (!p) return { key: 'normal', label: '正常', cls: 'ok', sev: 0 };
  if (p.status === 'done') return { key: 'done', label: '已完成', cls: 'ok', sev: 0 };
  if (p.status === 'blocked') return { key: 'blocked', label: '阻塞', cls: 'danger', sev: 100 };
  var n = p.dueDate ? dayDiff(p.dueDate) : null;
  if (n !== null && n < 0) return { key: 'overdue', label: '延期', cls: 'danger', sev: 95 };
  if (n !== null && n <= 3) return { key: 'due_soon', label: '临期', cls: 'warn', sev: 70 };
  return { key: 'normal', label: '正常', cls: 'ok', sev: 0 };
}
function projectRemainDays(p) {
  if (!p || !p.dueDate) return null;
  return dayDiff(p.dueDate);
}

/* ---------------- 风险雷达 ---------------- */
function riskItems() {
  var out = [];
  (S.tasks || []).forEach(function (t) {
    if (t.status === 'done') return;
    if (isOverdueTask(t)) {
      var d = Math.abs(dayDiff(t.dueDate) || 0);
      out.push({
        id: t.id, kind: 'task', sev: 100 + Math.min(d, 30),
        title: t.title,
        desc: '任务已逾期 ' + d + ' 天（截止 ' + fmtDue(t.dueDate, t.dueTime) + '）' + (t.projectId ? ' · ' + ((projectOf(t.projectId) || {}).name || '') : ''),
        tag: '逾期', cls: 'danger'
      });
    } else if (dueSoon24h(t)) {
      out.push({
        id: t.id, kind: 'task', sev: 80,
        title: t.title,
        desc: '24 小时内截止 · ' + fmtDue(t.dueDate, t.dueTime) + (t.projectId ? ' · ' + ((projectOf(t.projectId) || {}).name || '') : ''),
        tag: '即将截止', cls: 'warn'
      });
    }
    if (t.status === 'waiting') {
      var w = daysSince(t.statusChangedAt);
      if (w !== null && w > 3) {
        out.push({
          id: t.id, kind: 'task', sev: 60 + Math.min(w, 30),
          title: t.title,
          desc: '等待别人已 ' + w + ' 天未推进，建议主动催办或改为自己处理',
          tag: '等待超时', cls: 'warn'
        });
      }
    }
  });
  (S.projects || []).forEach(function (p) {
    var r = projectRisk(p);
    if (r.key === 'blocked') {
      out.push({
        id: p.id, kind: 'project', sev: 105,
        title: p.name,
        desc: '项目被手动标记为阻塞 · 下一步：' + (p.nextAction || '待补充'),
        tag: '阻塞', cls: 'danger'
      });
    } else if (r.key === 'overdue') {
      out.push({
        id: p.id, kind: 'project', sev: 98,
        title: p.name,
        desc: '项目已超过截止日期 ' + Math.abs(projectRemainDays(p)) + ' 天且未完成 · 进度 ' + (p.progress || 0) + '%',
        tag: '项目延期', cls: 'danger'
      });
    } else if (r.key === 'due_soon') {
      out.push({
        id: p.id, kind: 'project', sev: 70,
        title: p.name,
        desc: '距截止还有 ' + projectRemainDays(p) + ' 天 · 进度 ' + (p.progress || 0) + '% · 下一步：' + (p.nextAction || '待补充'),
        tag: '项目临期', cls: 'warn'
      });
    }
  });
  out.sort(function (a, b) { return b.sev - a.sev; });
  return out;
}
function sevLevel(sev) { return sev >= 90 ? 'red' : (sev >= 60 ? 'amber' : 'green'); }
function sevIcon(sev) { return sev >= 90 ? '!' : (sev >= 60 ? '·' : '✓'); }

/* ---------------- 本周统计（周一为起点） ---------------- */
function weekStats() {
  var t = S.tasks || [];
  var added = t.filter(function (x) { return inThisWeek(x.createdAt); });
  var done = t.filter(function (x) { return x.status === 'done' && inThisWeek(x.completedAt); });
  var open = t.filter(function (x) { return x.status !== 'done'; });
  var rate = (done.length + open.length) ? Math.round(done.length / (done.length + open.length) * 100) : 0;
  var important = done.filter(function (x) { return x.priority === 'high'; });
  var overdue = t.filter(isOverdueTask);
  var nextHigh = open.filter(function (x) {
    if (x.priority !== 'high') return false;
    if (isOverdueTask(x)) return true;
    var n = x.dueDate ? dayDiff(x.dueDate) : null;
    return n !== null && n <= 7;
  }).sort(sortTasks);
  return {
    added: added.length, done: done.length, open: open.length,
    rate: rate, important: important, overdue: overdue, nextHigh: nextHigh,
    weekStart: startOfWeek(new Date())
  };
}

/* ---------------- 月度统计（自然月） ---------------- */
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function inThisMonth(iso) {
  if (!iso) return false;
  var d = new Date(iso);
  if (isNaN(d.getTime())) return false;
  var s = startOfMonth(new Date());
  var e = new Date(s.getFullYear(), s.getMonth() + 1, 1);
  return d >= s && d < e;
}
/** 近 n 天每天完成任务数（用于柱状图） */
function doneByDay(n) {
  var out = [];
  var set = {};
  (S.tasks || []).forEach(function (t) {
    if (t.status !== 'done' || !t.completedAt) return;
    var k = ymd(new Date(t.completedAt));
    if (!set[k]) set[k] = 0;
    set[k]++;
  });
  for (var i = n - 1; i >= 0; i--) {
    var ds = dOff(-i);
    out.push({ date: ds, n: set[ds] || 0 });
  }
  return out;
}
/** 近 n 周每周完成任务数 */
function doneByWeek(n) {
  var out = [];
  var s = startOfWeek(new Date());
  for (var i = n - 1; i >= 0; i--) {
    var ws = new Date(s); ws.setDate(ws.getDate() - 7 * i);
    var we = new Date(ws); we.setDate(we.getDate() + 7);
    var c = (S.tasks || []).filter(function (t) {
      if (t.status !== 'done' || !t.completedAt) return false;
      var d = new Date(t.completedAt);
      return d >= ws && d < we;
    }).length;
    out.push({ label: (ws.getMonth() + 1) + '/' + ws.getDate(), n: c, start: ymd(ws) });
  }
  return out;
}
function monthStats() {
  var t = S.tasks || [];
  var added = t.filter(function (x) { return inThisMonth(x.createdAt); });
  var done = t.filter(function (x) { return x.status === 'done' && inThisMonth(x.completedAt); });
  var open = t.filter(function (x) { return x.status !== 'done'; });
  var rate = (done.length + open.length) ? Math.round(done.length / (done.length + open.length) * 100) : 0;
  var byProj = (S.projects || []).map(function (p) {
    var all = (S.tasks || []).filter(function (x) { return x.projectId === p.id; });
    return {
      project: p,

  });
  var noProj = (S.tasks || []).filter(function (x) { return !x.projectId; });

      open: noProj.filter(function (x) { return x.status !== 'done'; }).length

  }
  return {
    added: added.length, done: done.length, open: open.length, rate: rate,
    byProj: byProj, monthStart: startOfMonth(new Date()),
    label: (new Date().getFullYear()) + '-' + p2(new Date().getMonth() + 1)
  };
}

/* ---------------- 周报 ---------------- */
function generateReport() {

  L.push('工作周报（' + ws + ' — ' + we + '）');

  } else {
    w.done && (S.tasks || []).filter(function (x) { return x.status === 'done' && inThisWeek(x.completedAt); })
      .sort(function (a, b) { return (PRIO[b.priority] ? PRIO[b.priority].w : 0) - (PRIO[a.priority] ? PRIO[a.priority].w : 0); })
      .forEach(function (x) {
        var pj = projectOf(x.projectId);
        L.push('· ' + x.title + (pj ? '（' + pj.name + '）' : '') + '　[' + (PRIO[x.priority] ? PRIO[x.priority].t : '中') + '优先级]' + (x.completedAt ? '　完成于 ' + ymd(new Date(x.completedAt)) : ''));
      });
    L.push('· 本周共完成 ' + w.done + ' 项，完成率 ' + w.rate + '%。' + (w.important.length ? '其中高优先级任务 ' + w.important.length + ' 项。' : ''));

  L.push('');
  L.push('三、问题与风险');

  if (!risks.length) {

  } else {
    risks.slice(0, 12).forEach(function (r) {
      L.push('· [' + r.tag + '] ' + r.title + '：' + r.desc);
    });
    if (risks.length > 12) L.push('· 其余 ' + (risks.length - 12) + ' 条风险见「风险雷达」。');

  L.push('');
  L.push('四、下周重点');

    L.push('· 暂无高优先级待办，建议从风险雷达中挑选 1–2 项清理。');
  } else {
    w.nextHigh.slice(0, 8).forEach(function (x) {

      L.push('· ' + x.title + (pj ? '（' + pj.name + '）' : '') + '　截止：' + fmtDue(x.dueDate, x.dueTime) + (isOverdueTask(x) ? '（已逾期，需优先清理）' : ''));
    });
  }

}

function hashStr(s) {
  var h = 2166136261;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h >>> 0;
}
function fortuneFor(dateStr, seed, signKey) {
  var sign = getZodiac(signKey);
  var s = hashStr(dateStr + '#' + seed + '#' + signKey);
  var score = 60 + (s % 40); // 60-99
  var stars = score >= 90 ? 5 : (score >= 80 ? 4 : (score >= 70 ? 3 : (score >= 60 ? 2 : 1)));
  var level = score >= 90 ? '大吉' : (score >= 80 ? '吉' : (score >= 70 ? '平' : (score >= 60 ? '凶' : '大凶')));
  var a = s % F_YI.length;
  var b = (s >> 4) % F_YI.length; if (b === a) b = (b + 3) % F_YI.length;
  var ji = (s >> 8) % F_JI.length;
  var color = LUCKY_COLORS[(s >> 10) % LUCKY_COLORS.length];
  var number = 1 + (s % 9);
  var direction = LUCKY_DIRECTIONS[(s >> 12) % LUCKY_DIRECTIONS.length];
  var tip = F_TIP[(s >> 16) % F_TIP.length];
  /* 分维度指数：事业、财运、感情、健康、学习 */
  var dims = [
    { k: '事业', v: 60 + ((s >> 18) % 40) },
    { k: '财运', v: 60 + ((s >> 20) % 40) },
    { k: '感情', v: 60 + ((s >> 22) % 40) },
    { k: '健康', v: 60 + ((s >> 24) % 40) },
    { k: '学习', v: 60 + ((s >> 26) % 40) }
  ];
  return {
    score: score, stars: stars, level: level,
    element: sign.elementName, signName: sign.name, signIcon: sign.icon,
    luckyColor: color, luckyNumber: number, luckyDirection: direction,
    yi: [F_YI[a], F_YI[b]], ji: F_JI[ji], tip: tip, dims: dims
  };
}
function dailyQuote(dateStr) {
  var s = hashStr(dateStr + '#AIQUOTE');
  return AI_QUOTES[s % AI_QUOTES.length];
}
function renderStars(n) {
  var out = '';
  for (var i = 0; i < 5; i++) out += i < n ? '★' : '☆';
  return out;
}

function tasksForDate(dateStr) {
  if (!dateStr) return [];
  return (S.tasks || []).filter(function (t) {
    return t.dueDate === dateStr;
  }).sort(sortTasks);
}
function hasTaskOn(dateStr) {

/** 某天任务的等级色点：高优先/已延期=红，中=琥珀，低=品牌紫，已完成=绿；最多 3 个 */
function calDots(dateStr) {
  var ts = (S.tasks || []).filter(function (t) { return t.dueDate === dateStr; });
  if (!ts.length) return '';
  var rank = { high: 0, mid: 1, low: 2, done: 3 };
  var seen = {}, ks = [];
  ts.forEach(function (t) {
    var k = t.status === 'done' ? 'done' : (isOverdueTask(t) ? 'high' : (t.priority || 'mid'));
    if (!seen[k]) { seen[k] = 1; ks.push(k); }
  });
  ks.sort(function (a, b) { return rank[a] - rank[b]; });
  return ks.slice(0, 3).map(function (k) { return '<i class="cd cd-' + k + '"></i>'; }).join('');
}
function miniCalendarHTML() {
  var today = ymd(new Date());
  var base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + CAL_MONTH_OFFSET);
  var year = base.getFullYear(), month = base.getMonth();
  var firstDay = (new Date(year, month, 1).getDay() + 6) % 7; // Mon=0
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var monthLabel = year + ' 年 ' + (month + 1) + ' 月';
  var lmObj = solarToLunar(year, month + 1, Math.min(15, daysInMonth));
  var lmLabel = (lmObj.leap ? '闰' : '') + LUNAR_MONTH_NAMES[lmObj.m];
  var heads = ['一', '二', '三', '四', '五', '六', '日'];
  var cells = '';
  for (var i = 0; i < firstDay; i++) cells += '<div class="cal-cell empty"></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var ds = year + '-' + p2(month + 1) + '-' + p2(d);
    var on = ds === WORK_DATE;
    var isToday = ds === today;
    cells += '<button class="cal-cell' + (on ? ' on' : '') + (isToday ? ' today' : '') + '" data-act="calendar-select" data-v="' + ds + '" title="' + ds + ' 农历' + esc(lunarText(ds)) + '">' +
      '<span class="cd-n">' + d + '</span>' +
      '<span class="cd-l">' + esc(lunarText(ds)) + '</span>' +
      '<span class="cd-dots">' + calDots(ds) + '</span>' +
    '</button>';
  }
  return '<div class="mini-cal">' +
    '<div class="cal-hd">' +
      '<button class="icon-btn" data-act="calendar-prev" aria-label="上个月">‹</button>' +
      '<span class="cal-t">' + monthLabel + (lmLabel ? '<i>农历' + esc(lmLabel) + '</i>' : '') + '</span>' +
      '<button class="icon-btn" data-act="calendar-next" aria-label="下个月">›</button>' +

    '<div class="cal-days">' + cells + '</div>' +
    '</div>';
}

/* ---------------- 番茄钟 ---------------- */
function pomoTimeLeft() {
  if (!POMO || POMO.paused) return null;
  return Math.max(0, POMO.endAt - Date.now());
}
function fmtMs(ms) {
  var m = Math.floor(ms / 60000);
  var s = Math.floor((ms % 60000) / 1000);
  return p2(m) + ':' + p2(s);
}
function startPomo(id) {
  var t = getTask(id); if (!t) return;
  if (POMO) { clearInterval(POMO.timerId); POMO = null; }
  POMO = { taskId: id, endAt: Date.now() + 25 * 60 * 1000, paused: false, timerId: null };
  renderPomoModal();
  POMO.timerId = setInterval(function () {
    if (!POMO || POMO.paused) return;
    var left = pomoTimeLeft();
    var el = document.getElementById('pomo-timer');
    if (el) el.textContent = fmtMs(left);
    if (left <= 0) {
      clearInterval(POMO.timerId);
      POMO = null;
      closeModal();
      toast('🍅 专注时间结束：' + t.title, 'ok', 5000);
      if (t.status !== 'done') { t.status = 'doing'; t.statusChangedAt = nowISO(); t.updatedAt = nowISO(); commit(); rerender(); }
    }
  }, 1000);
}
function renderPomoModal() {
  if (!POMO) return;
  var t = getTask(POMO.taskId) || { title: '任务' };
  var wrap = openModal({
    title: '🍅 专注中：' + t.title,
    body: '<div style="text-align:center;padding:20px 10px">' +
      '<div id="pomo-timer" style="font-size:64px;font-weight:700;letter-spacing:-2px;color:var(--brand);font-family:var(--mono)">25:00</div>' +
      '<div style="font-size:13.5px;color:var(--ink-3);margin-top:8px">25 分钟倒计时，专注于当前任务</div></div>',
    footer: '<button class="btn" data-act="pomo-pause">暂停</button>' +
      '<button class="btn danger" data-act="pomo-stop">放弃</button>' +
      '<button class="btn ok" data-act="pomo-done">完成</button>'
  });
  /* buttons handled by global dispatcher */
}
function pausePomo() {
  if (!POMO) return;
  if (POMO.paused) {
    POMO.endAt = Date.now() + POMO.left;
    POMO.paused = false;
    toast('继续专注');
  } else {
    POMO.left = POMO.endAt - Date.now();
    POMO.paused = true;
    toast('已暂停');
  }
  rerender(); // if modal is open, we'd need to update button text; for now just toggle
}
function stopPomo() {
  if (POMO) { clearInterval(POMO.timerId); POMO = null; }

  toast('已放弃本次专注');
}
function donePomo() {
  var id = POMO ? POMO.taskId : null;

var PROJ_EXPAND = {}; /* { 条目key: true } 展开态 */

function isPresetName(n) { return PROJECT_PRESETS.indexOf(n) >= 0; }

  return (S.projects || []).filter(function (p) { return p.name === name; })[0] || null;
}
function tasksOfProject(pid) {
  return (S.tasks || []).filter(function (t) { return t.projectId === pid; }).sort(sortTasks);
}
function projDoneN(list) { return list.filter(function (t) { return t.status === 'done'; }).length; }
function projPct(list) { return list.length ? Math.round(projDoneN(list) / list.length * 100) : 0; }

/** 项目中心要展示的条目：4 个主线项目 + 其他项目合并项 */
function projectEntries() {
  var es = PROJECT_PRESETS.map(function (name) {
    return { key: name, kind: 'preset', name: name, project: presetProject(name) };
  });
  var others = (S.projects || []).filter(function (p) { return !isPresetName(p.name); });
  if (others.length) es.push({ key: '__other__', kind: 'group', name: '其他项目', projects: others });
  return es;
}

function projEntryTasks(e) {
  if (e.kind === 'preset') return e.project ? tasksOfProject(e.project.id) : [];
  var ids = {};
  e.projects.forEach(function (p) { ids[p.id] = 1; });
  return (S.tasks || []).filter(function (t) { return t.projectId && ids[t.projectId]; }).sort(sortTasks);
}
function projRemainTag(p) {
  if (!p || !p.dueDate) return '';
  var remain = projectRemainDays(p);
  if (remain === null) return '';
  var cls = remain < 0 ? 'danger' : (remain <= 3 ? 'warn' : '');
  var txt = remain < 0 ? '超期 ' + (-remain) + ' 天' : (remain === 0 ? '今天截止' : '剩余 ' + remain + ' 天');
  return '<span class="tag ' + cls + '">' + txt + '</span>';
}

    }

    e.projects.slice().sort(function (a, b) {
      var ra = projectRisk(a), rb = projectRisk(b);

      return String(a.name).localeCompare(String(b.name));

          : '<div class="pe-empty">暂无任务</div>') +

}

    var prog = parseInt(wrap.querySelector('#p-prog').value, 10);

    var obj = {
      name: name,
      desc: wrap.querySelector('#p-desc').value.trim(),
      startDate: wrap.querySelector('#p-start').value,
      dueDate: wrap.querySelector('#p-due').value,
      priority: wrap.querySelector('#p-prio').value,

      nextAction: wrap.querySelector('#p-next').value.trim(),
      status: wrap.querySelector('#p-status').value,
      note: wrap.querySelector('#p-note').value.trim()
    };

      if (obj.status === 'done' && !p.completedAt) p.completedAt = nowISO();
      if (obj.status !== 'done') p.completedAt = '';
      Object.keys(obj).forEach(function (k) { p[k] = obj[k]; });
      p.updatedAt = nowISO();
      if (commit()) toast('已保存项目', 'ok');
    }
    closeModal(wrap); rerender();
  };
}
function getProject(id) { return (S.projects || []).filter(function (p) { return p.id === id; })[0] || null; }
function deleteProject(id) {
  var p = getProject(id); if (!p) return;
  var n = openTasksOf(id).length;
  confirmDialog({
    title: '删除项目',
    message: '<b>' + esc(p.name) + '</b><br>该项目下还有 ' + n + ' 条未完成任务，删除项目后这些任务会变成「临时事项」（不会被删除）。确定删除项目吗？',
    danger: true, confirmText: '删除项目'
  }).then(function (ok) {
    if (!ok) return;
    (S.tasks || []).forEach(function (t) { if (t.projectId === id) { t.projectId = null; t.updatedAt = nowISO(); } });
    S.projects = S.projects.filter(function (x) { return x.id !== id; });
    commit(); rerender(); toast('已删除项目');
  });
}
function toggleProjectDone(id) {
  var p = getProject(id); if (!p) return;
  if (p.status === 'done') { p.status = 'normal'; p.completedAt = ''; }
  else { p.status = 'done'; p.progress = 100; p.completedAt = nowISO(); }

}

}

/* ---------------- 通用图表（纯 CSS 柱状图） ---------------- */
function barChart(data, opt) {
  opt = opt || {};
  if (!data.length) return emptyBox('◱', '暂无数据', '完成任务后这里会出现柱状图');
  var max = Math.max.apply(null, data.map(function (d) { return d.n; }));
  if (max <= 0) max = 1;
  return '<div class="bars">' + data.map(function (d) {
    var h = Math.round(d.n / max * 100);
    var cls = d.n === 0 ? 'zero' : (opt.danger ? 'danger' : '');
    return '<div class="bar-col' + (d.hot ? ' hot' : '') + '">' +
      '<div class="bar-wrap"><i class="' + cls + '" style="height:' + (d.n ? Math.max(h, 6) : 2) + '%"></i></div>' +
      '<b>' + d.n + '</b>' +
      '<span>' + esc(d.label) + '</span>' +
      '</div>';
  }).join('') + '</div>';
}
function miniBars(list) {
  /* list: [{name, done, open}] 横向堆叠条 */
  if (!list.length) return emptyBox('◱', '暂无数据');
  var max = Math.max.apply(null, list.map(function (x) { return x.total || (x.done + x.open); }));
  if (max <= 0) max = 1;
  return '<div class="hbars">' + list.map(function (x) {
    var total = x.total || (x.done + x.open);
    var dp = Math.round(x.done / max * 100);
    var op = Math.round(x.open / max * 100);
    return '<div class="hb">' +
      '<div class="hb-t"><span>' + esc(x.name) + '</span><b>' + x.done + '/' + total + '</b></div>' +
      '<div class="hb-b"><i class="d" style="width:' + dp + '%"></i><i class="o" style="width:' + op + '%"></i></div>' +
      '</div>';
  }).join('') + '</div>';
}

        '<td>' + openTasksOf(p.id).length + '</td></tr>';

  /* 周报 */

  var doneList = (S.tasks || []).filter(function (x) { return x.status === 'done' && inThisMonth(x.completedAt); })
    .sort(function (a, b) { return (PRIO[b.priority] ? PRIO[b.priority].w : 0) - (PRIO[a.priority] ? PRIO[a.priority].w : 0); });
  if (!doneList.length) L.push('· 本月暂无已完成任务记录。');
  else doneList.forEach(function (x) {

  });

  L.push('');
  L.push('二、项目进展');

    if (p.nextAction) L.push('  下一步：' + p.nextAction);
  });
  L.push('');
  L.push('三、问题与风险');
  var risks = riskItems();
  if (!risks.length) L.push('· 当前无逾期任务、无临期项目、无长期等待事项。');
  else risks.slice(0, 10).forEach(function (r) { L.push('· [' + r.tag + '] ' + r.title + '：' + r.desc); });
  L.push('');
  L.push('四、下月重点');
  var next = (S.tasks || []).filter(function (x) {
    return x.status !== 'done' && x.priority === 'high';
  }).sort(sortTasks).slice(0, 8);
  if (!next.length) L.push('· 暂无高优先级待办，建议从风险雷达中挑选 1–2 项清理。');
  else next.forEach(function (x) {
    var pj = projectOf(x.projectId);
    L.push('· ' + x.title + (pj ? '（' + pj.name + '）' : '') + '　截止：' + fmtDue(x.dueDate, x.dueTime) + (isOverdueTask(x) ? '（已逾期，需优先清理）' : ''));
  });
  var rm = (S.roadmap || []).filter(function (r) { return r.status !== '已完成'; }).slice(0, 5);
  if (rm.length) {
    L.push('');

    rm.forEach(function (r) { L.push('· [' + r.type + '] ' + r.title + (r.detail ? '：' + r.detail : '')); });
  }
  return L.join('\n');
}

/* ============================================================
   一、FDE 90 天 —— 数据助手
   ============================================================ */
function fdeOk() { return !!(window.FDE_DATA && FDE_DATA.weeks && FDE_DATA.weeks.length); }

function fdeAllDays() {
  if (!fdeOk()) return [];
  var out = [];
  FDE_DATA.weeks.forEach(function (w) {
    (w.days || []).forEach(function (d) {
      var o = {};
      for (var k in d) o[k] = d[k];
      o.week = w.w; o.theme = w.theme; o.color = w.color;
      out.push(o);
    });
  });
  return out;
}
function fdeTotalDays() { return fdeAllDays().length; }
function fdeMap() { return (S.fdeDays && typeof S.fdeDays === 'object' && !Array.isArray(S.fdeDays)) ? S.fdeDays : {}; }
function fdeDone(n) { return !!fdeMap()[String(n)]; }
function fdeDoneCount() {
  var m = fdeMap(), n = 0;
  for (var k in m) if (m[k]) n++;
  return n;
}
function fdePct() {
  var t = fdeTotalDays();
  return t ? Math.round(fdeDoneCount() / t * 100) : 0;
}
function fdeDoneMinutes() {
  var m = fdeMap(), sum = 0;
  fdeAllDays().forEach(function (d) { if (m[String(d.d)]) sum += (d.min || 0); });
  return sum;
}
/* 本周（按周号）完成度 */
function fdeWeekDone(w) {
  var m = fdeMap(), n = 0;
  (w.days || []).forEach(function (d) { if (m[String(d.d)]) n++; });
  return n;
}
function fdePhaseDone(ph) {
  /* 按阶段取周：phases 3 段 → W1-4 / W5-8 / W9-12 */
  var idx = FDE_DATA.phases.indexOf(ph);
  var lo = idx * 4 + 1, hi = lo + 3;
  var m = fdeMap(), done = 0, total = 0;
  FDE_DATA.weeks.forEach(function (w) {
    if (w.w < lo || w.w > hi) return;
    (w.days || []).forEach(function (d) { total++; if (m[String(d.d)]) done++; });
  });
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}
/* 学习活跃日（用于连续天数） */
function fdeActiveDates() {
  var m = fdeMap(), set = {};
  for (var k in m) {
    var at = m[k] && m[k].at;
    if (at) set[String(at).slice(0, 10)] = true;
  }
  return Object.keys(set).sort();
}
function fdeStreak() {
  var dates = fdeActiveDates();
  if (!dates.length) return 0;
  var set = {};
  dates.forEach(function (d) { set[d] = true; });
  var cur = dOff(0), n = 0;
  if (!set[cur]) {
    cur = dOff(-1);
    if (!set[cur]) return 0;
  }
  while (set[cur]) { n++; cur = dOff(-(n)); }
  return n;
}
function fdeLongestStreak() {
  var dates = fdeActiveDates();
  if (!dates.length) return 0;
  var best = 1, run = 1;
  for (var i = 1; i < dates.length; i++) {
    var prev = new Date(dates[i - 1] + 'T00:00:00');
    var now = new Date(dates[i] + 'T00:00:00');
    var gap = Math.round((now - prev) / 86400000);
    run = (gap === 1) ? run + 1 : 1;
    if (run > best) best = run;
  }
  return best;
}
/* 当前第几天：按第一个勾选日 / 起始日推算 */
function fdeCurrentDay() {
  var dates = fdeActiveDates();
  if (dates.length) {
    var d = Math.floor((new Date(dOff(0) + 'T00:00:00') - new Date(dates[0] + 'T00:00:00')) / 86400000) + 1;
    return Math.max(1, Math.min(fdeTotalDays(), d));
  }
  return 1;
}
function fdeToggleDay(n) {
  var m = fdeMap(), k = String(n);
  if (m[k]) delete m[k];
  else m[k] = { at: nowISO() };
  S.fdeDays = m;
  commit(); rerender();
}
function fdeToggleWeek(w) {
  var m = fdeMap(), allDone = true;
  (w.days || []).forEach(function (d) { if (!m[String(d.d)]) allDone = false; });
  (w.days || []).forEach(function (d) {
    if (allDone) delete m[String(d.d)];
    else m[String(d.d)] = m[String(d.d)] || { at: nowISO() };
  });
  S.fdeDays = m;
  commit(); rerender();
  toast(allDone ? '已取消第 ' + w.w + ' 周全部勾选' : '已勾选第 ' + w.w + ' 周（' + (w.days || []).length + ' 天）', 'ok');
}

/* 解析 90 天页面 HTML，取出 DATA（与 tools/fde-sync.mjs 同逻辑） */
function fdeParsePage(text) {
  var re = /<script[^>]*>([\s\S]*?)<\/script>/g, m, dataScript = '';
  while ((m = re.exec(text))) {
    if (/DATA\.phases\s*=/.test(m[1]) && /DATA\.weeks/.test(m[1])) { dataScript = m[1]; break; }
  }
  if (!dataScript) return null;
  var fn = new Function('var DATA={phases:[],weeks:[],exercises:[],glossary:[],checklist:[]};\n' + dataScript + '\nreturn DATA;');
  var d = fn();
  if (!d || !d.weeks || !d.weeks.length) return null;
  return d;
}
/* 轻量指纹（浏览器里没有 node 的 md5，用 FNV-1a 32 位代替，仅作版本标识） */
function fdeFnv(str) {
  var h = 0x811c9dc5;
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h + (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24)) >>> 0;
  }
  return ('0000000' + h.toString(16)).slice(-8);
}
/* 从本地文件同步的数据存在独立 key，避免每次 commit 都写 100KB+ */
var FDE_SNAP_KEY = 'wd_fde_snapshot_v1';
function fdeSnapLoad() {
  try {
    var raw = localStorage.getItem(FDE_SNAP_KEY);
    if (!raw) return false;
    var o = JSON.parse(raw);
    if (!o || !o.data || !o.data.weeks || !o.data.weeks.length) return false;
    FDE_DATA = o.data;
    FDE_SRC = o.src || {};
    FDE_SRC.localFp = true;
    return true;
  } catch (e) { return false; }
}
function fdeSnapSave() {
  try {
    localStorage.setItem(FDE_SNAP_KEY, JSON.stringify({ at: nowISO(), src: FDE_SRC, data: FDE_DATA }));
    return true;
  } catch (e) {
    toast('本地快照保存失败（可能超出浏览器存储上限）：' + (e && e.message ? e.message : e), 'error', 6000);
    return false;
  }
}
function fdeSnapClear() {
  try { localStorage.removeItem(FDE_SNAP_KEY); } catch (e) { }
  FDE_SRC = window.FDE_SRC_BUILTIN || FDE_SRC;
  FDE_DATA = window.FDE_DATA_BUILTIN || FDE_DATA;
}
function fdeApplySync(text, fileName) {
  var d = fdeParsePage(text);
  if (!d) { toast('没能在该文件里找到 90 天计划数据，请确认选的是 fde-90day-plan.html', 'error', 5000); return; }
  var days = d.weeks.reduce(function (n, w) { return n + ((w.days || []).length); }, 0);
  FDE_DATA = { phases: d.phases || [], weeks: d.weeks, exercises: d.exercises || [], glossary: d.glossary || [], checklist: d.checklist || [] };
  FDE_SRC = {
    path: (fileName || '本地文件') + '（浏览器本地快照）', md5: fdeFnv(text), localFp: true,
    bytes: text.length, title: '90 天 FDE 学习计划', syncedAt: nowISO(),
    weeks: d.weeks.length, days: days,
    exercises: (d.exercises || []).length, glossary: (d.glossary || []).length
  };
  var saved = fdeSnapSave();
  S.meta = S.meta || {};
  S.meta.fdeSyncedAt = FDE_SRC.syncedAt;
  /* 清理已不存在的天勾选 */
  var valid = {};
  d.weeks.forEach(function (w) { (w.days || []).forEach(function (x) { valid[String(x.d)] = true; }); });
  var map = fdeMap(), kept = {};
  for (var k in map) if (valid[k]) kept[k] = map[k];
  S.fdeDays = kept;
  commit(); rerender();
  toast('已同步：' + d.weeks.length + ' 周 / ' + days + ' 天，原打勾进度已保留' + (saved ? '' : '（但快照未能持久化）'), 'ok', 4000);
}

function fdeExportMd() {

function downloadText(text, name) {
  try {
    var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    toast('已导出 ' + name, 'ok');
  } catch (e) { toast('导出失败：' + e.message, 'error'); }
}

/* ============================================================
   三、AI 知识练习 —— 助手
   ============================================================ */
function quizModName(id) { return (QUIZ_MOD_MAP[id] || {}).name || id; }
function quizPickList() {
  return QUIZ_BANK.filter(function (q) { return QUIZ_PICK.indexOf(q.m) >= 0; });
}
function quizWrongMap() {
  return (S.quizWrong && typeof S.quizWrong === 'object' && !Array.isArray(S.quizWrong)) ? S.quizWrong : {};
}
function quizWrongIds() { return Object.keys(quizWrongMap()); }
function quizRecords() { return (S.quizRecords || []).slice().reverse(); }
function quizShuffle(a) {
  var r = a.slice();
  for (var i = r.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = r[i]; r[i] = r[j]; r[j] = t;
  }
  return r;
}
function quizStart() {
  var pool = quizPickList();
  if (!pool.length) { toast('请至少选择一个知识点', 'warn'); return; }
  var n = QUIZ_SIZE === 0 ? pool.length : Math.min(QUIZ_SIZE, pool.length);
  var qs = quizShuffle(pool).slice(0, n);
  QUIZ_SESSION = { qs: qs, ans: {}, i: 0, startedAt: Date.now(), sec: 0 };
  QUIZ_RESULT = null;
  startQuizTimer();
  rerender();
}
function quizStartFromWrong() {
  var ids = quizWrongIds();
  var qs = QUIZ_BANK.filter(function (q) { return ids.indexOf(q.id) >= 0; });
  if (!qs.length) { toast('错题本是空的', 'ok'); return; }
  QUIZ_SESSION = { qs: quizShuffle(qs), ans: {}, i: 0, startedAt: Date.now(), sec: 0, wrongOnly: true };
  QUIZ_RESULT = null;
  startQuizTimer();
  rerender();
}
function startQuizTimer() {
  stopQuizTimer();
  QUIZ_TIMER = setInterval(function () {
    if (!QUIZ_SESSION) { stopQuizTimer(); return; }
    QUIZ_SESSION.sec = Math.round((Date.now() - QUIZ_SESSION.startedAt) / 1000);
    var el = document.querySelector('.fq-timer');
    if (el) el.textContent = fmtMs(QUIZ_SESSION.sec * 1000);
  }, 1000);
}
function stopQuizTimer() { if (QUIZ_TIMER) { clearInterval(QUIZ_TIMER); QUIZ_TIMER = null; } }
function quizAnswer(qid, v) {
  if (!QUIZ_SESSION) return;
  QUIZ_SESSION.ans[qid] = v;
  rerender();
}
function quizTo(i) {
  if (!QUIZ_SESSION) return;
  QUIZ_SESSION.i = Math.max(0, Math.min(QUIZ_SESSION.qs.length - 1, i));
  rerender();
}
function quizQuit() {
  confirmDialog({ title: '退出本次练习', message: '已作答的内容不会保存，确定退出吗？', danger: true, confirmText: '退出' })
    .then(function (ok) { if (!ok) return; stopQuizTimer(); QUIZ_SESSION = null; QUIZ_RESULT = null; rerender(); });
}
function quizSubmit() {
  var s = QUIZ_SESSION;
  if (!s) return;
  var answered = 0;
  s.qs.forEach(function (q) { if (s.ans[q.id] !== undefined) answered++; });
  if (answered < s.qs.length) {
    confirmDialog({
      title: '还有题目未作答', message: '共 ' + s.qs.length + ' 题，已作答 ' + answered + ' 题。未作答将计为错误，确定交卷吗？',
      confirmText: '确定交卷'
    }).then(function (ok) { if (ok) quizGrade(); });
    return;
  }
  quizGrade();
}
function quizGrade() {
  var s = QUIZ_SESSION;
  if (!s) return;
  var detail = [], right = 0;
  s.qs.forEach(function (q) {
    var ua = s.ans[q.id];
    var ok = (q.k === 'c') ? (ua === q.a) : (ua === q.a);
    if (ok) right++;
    detail.push({ qid: q.id, m: q.m, k: q.k, ok: ok, ua: (ua === undefined ? null : ua) });
  });
  var total = s.qs.length;
  var score = Math.round(right / total * 100);
  var rec = {
    id: uid(), at: nowISO(),
    mods: QUIZ_PICK.length ? QUIZ_PICK.slice() : [],
    total: total, right: right, score: score,
    usedSec: s.sec || Math.round((Date.now() - s.startedAt) / 1000),
    wrongOnly: !!s.wrongOnly,
    detail: detail
  };
  S.quizRecords = S.quizRecords || [];
  S.quizRecords.push(rec);
  /* 错题本：答错进入，答对移出 */
  var wm = quizWrongMap();
  detail.forEach(function (d) {
    if (d.ok) { if (wm[d.qid]) delete wm[d.qid]; }
    else { wm[d.qid] = { n: ((wm[d.qid] && wm[d.qid].n) || 0) + 1, lastAt: rec.at }; }
  });
  S.quizWrong = wm;
  stopQuizTimer();
  QUIZ_RESULT = rec;
  QUIZ_SESSION = null;
  commit(); rerender();
  toast('本次得分 ' + score + ' 分（' + right + '/' + total + '）', score >= 80 ? 'ok' : (score >= 60 ? 'warn' : 'error'), 4000);
}

/* 统计：按知识点正确率 */
function quizModStats() {

AI_MODEL 就行\n    messages=[                               # 模型唯一能看到的东西，全在这\n        {\"role\": \"system\", \"content\": \"你是一个说话简洁的助手。\"},   # 人设，放第一条效果最好\n        {\"role\": \"user\", \"content\": QUESTION},\n    ],\n    temperature=TEMPERATURE,\n    max_tokens=MAX_TOKENS,\n)\n\nprint(\"模型回答:\", resp.choices[0].message.content)\nprint(\"结束原因:\", resp.choices[0].finish_reason)   # stop=正常  length=被截断  tool_calls=要调工具\nprint(\"输入token:\", resp.usage.prompt_tokens)\nprint(\"输出token:\", resp.usage.completion_tokens)\nprint(\"合计token:\", resp.usage.total_tokens)"},"practice":["练习1 temperature 对比","练习2 max_tokens 与 finish_reason","练习3 system 消息的位置","练习4 token 账单","练习5 messages 就是记忆","练习6 长对话与滑动窗口"],"quiz":{"q":"为什么 system 消息要放在 messages 第一条？","a":"模型会看到全部消息，人设与总指令放最前面 = 先立规矩再干活，后续 user 内容对它的影响才可控。放中间或末尾，指令权重会被最近的内容稀释。"}},{"d":2,"t":"Function Calling：给模型装上手","min":90,"steps":["先读不跑：通读 week1/day2_tools.py，标出 5 个位置：tools 声明 / get_weather 实现 / 第1次调用 / for 循环执行 / 第2次调用","跑 day2_tools.py（假数据），看「模型决定调用 N 个工具」这行输出","跑 day2_tools_live.py：自己敲问题，q 退出、clear 清历史，接的是真实 Open-Meteo 天气","做练习 1（看清 tool_calls 三个字段）与练习 4（一次调多个工具）","做练习 2、3 故意踩坑（漏 assistant 消息 / tool_call_id 写错），把报错长相记下来"],"concept":{"t":"工具调用的本质 + 三个坑","b":"模型不执行任何代码，它只输出「我想调哪个函数、传什么参数」的 JSON，真正执行的是你的程序。闭环 = 第1次调用（模型决定）→ 你执行 → 结果以 role=tool 塞回 → 第2次调用（模型总结）。三个坑：① 返回 tool_calls 的那条 assistant 消息必须 append 回 messages，否则模型失忆；② tool_call_id 必须等于 call.id；③ tool_calls 是列表，可能一次要调多个，不能只取 [0]。"},"code":{"t":"week1/day2_tools.py（核心片段）","src":"tools = [{\n    \"type\": \"function\",\n    \"function\": {\n        \"name\": \"get_weather\",\n        # description 是模型做决策的唯一依据，写得越具体它判断越准\n        \"description\": \"查询指定城市的当前天气，返回气温、天气状况和风力。只在用户问天气时使用。\",\n        \"parameters\": {\n            \"type\": \"object\",\n            \"properties\": {\"city\": {\"type\": \"string\", \"description\": \"城市名，如 北京\"}},\n            \"required\": [\"city\"],\n        },\n    },\n}]\n\nresp = client.chat.completions.create(model=MODEL, messages=messages, tools=tools)\nmsg = resp.choices[0].message\nmessages.append(msg)          # 坑①：assistant 消息必须加回历史\n\nfor call in msg.tool_calls:   # 坑③：可能一次要调多个工具，别只取 [0]\n    args = json.loads(call.function.arguments)\n    result = TOOL_MAP[call.function.name](**args)      # 真正执行的是你的代码\n    messages.append({\n        \"role\": \"tool\",\n        \"tool_call_id\": call.id,      # 坑②：id 必须和 call.id 对上\n        \"content\": result,\n    })\n\nfinal = client.chat.completions.create(model=MODEL, messages=messages)\nprint(final.choices[0].message.content)"},"practice":["练习1 看清 tool_calls 结构","练习2 漏掉 assistant 消息会怎样","练习3 tool_call_id 写错会怎样","练习4 一次调多个工具","练习5 工具出错的两种写法"],"quiz":{"q":"模型返回了 tool_calls，此时应该直接给用户答复吗？","a":"不该。必须执行工具、把结果以 role=\"tool\" 和对应的 tool_call_id 塞回 messages，再请求一次，让模型基于真实数据作答。跳过这一步 = 模型只能靠猜，幻觉就来了。"}},{"d":3,"t":"结构化输出：让模型按格式吐 JSON","min":80,"steps":["用 response_format={\"type\":\"json_object\"} 强制 JSON","让模型把一条客户工单解析成 category / priority / reason / need_human_review","用 json.loads 解析并断言字段齐全","故意在提示词里要求输出第五个不存在的字段，观察模型如何处理","写一个 safe_parse：解析失败时重试一次，仍失败则转人工队列"],"concept":{"t":"结构化输出 = 程序与模型的契约","b":"Agent 的下游是代码，不是人。输出必须能被 json.loads，字段必须稳定。三道保险：schema 约束 + 解析失败重试 + 仍失败转人工。这一步做不牢，后面所有自动化都建在沙子上。"},"code":{"t":"week1/day3_structured.py（核心片段）","src":"SCHEMA_HINT = \"\"\"只输出 JSON，字段：\n{\"category\": \"退款问题|物流问题|质量问题|其他\",\n \"priority\": \"high|medium|low\",\n \"reason\": \"一句话说明原因\",\n \"need_human_review\": true|false}\"\"\"\n\ndef classify(text):\n    resp = client.chat.completions.create(\n        model=MODEL,\n        messages=[{\"role\": \"system\", \"content\": SCHEMA_HINT},\n                  {\"role\": \"user\", \"content\": text}],\n        response_format={\"type\": \"json_object\"},\n        temperature=0,\n    )\n    try:\n        data = json.loads(resp.choices[0].message.content)\n    except json.JSONDecodeError:\n        return {\"category\": \"其他\", \"priority\": \"high\",\n                \"reason\": \"解析失败，转人工\", \"need_human_review\": True}\n    if
