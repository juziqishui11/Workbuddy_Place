set(data) < {\"category\", \"priority\", \"reason\", \"need_human_review\"}:\n        data[\"need_human_review\"] = True          # 字段缺失 → 不放行\n    return data"},"practice":["练习1 让输出变成 JSON","练习2 字段缺失怎么办","练习3 解析失败重试一次","练习4 枚举值越界时兜底","练习5 批量解析 20 条看失败率"],"quiz":{"q":"为什么结构化输出失败时要转人工而不是重试到成功？","a":"重试到成功会掩盖真实失败率，且模型对同一输入可能持续输出坏格式。转人工队列既保证业务不中断，又给你留下一条真实的失败样本——这批样本正是后面做 eval 的黄金数据。"}},{"d":4,"t":"流式输出 SSE：打字机效果怎么来的","min":80,"steps":["stream=True 发请求，逐 chunk 打印 delta.content","实现打字机效果（flush + 无换行）","记录首字延迟（TTFT）与总耗时，对比非流式","把流式内容累加成完整字符串再解析（流式 + JSON 的坑）","思考：什么场景必须流式，什么场景不需要"],"concept":{"t":"流式改变的是体感，不是能力","b":"模型生成速度没变，但用户从\"等 8 秒看到结果\"变成\"0.5 秒开始出字\"。对人参与的界面（客服后台、审核台）几乎是必需；对后台批处理任务反而增加解析复杂度。FDE 要会判断：这个界面需不需要流式。"},"code":{"t":"week1/day4_stream.py（核心片段）","src":"import time\nt0 = time.time()\nfirst = None\nbuf = []\n\nstream = client.chat.completions.create(\n    model=MODEL, messages=[{\"role\": \"user\", \"content\": \"用 200 字讲清什么是 Agent\"}],\n    stream=True,\n)\nfor chunk in stream:\n    delta = chunk.choices[0].delta.content or \"\"\n    if delta:\n        if first is None:\n            first = time.time() - t0\n        buf.append(delta)\n        print(delta, end=\"\", flush=True)      # 打字机\n\nprint(\"\\n---\")\nprint(\"首字延迟: %.2fs\" % (first or 0))\nprint(\"总耗时:   %.2fs\" % (time.time() - t0))\nprint(\"完整内容:\", \"\".join(buf))"},"practice":["练习1 打开流式看 chunk","练习2 量首字延迟","练习3 流式 + JSON 的坑","练习4 断流重连怎么办","练习5 什么时候不该用流式"],"quiz":{"q":"流式输出还能用 JSON 解析吗？","a":"能，但要先累加完所有 chunk 再 json.loads，不能边收边解析。中途解析必然失败。更好的做法是让模型边流式边用固定分隔符（如先输出 reason 再输出 JSON 块），或干脆对该请求关闭流式。"}},{"d":5,"t":"上下文与成本：长对话怎么办","min":80,"steps":["跑 day1_exercises.py 练习 6：看 5 轮对话的输入 token 从 22 一路涨到 80","把 KEEP_ROUNDS 改成 1 再跑一次，看模型开始胡编","动手写滑动窗口：messages = [messages[0]] + messages[-(N*2):]","对比三种裁剪法的代价：滑动窗口 / 摘要压缩 / token 预算","把观察写进 notes/day01.md 第 5b 节"],"concept":{"t":"上下文窗口与三种裁剪法","b":"代码不会因为聊得久就变长（一个 list + 一个循环就够），真正会涨的是 token：每轮都要把整段历史重发一遍，而且上下文窗口有上限，超了直接报错。三种解法：滑动窗口（只留最近 N 轮，最省事但会忘事）、摘要压缩（让模型把旧对话总结成一段再替换，保住要点但多花一次调用）、token 预算裁剪（超预算就从最老的开始丢，精确但代码最啰嗦）。"},"code":{"t":"多轮循环 + 滑动窗口","src":"messages = [{\"role\": \"system\", \"content\": \"你是一个说话简洁的助手。\"}]\n\nwhile True:\n    question = input(\"你: \")\n    if question in (\"q\", \"退出\"):\n        break\n    messages.append({\"role\": \"user\", \"content\": question})\n    resp = client.chat.completions.create(model=MODEL, messages=messages)\n    answer = resp.choices[0].message.content\n    messages.append({\"role\": \"assistant\", \"content\": answer})   # 模型说过的话也要存\n\n    # 只保留 system + 最近 2 轮（每轮 = user + assistant 两条，所以乘 2）\n    messages = [messages[0]] + messages[-(2 * 2):]\n\n    print(\"助手:\", answer)\n    print(\"本轮输入 token:\", resp.usage.prompt_tokens)"},"practice":["练习6 长对话与滑动窗口","把 KEEP_ROUNDS 改成 1 复现遗忘","用摘要压缩替换掉最老的 3 轮","统计 20 轮不裁剪要花多少 token"],"quiz":{"q":"滑动窗口解决了什么问题，又带来什么问题？","a":"解决了 token 无限增长和上下文超限；带来的是「会忘事」——被裁掉的早期内容模型再也看不到了。想要既省钱又不失忆，就用摘要压缩把旧对话浓缩成一段再放回历史。"}},{"d":6,"t":"工程地基① Git + 目录规范 + 密钥管理","min":60,"steps":[".gitignore 加 .env、__pycache__/、*.log、venv/","确认 git status 里看不到 .env；若已提交过，立刻轮换 key","确认目录规范：week1…week12/ 放脚本，notes/ 放笔记，common/ 放公共层","首次 commit，建 GitHub 仓库并 push","README 写一句话：这个项目是干什么的、怎么跑起来"],"concept":{"t":"FDE 为什么必须会 Git","b":"FDE 常年进客户现场改代码：能回滚、能开分支做实验、能看 diff 解释\"我改了什么\"，是基本职业素养。密钥进 Git 是最常见的事故——面试问到\"你踩过什么坑\"，这是一个真实且加分的答案。"},"practice":["把 week1/ 全部脚本提交一次","故意把 .env 加进暂存区再救回来","用 git diff 看今天改了什么"],"quiz":{"q":"不小心把 .env 提交并 push 了，正确的三步是什么？","a":"1) 立刻到平台轮换/作废该 key；2) 把 .env 加入 .gitignore 并从版本库移除（git rm --cached .env）；3) 提交并 push 修正。注意：仅删除文件不够，历史里的 key 已被爬虫盯上，必须轮换。"}},{"d":7,"t":"周末大块：token 成本账本 + 收敛 minillm.py","min":150,"steps":["写 cost.py：输入单价、输出单价，按 model 查表计算费用","把 D1–D6 的代码收敛成 common/minillm.py，对外只暴露 chat / stream / tool / cost 四个函数","所有脚本改成从 minillm import，删除重复代码","把本周 6 个练习文件里没做完的题补完，重跑一遍确认还能跑","README 写清：怎么装依赖、怎么配 .env、怎么跑第一个例子","notes/week1.md 写本周复盘：学会了什么、卡在哪、下周怎么改"],"concept":{"t":"为什么要收敛工具层","b":"FDE 在现场改的是业务逻辑，不是每次重写 API 调用。把模型调用收敛成一个文件后，换模型、加日志、加成本统计都只改一处。这个小动作，是\"脚本\"和\"项目\"的分界线。"},"practice":["把 day1 到 day6 的练习各重跑一遍","写 common/minillm.py 并替换旧调用","算一遍本周一共花了多少 token"],"deliver":"验收：minillm.py 四个函数都能跑通 + GitHub 有第一个 commit + notes/week1.md"}]},{"w":2,"range":"D8–D14","theme":"Prompt 工程 + 第一个 Agent","color":"#7c6cff","series":"对齐系列 Round 2（Day 8–14）","foundation":"工程地基：异常分层 / logging / pytest","deliver":"CLI 研究 Agent（argparse + logging + ≥3 条 pytest）","days":[{"d":8,"t":"系统提示词设计：被模型的\"随机\"整不会了","min":90,"steps":["把 system 拆成三段：角色 / 约束 / 输出格式","同一问题写 3 版 system，各跑 3 次，记录输出差异","加\"不确定时说不知道\"这类反向约束，看幻觉是否减少","把 temperature 降到 0，再跑一遍对比","固定一版作为项目默认提示词，写进 prompts/ 目录"],"concept":{"t":"提示词是可版本化的资产","b":"不要散落在代码字符串里。放进 prompts/*.txt，用 Git 管理，改一次提交一次。FDE 现场最常见的需求就是\"让它别这么说\"——提示词独立出来才能快速迭代，也能向客户解释你改了什么。"},"quiz":{"q":"提示词效果不稳定，先调 temperature 还是先改提示词？","a":"先降 temperature 到 0 排除随机性，确认\"到底是提示词不行还是模型在抖\"。稳定后再逐步加温。跳过这步直接改提示词，会让你在噪声里做优化。"}},{"d":9,"t":"ReAct 原理：Thinking 不是一次性想完","min":90,"steps":["理解 Thought → Action → Observation 的循环","纸上手推一个例子：查某公司成立时间，需搜索两次","用代码跑通 3 轮循环，打印每轮 Thought 与 Observation","故意让工具返回错误，看模型会不会换一种方式重试","记录：什么时候模型会陷入死循环"],"concept":{"t":"ReAct = 边想边做","b":"不是先想好完整计划再执行，而是每步\"想一下 → 做个动作 → 看结果 → 再想\"。优点：能根据中间结果调整；缺点：步数不可控、容易绕圈。适合探索性任务（查资料、排查问题）。"},"code":{"t":"week2/day9_react.py（循环骨架）","src":"for step in range(MAX_STEPS):                 # 必须有步数上限\n    resp = llm(messages, tools=TOOLS)\n    msg = resp.choices[0].message\n\n    if not msg.tool_calls:                     # 不再要工具 → 收工\n        return msg.content\n\n    messages.append(msg)\n    for call in msg.tool_calls:\n        try:\n            out = TOOLS[call.function.name](**json.loads(call.function.arguments))\n        except Exception as e:\n            out = \"工具执行失败: %s\" % e        # 把错误喂回去，让它换招\n        messages.append({\"role\": \"tool\", \"tool_call_id\": call.id,\n                         \"content\": str(out)})\nelse:\n    return \"超过最大步数，转人工\"                # 死循环兜底"},"quiz":{"q":"手写 ReAct 循环里最不能省的是哪一行？","a":"MAX_STEPS 上限和超限后的兜底返回。没有它，模型在两个工具之间来回调用会一直烧钱直到超时——这是 Agent 线上事故里排名前三的原因。"}},{"d":10,"t":"Plan-and-Execute：大任务先列清单","min":90,"steps":["实现两阶段：先让模型输出步骤清单，再逐步执行","与 D9 的 ReAct 跑同一个任务，对比步数、耗时、成功率","思考：哪些任务适合先规划，哪些适合边想边做","给计划加\"步骤可增删改\"的能力（执行中发现计划不对）","把对比结论写进 notes/day10.md"],"concept":{"t":"两种范式的取舍","b":"Plan-and-Execute：先出全局清单，步骤清晰、成本可控、适合流程固定的任务（报告生成、批处理）。ReAct：边做边看，适合路径不确定的探索任务。真实系统常常是混合——先粗规划，每个步骤内部允许 ReAct。"},"quiz":{"q":"用户说\"帮我做一份调研报告\"，选哪种？为什么？","a":"Plan-and-Execute。\"检索→起草→润色→配图\"的步骤相对固定，先列清单能并行、能控成本、也方便中途给用户看进度。纯 ReAct 会让它在检索里绕圈，你也不知道它到底进行到哪一步。"}},{"d":11,"t":"工程地基② 异常分层 + logging","min":70,"steps":["区分三类异常：可重试（网络超时/限流）、需降级（工具失效）、必须停（鉴权失败/数据越界）","写 @retry 装饰器：指数退避 + 最大次数 + 只重试可重试异常","配置 logging：控制台 INFO、文件 DEBUG、含时间/模块/级别","在 minillm.py 里接入日志与重试","故意断网跑一次，看日志能否定位问题"],"concept":{"t":"错误分类决定处理策略","b":"把所有异常都 catch 成\"失败\"是最糟的做法。可重试的该重试、需降级的该给用户部分结果、必须停的该立刻报警。FDE 交付的系统里，\"出错时它做了什么\"比\"它平时多聪明\"更影响客户信任。"},"code":{"t":"common/retry.py","src":"import time, functools, logging\nlog = logging.getLogger(__name__)\n\nRETRYABLE = (TimeoutError, ConnectionError)\n\ndef retry(times=3, base=0.5):\n    def deco(fn):\n        @functools.wraps(fn)\n        def wrapper(*a, **kw):\n            for i in range(times):\n                try:\n                    return fn(*a, **kw)\n                except RETRYABLE as e:\n                    if i == times - 1:\n                        raise\n                    wait = base * (2 ** i)\n                    log.warning(\"第 %d 次失败: %s，%.1fs 后重试\", i + 1, e, wait)\n                    time.sleep(wait)\n        return wrapper\n    return deco"},"quiz":{"q":"为什么重试要指数退避而不是立刻重试？","a":"限流和瞬时故障需要时间恢复，立刻重试大概率再失败，还会放大下游压力（雪崩）。指数退避 + 抖动既给下游喘息时间，又避免多个请求同时重试造成尖峰。"}},{"d":12,"t":"第一个完整 Agent：提示词 + 工具 + 循环","min":100,"steps":["给 Agent 配两个工具：search_web（本地字典模拟）、save_outline（写文件）","把 D8 提示词 + D9/D10 循环 + D11 日志串起来","跑一个真实任务：\"调研 X 话题并输出大纲到文件\"","打印每一步，确认工具真的被调用、文件真的被写入","加步数上限与失败兜底"],"concept":{"t":"Agent = 模型 + 循环 + 工具 + 记忆","b":"四个零件缺一不可。只接了模型是聊天机器人；加了循环和工具才是 Agent；能记住前面做过什么，才敢交给它长任务。今天你第一次把四件套凑齐。"},"quiz":{"q":"怎么判断一个东西\"真的是 Agent\"而不是\"调了几次 API\"？","a":"看它能不能根据上一步的结果自主决定下一步。硬编码顺序调用 3 次 API 是工作流；模型自己判断\"这条查不到，换个关键词再查\"才是 Agent。"}},{"d":13,"t":"工程化 CLI：从脚本变成能反复用的工具","min":90,"steps":["用 argparse 支持 --query / --max-steps / --verbose / --output","配置从 .env + 命令行参数合并","日志写进 logs/ 目录，按天切分","README 补上使用示例（3 条命令）","让同事/朋友照着 README 跑一次，记录他卡在哪"],"concept":{"t":"能被别人跑起来才算交付","b":"FDE 交付的不是代码，是\"别人能用它完成任务\"。README 写不清、依赖装不上、参数靠猜，功能再强也等于没交付。今天让一个真人试着跑一次，是本周最有价值的一步。"},"quiz":{"q":"别人按 README 跑不起来，最常见的三个原因是什么？","a":"① 依赖没锁版本；② .env 示例缺失或字段名不对；③ 假设了某个前置条件（如当前目录、Python 版本、已登录）却没写。解法：用全新虚拟环境从零跟一遍 README。"}},{"d":14,"t":"周末大块：pytest 三条测试 + 周复盘","min":150,"steps":["为 minillm 写 3 条测试：正常调用、工具调用、解析失败转人工","用 monkeypatch 假造 LLM 返回，测试不花一分钱","跑 pytest，覆盖率先不看，先把流程跑通","notes/week2.md 写复盘：Agent 循环里你最没把握的是哪一步","把\"最没把握\"的那一点记下来，W7 做 eval 时会回来解决"],"concept":{"t":"不 mock 的 LLM 测试不可持续","b":"每次跑测试都真调 API = 花钱 + 慢 + 不稳定。把模型返回 mock 掉，测的是你的逻辑（解析、分发、兜底），这才是单元测试该干的事。真模型留给 W7 的 eval 套件。"},"deliver":"验收：CLI 研究 Agent 可重复运行 + 3 条 pytest 通过 + notes/week2.md"}]},{"w":3,"range":"D15–D21","theme":"Agent 框架：手写 → LangGraph → Pydantic AI","color":"#8b7cff","series":"对齐系列 Round 3（Day 16–21）","foundation":"工程地基：SQL + SQLite 持久化","deliver":"带 checkpoint 记忆的 LangGraph Agent + 一段 ADR（手写 vs 框架）","days":[{"d":15,"t":"手写 Agent Loop：从零理解编排本质","min":90,"steps":["不用任何框架，写 60 行的最小 loop","状态用普通 dict 传递，工具用 dict 分发","对比 W2 的 ReAct 实现，找出你之前没处理的情况","思考：如果工具要并行、要回退、要人工介入，代码会变成什么样","把\"变复杂的点\"列成清单，这就是框架存在的理由"],"concept":{"t":"先手写再用框架","b":"直接上框架会让你把\"框架的行为\"误当成\"Agent 的原理\"。手写一遍后，再看 LangGraph 的节点/边/状态，你会知道它替你解决了什么、又悄悄拿走了什么控制权。这是面试时区分\"用过\"和\"懂\"的分水岭。"},"quiz":{"q":"什么情况下你应该坚持手写而不是上框架？","a":"工具少于 3 个、流程是线性或单循环、团队没人熟悉该框架、交付周期以天计。框架的价值随\"分支/并行/回退/人工介入\"的复杂度增长，简单场景上框架是纯负担。"}},{"d":16,"t":"LangGraph 入门：状态图 / 节点 / 边","min":90,"steps":["理解三个概念：State（状态）、Node（干活的函数）、Edge（怎么走）","把 D15 手写的 loop 改写成 3 个节点：plan → act → summarize","加一条条件边：需要工具就回 act，否则去 summarize","跑通并打印每一步的状态变化","对比两种写法的代码量与可读性"],"concept":{"t":"图比链强在哪","b":"Chain 是 A→B→C 一条道；Graph 允许条件分支、循环回退、并行汇合。Agent 的本质是\"可能回头\"的流程，所以图是更贴合的表达。但图的复杂度会上升——这也是\"什么时候不该上框架\"的另一面。"},"code":{"t":"week3/day16_graph.py（核心片段）","src":"from typing import TypedDict\nfrom langgraph.graph import StateGraph, END\n\nclass State(TypedDict):\n    messages: list\n    steps: int\n\ndef plan(s: State):  return {\"messages\": s[\"messages\"] + [llm_plan(s)]}\ndef act(s: State):   return {\"messages\": s[\"messages\"] + run_tool(s), \"steps\": s[\"steps\"] + 1}\n\ndef should_continue(s: State):\n    if s[\"steps\"] >= 5:          return \"end\"      # 步数闸门\n    return \"act\" if need_tool(s) else \"summarize\"\n\ng = StateGraph(State)\ng.add_node(\"plan\", plan); g.add_node(\"act\", act); g.add_node(\"summarize\", summarize)\ng.set_entry_point(\"plan\")\ng.add_conditional_edges(\"act\", should_continue,\n                        {\"act\": \"act\", \"summarize\": \"summarize\", \"end\": END})\napp = g.compile()"},"quiz":{"q":"条件边 should_continue 里为什么要有步数闸门？","a":"图有了回退能力 = 有了死循环的可能。步数闸门是图的\"紧急停止按钮\"，任何允许回环的边都必须配一个终止条件，否则线上就是一个烧钱黑洞。"}},{"d":17,"t":"Pydantic AI 入门：把输出类型锁死","min":80,"steps":["用 Pydantic 定义输出模型（BaseModel + Field 描述）","让框架保证输出符合模型，不符合自动重试","对比手写 json.loads + 校验的代码量","给字段加校验：priority 只能是 high/medium/low","思考：类型安全对 Agent 意味着什么"],"concept":{"t":"类型即契约","b":"手写解析是\"祈祷模型输出对 + 事后检查\"；Pydantic 是\"声明我要什么 + 框架负责对齐\"。对 FDE 而言，它把不确定的模型输出变成了下游可以放心消费的数据结构——这是 Agent 能接进业务系统的前提。"},"quiz":{"q":"字段校验失败时，框架自动重试算不算好设计？","a":"是，但必须限次数并留痕。自动重试 1-2 次能救回大部分格式抖动；无限重试会掩盖提示词本身的缺陷。每次重试都应记日志——重试率就是一个现成的质量指标。"}},{"d":18,"t":"记忆：checkpoint 让 Agent 记得住事","min":80,"steps":["用 SqliteSaver 给图加 checkpoint","跑两次，第二次能接着上次的 thread_id 继续","中断一个长任务，重启程序后恢复","理解 short-term（本轮上下文）vs long-term（跨会话）的区别","思考：你的主线项目需要哪种记忆"],"concept":{"t":"记忆的类型","b":"短期=对话窗口内的上下文（会随长度被截断）；长期=跨会话持久化的事实（用户偏好、历史工单）；情景=某次任务的完整轨迹（用于回放和审计）。FDE 项目至少要有第三种——出问题时能回放\"它当时到底干了什么\"。"},"quiz":{"q":"为什么\"能回放\"对企业客户特别重要？","a":"因为 Agent 会改动业务数据。出事后客户第一句问的是\"它为什么这么干\"，第二句是\"改了哪些\"。没有完整 trace，你无法回答，也就无法取得信任，更无法通过合规审查。"}},{"d":19,"t":"工程地基③ SQL + SQLite 持久化","min":80,"steps":["复习：建表 / 主键 / 索引 / 关联 / 事务","写 tickets 表：id, text, category, priority, created_at","把 D5 的分类结果写进 SQLite，再按 category 聚合查询","用参数化查询（? 占位符），杜绝 SQL 拼接","理解：为什么不能把客户数据全塞进提示词"],"concept":{"t":"数据留在库里，只把需要的喂给模型","b":"把整表塞进提示词 = 成本高、上下文爆、且把全部数据暴露给模型供应商。正确做法：SQL 先过滤聚合，只把相关的几条喂进去。这既是成本问题，也是合规问题。"},"code":{"t":"week3/day19_db.py（核心片段）","src":"import sqlite3\n\ncon = sqlite3.connect(\"data/app.db\")\ncon.execute(\"\"\"CREATE TABLE IF NOT EXISTS tickets(\n    id INTEGER PRIMARY KEY, text TEXT NOT NULL,\n    category TEXT, priority TEXT, created_at TEXT)\"\"\")\n\n# 参数化查询，绝不拼接字符串\ncon.execute(\"INSERT INTO tickets(text,category,priority,created_at) VALUES(?,?,?,?)\",\n            (text, cat, pri, ts))\ncon.commit()\n\nrows = con.execute(\n    \"SELECT category, COUNT(*) c FROM tickets WHERE created_at >= ? GROUP BY category\",\n    (since,)).fetchall()"},"quiz":{"q":"让 AI 查数据，是\"把数据给它\"还是\"让它写 SQL\"？","a":"生产环境优先：你写固定 SQL + 参数化，模型只填参数（如时间范围、类别）。让模型自由写 SQL 风险高（注入、全表扫描、删库），除非加只读账号 + 白名单 + 结果行数限制三层防护。"}},{"d":20,"t":"用 LangGraph 重写 W2 的 Agent","min":100,"steps":["把 W2 的 CLI 研究 Agent 用图重写一遍","保留同样的 CLI 参数，行为一致","对比：代码行数、可读性、可加回退的难易度","给图加一个\"人工确认\"节点（interrupt）","跑通后把两版都留在仓库，作为 ADR 的素材"],"concept":{"t":"重写是最好的验收","b":"能用两种方式实现同一个东西，说明你理解的是原理不是语法。而且这次重写会暴露你 W2 没处理好的边界情况——那些就是生产事故的伏笔。"},"quiz":{"q":"interrupt（人工确认节点）应该放在哪些动作前？","a":"一切不可逆或有外部影响的动作前：发消息、写回业务系统、退款、改权限、删除。只读操作可以不拦。判断标准只有一句：这个动作做错了，能不能撤回？"}},{"d":21,"t":"周末大块：记忆持久化 + 写第一段 ADR","min":150,"steps":["把 checkpoint 落到 SQLite 文件，确认重启后可恢复","写 docs/adr-001-agent-framework.md：背景 / 候选方案 / 选择 / 后果","ADR 里明确写出\"什么情况下我们会换掉这个选择\"","notes/week3.md 复盘：手写 vs 框架，你更倾向哪个，为什么","把 ADR 发到群里/给朋友看，让别人提一个问题"],"concept":{"t":"ADR 是 FDE 的职场护身符","b":"架构决策记录（Architecture Decision Record）回答三件事：当时为什么这么选、放弃了什么、什么信号出现就该改。它让\"技术选型\"从个人口味变成可讨论的事实，也是作品集里最能体现工程成熟度的单页文档。"},"deliver":"验收：带记忆的 LangGraph Agent + docs/adr-001 一段 + notes/week3.md"}]},{"w":4,"range":"D22–D28","theme":"RAG 全链路：给 Agent 装外接大脑","color":"#22c1c3","series":"对齐系列 Round 4（Day 22–29）","foundation":"工程地基：FastAPI 最小服务","deliver":"本地知识库问答原型 + 召回评估脚本（hit rate / MRR）","days":[{"d":22,"t":"RAG 概念：从闭卷考试到开卷考试","min":70,"steps":["理解三步：检索 → 增强 → 生成","列出模型的四个天然短板（不知私有数据 / 上下文装不下 / 会硬编 / 知识有截止）","判断：你的主线项目哪些问题该用 RAG，哪些不该","写下\"不该用 RAG\"的三类场景","画一张你的 RAG 流程图（纸上手画即可）"],"concept":{"t":"RAG 的分工","b":"知识放在你自己的库里，模型只负责\"看着资料组织答案\"，不负责记住资料。判断口诀：资料多到贴不下 + 答案必须基于资料 + 资料会更新 → 用 RAG。三条都不满足就别上。"},"quiz":{"q":"公司只有 3 页制度文档，要不要做 RAG？","a":"不要。直接贴进提示词，简单、便宜、准确。上 RAG 反而引入切分和召回误差。等文档涨到贴不下（比如几十页以上）或需要频繁更新时再上——这是 FDE 控制复杂度的典型判断。"}},{"d":23,"t":"Embedding：让\"智能体\"和\"Agent\"是一回事","min":90,"steps":["调用 embedding 接口，把几句话变成向量","手算余弦相似度，验证近义句向量更近","对比关键词匹配：为什么\"智能体\"搜不到\"Agent\"","批量向量化并缓存，避免重复花钱","理解维度与成本、精度的关系"],"concept":{"t":"Embedding 解决的是\"按意思找\"","b":"把每句话映射成一个向量，意思相近的句子在数学上距离更近。它是\"检索\"这一步的地基，也是 RAG 三步里唯一真正的新东西（另两步你早就做过）。"},"code":{"t":"week4/day23_embed.py（核心片段）","src":"import math\n\ndef cosine(a, b):\n    dot = sum(x * y for x, y in zip(a, b))\n    return dot / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b)))\n\ntexts = [\"如何申请年假\", \"年假怎么休\", \"今天的天气\"]\nvecs = [client.embeddings.create(model=EMB_MODEL, input=t).data[0].embedding\n        for t in texts]\n\nprint(\"年假 vs 年假:\", round(cosine(vecs[0], vecs[1]), 3))   # 高\nprint(\"年假 vs 天气:\", round(cosine(vecs[0], vecs[2]), 3))   # 低"},"quiz":{"q":"Embedding 结果要不要缓存？为什么？","a":"必须缓存。同一段文本向量化结果不变，重复调用是纯浪费；文档更新时按内容哈希失效即可。在几百页的知识库上，缓存能省掉绝大部分嵌入成本，也大幅缩短二次启动时间。"}},{"d":24,"t":"Chunking：资料怎么切才不切碎语义","min":80,"steps":["实现固定长度切分和递归分隔符切分两种","用同一批文档对比：切太小（语义断裂）、切太大（噪声多）","加 overlap（重叠），观察召回变化","给每个 chunk 加元数据（来源、页码、版本）","做一张对比表：size / overlap / 召回效果"],"concept":{"t":"切分决定召回上限","b":"检索再准，如果正确的那段话被切成了两半，也召回不到。经验起点：300–500 字 + 10–20% 重叠，按文档类型调。元数据是救命的——它让你能回答\"这句话出自哪份文件第几页\"，这是企业客户最在心的可溯源要求。"},"quiz":{"q":"为什么每个 chunk 都必须带来源元数据？","a":"因为企业场景里\"答对了\"不够，还要\"能溯源\"。没有来源，用户无法验证，法务无法审核，出问题无法定责。带元数据的 RAG 是可审计系统，不带的是玩具。"}},{"d":25,"t":"向量库：Chroma 存起来再查","min":90,"steps":["把 D23 的向量和 D24 的 chunk 存进 Chroma 本地库","实现 similarity_search(query, k=3)","测试：换不同措辞问同一件事，召回是否稳定","加元数据过滤（只看某个版本的政策）","持久化到磁盘，重启后不用重建"],"concept":{"t":"向量库不是必需品，但很方便","b":"几百条数据用内存列表 + 余弦相似度就够。上向量库的理由是：持久化、元数据过滤、增量写入、以及后期要换混合检索/重排。先跑通内存版再换库，你会更清楚库替你做了什么。"},"quiz":{"q":"什么时候该引入重排（Rerank）？","a":"当\"召回回来的 10 条里正确那条排在第 7 位\"时——向量召回的粗排精度不够。表现为：top-3 命中率低但 top-10 高。加一层重排模型把正确条目前置，比换更大的 embedding 模型更划算。"}},{"d":26,"t":"串成 RAG pipeline：检索 → 增强 → 生成","min":100,"steps":["把切分、嵌入、入库、检索、拼提示词、生成串成一条命令","提示词里明确：\"只依据以下资料回答，资料中没有就说不知道\"","让模型在答案里标注引用来源编号","测 5 个问题：3 个资料里有、2 个资料里没有","观察：资料里没有的问题，模型是否老实说不知道"],"concept":{"t":"\"不知道\"是特性，不是缺陷","b":"RAG 最大的价值不是答对，而是让模型在被问到盲区时承认不知道，而不是编一个像模像样的答案。这条\"拒绝回答\"的能力，在企业场景里比准确率更值钱——它决定了用户敢不敢信。"},"code":{"t":"week4/day26_rag.py（核心片段）","src":"def answer(q, k=3):\n    hits = collection.similarity_search(q, k=k)\n    context = \"\\n\\n\".join(\"[%d] %s（来源：%s）\" % (i + 1, h.text, h.meta[\"source\"])\n                           for i, h in enumerate(hits))\n    prompt = f\"\"\"只依据以下资料回答。资料中没有答案时，直接说\"资料中没有相关信息\"。\n答案中引用来源编号，如 [1]。\n\n资料：\n{context}\n\n问题：{q}\"\"\"\n    return llm(prompt, temperature=0), hits"},"quiz":{"q":"模型仍然编造了答案，怎么排查？","a":"按顺序查：① 召回了什么（打印 top-k，正确段落是否在内）；② 不在 → 切分或嵌入问题；③ 在但还是编 → 提示词约束不够，加强指令 + 要求引用编号 + 降 temperature。先定位是\"检索错\"还是\"生成错\"，二者解法完全不同。"}},{"d":27,"t":"召回质量评估：hit rate 与 MRR","min":90,"steps":["造 20 条评估样本：问题 + 标准答案所在 chunk 编号","写脚本算 Hit@3（正确段落是否在前 3）与 MRR（正确段落排第几）","换三种切分策略，对比指标","把结果写成一张表，放进 notes/","找出得分最差的 5 条，人工分析原因"],"concept":{"t":"没有评估的 RAG 是在算命","b":"RAG 的质量由最弱一环决定。hit rate 看\"找没找到\"，MRR 看\"排得够不够前\"。不要凭感觉说\"效果还行\"——20 条样本 + 两个指标，就能让优化有方向，这也是面试时能拿出手的量化证据。"},"code":{"t":"week4/day27_eval.py","src":"def hit_rate(gold, ranked, k=3):\n    return sum(1 for g, r in zip(gold, ranked) if g in r[:k]) / len(gold)\n\ndef mrr(gold, ranked):\n    s = 0\n    for g, r in zip(gold, ranked):\n        if g in r:\n            s += 1 / (r.index(g) + 1)\n    return s / len(gold)\n\n# 用法：gold = 正确 chunk id 列表；ranked = 每次召回的 id 列表\nprint(\"Hit@3:\", round(hit_rate(gold, ranked, 3), 3))\nprint(\"MRR:  \", round(mrr(gold, ranked), 3))"},"quiz":{"q":"评估集要多少条才够？","a":"起步 20–30 条足够暴露问题，W7 会扩到 30 条以上的 golden set。关键是覆盖真实分布：高频问题、边界问题、以及\"资料里没有\"的问题各占一部分。只测容易的，等于没测。"}},{"d":28,"t":"周末大块：FastAPI 暴露原型 + 阶段验收","min":150,"steps":["用 FastAPI 包一层：POST /ask 接收问题，返回答案 + 引用来源","加 GET /health 健康检查","用 uvicorn 起服务，curl 测通","访问 /docs 看自动生成的接口文档","notes/week4.md 复盘：RAG 三环节里最弱的是哪个"],"concept":{"t":"能跑在终端里是脚本，能被 HTTP 调用才是服务","b":"FastAPI 顺手给你的还有 OpenAPI 文档和类型校验——这两样在对接前端、对接客户系统时能省掉大量沟通成本。FDE 交付的最小形态往往就是一个能被 curl 通的接口。"},"deliver":"验收：本地知识库问答原型（CLI + HTTP）+ 召回评估表 + notes/week4.md"}]},{"w":5,"range":"D29–D35","theme":"多 Agent 编排 ①：分解 · 委派 · 通讯","color":"#2bb3b5","series":"对齐系列 Round 5（Day 31–37 区间）","foundation":"工程地基：HTTP 客户端 / 超时 / 限流","deliver":"2–3 个子 Agent 协作系统（检索 → 起草 → 校对）+ 一页架构说明","days":[{"d":29,"t":"为什么需要多 Agent：分工、解耦、专业化","min":80,"steps":["列出单 Agent 的三个瓶颈：上下文污染、提示词互相打架、无法并行","理解三种拆分动机：按专长拆、按上下文隔离拆、按并行度拆","反面：列出\"不该拆\"的三种情况","判断你的主线项目该不该拆、拆成几个","写下拆分方案与理由（300 字）"],"concept":{"t":"拆分的判断标准","b":"任务多步 + 步骤间能并行 + 需要不同专长 → 拆。单步任务、顺序很 trivial、实时性要求极高 → 别拆。多 Agent 不是越高级越好，它带来调度开销和调试难度，FDE 要能说出\"这里我故意没拆\"的理由。"},"quiz":{"q":"多 Agent 比单 Agent 更容易出什么问题？","a":"① 上下文碎片化，出错难追溯；② 调度开销让延迟上升；③ Agent 间互相等待造成死锁；④ 错误在传递中被放大。所以必须有 trace（每个 Agent 的输入输出都留痕），否则线上问题无从查起。"}},{"d":30,"t":"每个 Agent 的记忆与状态归谁管","min":80,"steps":["设计状态：全局 state（任务进度）vs 局部 state（单个 Agent 的草稿）","明确哪些字段共享、哪些隔离","实现一个共享黑板（blackboard）存放中间产物","测试：一个 Agent 出错，其他 Agent 的状态是否还干净","写一段注释说明你的状态划分理由"],"concept":{"t":"状态设计决定可调试性","b":"所有 Agent 读写同一个大字典，短期很快，长期一定乱——改一处影响全局，出 bug 找不到是谁写的。清晰的读写边界（谁能写哪个字段）是多 Agent 系统能长期维护的前提。"},"quiz":{"q":"黑板模式 vs 消息传递，怎么选？","a":"协作密集、产物需要被多方引用（如报告草稿被润色和配图同时用）→ 黑板；流程清晰、上下游明确（流水线）→ 消息传递。也可以混用：流水线 + 共享产物存储。"}},{"d":31,"t":"Decomposer：把一个目标拆成 DAG 任务图","min":90,"steps":["定义 Task 结构：id / name / worker / deps / parallel","实现离线版 decompose()（写死一个例子，零成本秒跑）","再实现 --live 版：让模型输出 JSON 任务图","校验依赖合法性（所有 deps 指向已存在的 id，且无环）","打印任务图，标出哪些可并行"],"concept":{"t":"分解器 = 项目经理","b":"它把一句人话变成一张能派活的工单图：子任务列表 + 依赖边 + 并行标注。粒度要卡在\"一个专长角色能独立干完\"和\"不碎到没意义\"之间——拆太粗退化成单 Agent，拆太细调度开销爆炸。"},"code":{"t":"week5/day31_decomposer.py（核心片段）","src":"from dataclasses import dataclass\n\n@dataclass\nclass Task:\n    id: str\n    name: str\n    worker: str\n    deps: list\n    parallel: bool = False\n\ndef decompose_offline(goal):\n    return [\n        Task(\"t1\", \"检索相关资料\", \"retriever\", [], parallel=True),\n        Task(\"t2\", \"起草初稿\",     \"writer\",    [], parallel=True),\n        Task(\"t3\", \"润色与结构调整\", \"editor\",   [\"t2\"]),\n        Task(\"t4\", \"生成配图\",     \"designer\",  [\"t1\"]),\n        Task(\"t5\", \"汇总定稿\",     \"orchestrator\", [\"t3\", \"t4\"]),\n    ]\n\ndef validate(tasks):\n    ids = {t.id for t in tasks}\n    assert all(d in ids for t in tasks for d in t.deps), \"依赖指向不存在的任务\"\n    # 拓扑排序能跑通 = 无环\n    done, order = set(), []\n    while len(order) < len(tasks):\n        nxt = [t for t in tasks if t.id not in done and set(t.deps) <= done]\n        assert nxt, \"存在循环依赖\"\n        done.update(t.id for t in nxt); order += nxt\n    return order"},"quiz":{"q":"分解器最大的风险是什么？怎么防？","a":"无限递归分解（把子任务再拆、再拆）。防法二选一或都要：设最大分解深度、定义\"原子任务\"判定条件（如\"单步可完成的动词短语\"）。同时给分解本身也设超时。"}},{"d":32,"t":"子 Agent 委派：按图派活，收不回来怎么办","min":90,"steps":["实现编排者：按拓扑序派发，能并行的并发跑","给每个子任务加超时，超时记为失败","失败任务：重试一次 → 仍失败则降级（用更简单的方式）或上报","实现结果收集与汇总","测一个失败场景：故意让某个 worker 抛异常，看系统是否崩"],"concept":{"t":"委派的核心是\"收得回来\"","b":"派活容易，难的是子任务失败、超时、返回垃圾时编排者怎么办。三种策略：重试（瞬时故障）、降级（能力不足）、上报（需要人判断）。一个没有失败处理的编排者，比不用编排更危险。"},"quiz":{"q":"子任务超时了，重试还是跳过？","a":"看是否幂等。只读检索 → 可安全重试；会写外部系统 → 重试前必须确认幂等（用幂等键或先查状态）。判断不了就跳过并标记，交给人工——宁可少做，不要重复做。"}},{"d":33,"t":"多 Agent 通讯：它们之间怎么传话","min":80,"steps":["实现消息结构：from / to / type（request|result|error）/ payload","加 correlation_id 串联同一次任务的所有消息","把所有消息落盘，形成一次任务的完整 trace","回放一次任务：只看 trace 就能还原全过程","思考：trace 里哪些字段是合规必须的"],"concept":{"t":"trace 是 Agent 系统的黑匣子","b":"飞机必须有黑匣子，Agent 也必须有。一次任务的所有输入输出、工具调用、耗时、成本全部留痕，才能做到：事后复盘、问题定位、合规审计、成本归因。这是 FDE 交付物里\"可运维\"的那一部分。"},"quiz":{"q":"trace 里必须记录但最容易被漏掉的是什么？","a":"成本与身份。每条 trace 记录 token 消耗和费用（才能归因到客户/功能），以及\"这次调用是谁发起的、用的是谁的凭证\"（合规审计必问）。只记输入输出，出事时你仍然回答不了关键问题。"}},{"d":34,"t":"工程地基⑤ HTTP 客户端：超时 / 重试 / 限流","min":80,"steps":["用 httpx 或 requests 封装一个客户端：连接超时 + 读超时分开设置","统一处理 4xx（不重试）与 5xx（可重试）","实现简单令牌桶限流，控制对外部 API 的 QPS","为所有外部调用加上 trace 日志（URL、耗时、状态码）","测：故意请求一个慢接口，确认超时真的生效"],"concept":{"t":"不设超时的调用是定时炸弹","b":"默认不设超时 = 一个下游卡死会拖垮你整个服务。连接超时（建立连接）和读超时（等待响应）要分开设，通常 3s / 30s 起步。FDE 接客户系统时，对方接口往往又慢又不稳——这层防护是你的保命符。"},"code":{"t":"common/httpclient.py（核心片段）","src":"import httpx, logging, time\nlog = logging.getLogger(__name__)\n\nclass Client:\n    def __init__(self, rps=5):\n        self.cli = httpx.Client(timeout=httpx.Timeout(connect=3.0, read=30.0))\n        self.min_interval = 1 / rps\n        self._last = 0.0\n\n    def _throttle(self):\n        gap = time.time() - self._last\n        if gap < self.min_interval:\n            time.sleep(self.min_interval - gap)\n        self._last = time.time()\n\n    def get_json(self, url, **kw):\n        self._throttle()\n        t0 = time.time()\n        r = self.cli.get(url, **kw)\n        log.info(\"HTTP %s %s %.0fms\", r.status_code, url, (time.time() - t0) * 1000)\n        if r.status_code >= 500:\n            raise RetryableError(r.status_code)\n        r.raise_for_status()\n        return r.json()"},"quiz":{"q":"4xx 和 5xx 的重试策略为什么不同？","a":"4xx 是客户端错误（参数错、没权限、资源不存在），重试一万次也是同样结果，只会浪费配额；5xx 是服务端暂时故障，重试有意义。把 429（限流）单独处理，按 Retry-After 头等待。"}},{"d":35,"t":"周末大块：三 Agent 协作系统 + 一页架构说明","min":170,"steps":["实现 retriever / writer / editor 三个子 Agent","用 D31 的分解器产出任务图，D32 的编排者执行","接入 D33 的 trace 落盘","跑通\"给定一个主题 → 产出一份带引用的调研草稿\"","画一张架构图（手画或 draw.io），写成 docs/architecture.md 一页","notes/week5.md 复盘：多 Agent 相比单 Agent 真的更好吗，证据是什么"],"concept":{"t":"架构一页纸该写什么","b":"谁调用谁、数据存在哪、失败怎么兜底、成本花在哪、什么没做。不要写技术名词堆砌，要写\"如果它挂了你会先看哪里\"。这张纸会在 W11 变成作品集里的脱敏架构图。"},"deliver":"验收：三 Agent 协作系统跑通 + docs/architecture.md 一页 + notes/week5.md"}]},{"w":6,"range":"D36–D42","theme":"三道保护 + 主线场景启动","color":"#1fa8ab","series":"系列 Round 5 收尾 + FDE 交付方法介入","foundation":"工程地基：合成数据生成脚本","deliver":"带 guardrail 的 Agent + 主线场景一页交付说明（目标/范围/权限/异常/指标）","days":[{"d":36,"t":"三道保护① 超时与重试","min":80,"steps":["给每个 LLM 调用加超时，超时后 1 次重试","重试失败走降级路径：返回保守结果 + 标记需人工","统计一天内的重试率，作为质量信号","把\"超时/重试/降级\"三个动作都写进日志","思考：重试会不会造成重复扣款/重复发消息"],"concept":{"t":"重试的阴暗面","b":"重试对只读操作无害，对写操作可能是灾难（重复下单、重复发消息、重复退款）。写操作必须幂等：带幂等键、或执行前先查状态。这是 Agent 接入业务系统时最容易出事故的地方。"},"quiz":{"q":"怎么让一个\"发消息\"的动作幂等？","a":"给每次业务请求生成唯一 idempotency_key（如 任务id + 动作类型 + 内容哈希），服务端先查该 key 是否已执行过，执行过就直接返回上次结果。或者在发送前查询该任务是否已有发送记录。"}},{"d":37,"t":"三道保护② 人工复核节点","min":80,"steps":["在写回业务系统前插入 interrupt 人工确认","设计确认界面要展示什么：原工单、AI 结论、置信度、依据来源","实现\"同意 / 修改 / 拒绝\"三种结果，拒绝要填原因","把所有人工修改记录存下来（这是黄金数据）","统计人工修改率——它就是你的核心指标之一"],"concept":{"t":"人工修改率是最重要的一个数字","b":"它同时衡量模型质量和产品体验：改得多说明模型不行，或者界面让人不放心。而且每一次人工修改都是一条免费的标注数据——W7 的 golden set 可以直接从这里采样。"},"quiz":{"q":"客户说\"能不能全自动不要人确认\"，你怎么办？","a":"先问：哪类错误是他们绝对不能接受的（金额、合规、对外承诺）。用历史数据给出该类错误的发生率，再谈\"低风险类别自动放行 + 高风险类别人工确认\"的分级方案。全自动化是目标，不是第一步——这是 FDE 典型的期望管理场景。"}},{"d":38,"t":"三道保护③ 失败回退与降级","min":80,"steps":["列出三种降级：模型降级（换便宜模型）、功能降级（只给分类不给草稿）、人工降级（全部转人工）","实现一个降级开关：配置里改一行就能切换","写一个\"熔断\"：连续 N 次失败后暂停调用 X 分钟","人为制造故障（断网/改错 key），验证系统不会崩","把\"系统挂了用户看到什么\"写清楚"],"concept":{"t":"降级是设计出来的，不是碰运气","b":"客户能接受\"功能变弱\"，不能接受\"页面转圈然后报错\"。提前设计好每一层的兜底，出事时你只需切开关。FDE 的可靠性不在模型多聪明，在出问题时系统有多体面。"},"quiz":{"q":"熔断和重试会打架吗？","a":"会。重试在放大请求量，熔断在切断请求量，两者必须串联协调：先重试（有限次）→ 仍失败计入熔断计数器 → 达到阈值熔断 → 半开状态试探恢复。只重试不熔断，会把下游彻底打垮。"}},{"d":39,"t":"FDE ① 需求访谈提纲：不问\"你想要什么 AI\"","min":70,"steps":["写访谈提纲：围绕 5 件事——输入从哪来 / 现在什么步骤 / 谁有决定权 / 最怕什么错 / 怎么算验收","设计 10 个问题，全部是\"演示最近一次你怎么做的\"而不是\"你想要什么功能\"","准备追问清单：哪些绝不能自动处理？金额超过多少必须升级？发送前谁确认？","找 1 个朋友做一次 30 分钟模拟访谈，录音或记笔记","把访谈结果整理成一页纪要"],"concept":{"t":"让对方演示，不要让他提需求","b":"问\"你想要什么 AI 功能\"，得到的是科幻；让对方演示最近一次真实任务，得到的是可交付的需求。FDE 的核心技能之一，就是把模糊的愿望翻译成具体的输入输出与边界条件。"},"code":{"t":"docs/interview_guide.md（提纲骨架）","src":"## 一、还原现状（请对方演示最近一次真实操作）\n1. 这件事上一次做是什么时候？能演示一遍吗？\n2. 数据/材料从哪里来？什么格式？谁给你的？\n3. 中间要查几个系统？哪一步最花时间？\n4. 做完的结果交给谁？对方怎么验收？\n\n## 二、边界与风险（最重要）\n5. 哪一类情况你绝对不敢让它自动处理？\n6. 涉及金额/对外承诺时，超过多少必须人工？\n7. 出错了谁负责？怎么发现出错了？\n\n## 三、验收与指标\n8. 现在平均一条要多久？你希望变成多久？\n9. 错误率多少你能接受？1%？5%？\n10. 如果做得好，你愿意每周用几次？团队还有谁会用？\n\n## 追问模板\n- \"你说希望自动回复——那这几种投诉呢？\"（举 3 个极端案例）\n- \"如果 AI 不确定，你希望它怎么做？\"（要的不是答案，是兜底策略）"},"quiz":{"q":"访谈时对方说\"越快越好\"，你怎么往下问？","a":"把模糊词换成数字：\"现在一条平均几分钟？\"\"如果只能缩短一半，你最希望省掉哪一步？\"\"慢的时候主要卡在哪——是等数据、还是查政策、还是打字？\" 得到具体数字和具体卡点，才能定义指标。"}},{"d":40,"t":"选定主线场景 + 写一页交付说明","min":80,"steps":["确认主线：客服工单分类与回复助手（合成数据 + 模拟用户）","写一页交付说明：目标 / 范围 / 权限 / 异常 / 指标","目标要可量化：分类耗时从 3 分钟降到 30 秒","范围要写清不做什么：不处理退款审批、不自动发送","指标定义 4 个：使用次数 / 处理时长 / 人工修改率 / 放弃位置"],"concept":{"t":"一页交付说明 > 二十页产品方案","b":"它把\"AI 项目\"变成\"可以验收的合同\"：目标可量化、范围有边界、权限说清楚、异常有兜底、指标能采集。FDE 现场最缺的就是这张纸——有了它，范围蔓延和需求扯皮都会大幅减少。"},"deliver":"验收物：docs/delivery-spec.md（一页交付说明）","quiz":{"q":"为什么要明确写\"不做什么\"？","a":"因为 AI 项目的失败大多不是做不出功能，而是范围无限膨胀：客户用着用着就觉得\"既然能分类，是不是也能自动退款\"。提前写清边界，是保护项目也是保护你自己的交付节奏。"}},{"d":41,"t":"工程地基⑥ 合成数据脚本","min":80,"steps":["写 data/generate_synthetic.py：造 tickets(500) / policies(40) / faq(200)","工单用模板拼接 + 随机扰动：错别字、口语、多问题混合","标注字段：category / priority / need_human_review（用于 eval）","故意造 10% 的\"难样本\"：模糊表述、跨类别、含敏感信息","生成后人工抽查 20 条，确认像真数据"],"concept":{"t":"合成数据的价值与陷阱","b":"价值：无真实数据也能跑通全链路、能造极端样本、可公开分享。陷阱：分布太干净会让你的 eval 虚高——真实工单有错别字、情绪化、信息不全。所以必须主动加噪声，否则上线即翻车。"},"code":{"t":"data/generate_synthetic.py（核心片段）","src":"import random, json, hashlib\n\nTEMPLATES = {\n    \"退款问题\": [\"我买的{item}想退款，{reason}\", \"{item}不想要了能退吗？{reason}\"],\n    \"物流问题\": [\"{item}发货了吗，都{x}天了\", \"物流一直不动，单号{order}\"],\n    \"质量问题\": [\"{item}用了两天就{damage}\", \"收到就是坏的，{damage}\"],\n}\nNOISE = [\"\", \"？？？\", \"急急急\", \"客服在吗\", \"（图片）\", \"  \", \"已投诉\"]\n\ndef make(n=500):\n    rows, rnd = [], random.Random(42)\n    for i in range(n):\n        cat = rnd.choice(list(TEMPLATES))\n        text = rnd.choice(TEMPLATES[cat]).format(\n            item=rnd.choice([\"耳机\", \"水杯\", \"充电宝\", \"衬衫\"]),\n            reason=rnd.choice([\"不合适\", \"买错了\", \"和描述不一样\"]),\n            damage=rnd.choice([\"坏了\", \"掉色\", \"有划痕\"]),\n            order=str(rnd.randint(10**9, 10**10)), x=rnd.randint(3, 15))\n        if rnd.random() < 0.3:                      # 主动加噪声\n            text += rnd.choice(NOISE)\n        rows.append({\"id\": i + 1, \"text\": text, \"category\": cat,\n                     \"priority\": rnd.choice([\"high\", \"medium\", \"low\"]),\n                     \"noise\": True})\n    return rows"},"quiz":{"q":"合成数据能写进简历/案例吗？","a":"能，但必须诚实标注\"合成数据 + 模拟用户\"，并说明为什么这么做（无真实数据权限）。绝对不能暗示是真实客户数据——背景调查一问就穿帮。诚实标注反而加分：说明你有合规意识。"}},{"d":42,"t":"周末大块：主线项目骨架 v0.1","min":170,"steps":["搭骨架：工单进 → 规则过滤敏感 → 结构化分类 → RAG 查政策 → 草稿 → 人工确认 → 写回 SQLite → 操作日志","先用规则跑通（不接模型），确保流程本身是通的","再接上模型分类","实现操作日志表：谁、什么时候、做了什么、AI 给了什么、人改成什么","跑 20 条工单，看整条链路是否顺畅","notes/week6.md 复盘"],"concept":{"t":"先用规则跑通，再接模型","b":"这是 FDE 最重要的工程习惯之一。先用确定性代码把流程跑通（哪怕分类是关键词匹配），你就拥有了一个可测的系统；再逐个环节替换成模型，任何回退都能定位到具体环节。反过来做，出了问题你分不清是流程错还是模型错。"},"deliver":"验收：主线项目 v0.1 端到端跑通 20 条工单 + 操作日志表 + notes/week6.md"}]},{"w":7,"range":"D43–D49","theme":"Eval 与可观测：让质量可被证明","color":"#a855f7","series":"系列 W7：Eval 与可观测","foundation":"工程地基：pytest fixture / 参数化","deliver":"eval 套件（≥30 条 golden set + 回归测试）+ 成本/延迟统计表","days":[{"d":43,"t":"为什么 eval 是 FDE 的核心竞争力","min":70,"steps":["理解：教程教你做 Demo，企业付钱买的是\"稳定不出错\"","列出你的 Agent 可能变差的 5 个原因（换模型、改提示词、数据漂移…）","理解回归测试：改动后自动跑一遍，指标掉了吗","写下你的 3 个核心指标及目标值","思考：如果明天模型供应商涨价，你怎么决定换不换"],"concept":{"t":"没有 eval 就没有迭代","b":"改动提示词后，你如何知道变好了还是变差了？靠感觉？eval 就是你的体检报告：改动前后跑同一批样本，指标说话。这也是 FDE 面试的高频考点——\"你怎么证明你的 Agent 是好的\"。"},"quiz":{"q":"客户问\"你的准确率多少\"，你怎么答？","a":"先问\"哪一类、在什么数据上\"。给出分类型准确率 + 样本构成 + 失败案例。只报一个总数（如\"92%\"）会显得不专业；能说清\"退款类 96%，但跨类别工单只有 71%，已转人工\"才是交付级回答。"}},{"d":44,"t":"造 golden set：30 条能定生死的数据","min":90,"steps":["从合成数据里挑 30 条，覆盖：高频 15 / 边界 10 / 陷阱 5","每条标注：输入、期望分类、期望是否转人工、期望关键依据","含 5 条\"应该拒绝/转人工\"的样本（测拒绝能力）","写成 YAML 或 JSON，纳入版本管理","人工复核一遍标注，确保自己能答对"],"concept":{"t":"golden set 的质量 > 数量","b":"30 条精心设计的样本，比 3000 条随便抓的更有用。关键是覆盖分布：高频场景决定日常体验，边界场景决定会不会出事，陷阱场景决定会不会被骗。三类缺一，eval 就是自我安慰。"},"quiz":{"q":"为什么一定要有\"应该转人工\"的样本？","a":"因为\"知道什么时候不做\"和\"做对\"同样重要。只测答对的样本，会激励你把系统调得更激进（什么都敢自动处理），上线后最容易出事的就是那些本该拒绝却自动处理了的case。"}},{"d":45,"t":"指标设计：准确率之外还有什么","min":80,"steps":["实现 4 个指标：分类准确率、格式合规率、转人工准确率、平均耗时","加成本指标：每条工单多少钱","加安全指标：敏感信息是否被拦截","写一个 evaluate() 一次跑完所有指标并输出表格","跑第一次基线，保存为 baseline.json"],"concept":{"t":"指标要分层","b":"任务指标（准不准）、系统指标（快不快、多少钱）、安全指标（会不会出事）。三层都要有——只盯准确率，你会得到一个又慢又贵还偶尔泄露信息的系统。"},"code":{"t":"week7/day45_metrics.py","src":"def evaluate(cases, predict):\n    n = len(cases)\n    acc = sum(p[\"category\"] == c[\"expect\"] for c, p in zip(cases, predict)) / n\n    fmt = sum(is_valid_schema(p) for p in predict) / n          # 格式合规率\n    esc = sum(p.get(\"need_human_review\") == c[\"expect_review\"]\n              for c, p in zip(cases, predict)) / n              # 转人工准确率\n    cost = sum(p.get(\"cost\", 0) for p in predict) / n\n    return {\"accuracy\": round(acc, 3), \"format_ok\": round(fmt, 3),\n            \"escalation_acc\": round(esc, 3), \"cost_per_case\": round(cost, 5)}\n\n# 陷阱：naive LLM-as-Judge 在多轮 / 长 trace 上会漂\n# 对策：judge 只看单个环节、给明确 rubric、用 1-5 分制而非对错"},"quiz":{"q":"格式合规率为什么值得单独列？","a":"因为格式崩了下游直接崩。准确率 95% 但格式合规率 90%，意味着每 10 条就有 1 条让程序抛异常。这两个指标的修复方式完全不同（前者调提示词/模型，后者加解析兜底与 schema 约束）。"}},{"d":46,"t":"LLM-as-Judge：让模型给模型打分","min":90,"steps":["写评分提示词：明确的 rubric（1-5 分，每分对应什么）","对\"回复草稿\"这类无标准答案的输出做评分","验证：让 judge 对同一条打 3 次，看一致性","对比：judge 分数与人工打分的相关性（抽 10 条自己打分）","记录 judge 的失败模式（如偏爱长答案）"],"concept":{"t":"Judge 不是裁判，是带偏见的评委","b":"已知偏差：偏爱长答案、偏爱先出现的选项、对同模型生成的内容打分偏高。缓解：给明确 rubric + 打乱选项顺序 + 多judge取平均 + 定期用人工标注校准。面试时说出这些偏差，比说出\"我用了 LLM-as-Judge\"值钱得多。"},"quiz":{"q":"judge 用同一个模型打分有什么问题？怎么缓解？","a":"自恋偏差——模型倾向给自己风格的输出高分。缓解：① 用更强的模型做 judge；② 打乱候选顺序；③ 与人工标注做相关性校验（抽 20-30 条）；④ 关键决策不用 judge，用规则 + 人工。"}},{"d":47,"t":"回归测试：改一行提示词也不怕","min":80,"steps":["把 evaluate() 接进 pytest：pytest tests/test_eval.py","设定阈值：accuracy 低于 baseline - 3% 就失败","改一次提示词，跑测试，看是否捕获到变化","把 baseline.json 纳入 Git，改动可追溯","可选：加一个简单的 CI（GitHub Actions）自动跑"],"concept":{"t":"回归测试把\"感觉\"变成\"门禁\"","b":"有了阈值门禁，任何让指标下滑的改动都会在提交时被拦下。这是从\"能跑的项目\"到\"能维护的系统\"的关键一步，也是作品集里最能体现工程素养的部分。"},"quiz":{"q":"阈值设多少合适？","a":"基于波动幅度：先跑 3 次基线看自然波动（如 ±2%），阈值设为波动的 1.5 倍（如 3%）。设太紧会频繁误报、大家就忽略测试；设太松等于没有。同时区分\"warn\"和\"fail\"两级。"}},{"d":48,"t":"Trace 与成本监控：每条请求花多少、卡在哪","min":80,"steps":["给每次调用记录：trace_id、耗时、token、成本、模型、是否重试","实现按天/按功能聚合的成本报表","找出成本最高的 3 个环节，各提一个优化方案","实现一个简单的成本上限：超过 X 元自动降级","把成本表放进 notes/，作为案例素材"],"concept":{"t":"成本是功能的一部分","b":"一个每条工单花 2 块钱的 Agent，在日均 200 条的场景下一年就是十几万。FDE 必须能回答\"这个东西跑起来多少钱\"——答不上来的方案，客户签字后也会反悔。"},"quiz":{"q":"成本太高，第一刀砍哪里？","a":"按顺序：① 换便宜模型处理简单环节（分类用小的，写作用大的）；② 缩短上下文（更好的切分、只传必要历史）；③ 缓存（相同问题/相同 embedding）；④ 减少步数（优化提示词降低重试率）。先量出来再砍，别凭直觉。"}},{"d":49,"t":"周末大块：eval 套件成型 + 阶段复盘","min":160,"steps":["把 D44-D48 整合成一个命令：python -m eval.run","输出一张完整的指标表（含成本）","跑三次取平均，写入 docs/eval-baseline.md","notes/week7.md 复盘：你的系统最弱的一环是什么","把最弱一环作为 W8 可靠性工程的重点"],"concept":{"t":"eval 是写给未来的自己看的","b":"三个月后你会忘记当时的取舍。一份带日期、带指标、带失败案例的 eval 报告，能让你和别人快速理解这个系统的真实水平——这也是 W11 案例里最有说服力的那一页。"},"deliver":"验收：eval 套件一键跑通 + docs/eval-baseline.md + notes/week7.md"}]},{"w":8,"range":"D50–D56","theme":"可靠性工程 + Docker 化（阶段项目）","color":"#7c4dff","series":"系列 W8：可靠性工程 · 阶段项目","foundation":"工程地基：Dockerfile / docker compose","deliver":"主线项目 v1：docker compose up 一键起（RAG + Agent + eval + 日志）","days":[{"d":50,"t":"失败模式清单：先把所有可能挂的地方列出来","min":80,"steps":["画一条链路，每个环节问\"这里挂了会怎样\"","对每个失败点填：概率 / 影响 / 现有防护 / 还缺什么","重点标注：会造成不可逆后果的（重复写回、误发消息）","挑出 Top 3 高风险项，本周解决","写成 docs/failure-modes.md"],"concept":{"t":"FMEA 简化版","b":"不要做复杂表格，一张四列清单就够：会怎么挂 / 多严重 / 现在有没有防护 / 谁来发现。FDE 的价值很大程度体现在\"别人没想到的失败模式你想到了\"。"},"quiz":{"q":"最容易被忽略的失败模式是什么？","a":"静默失败——不报错但结果是错的。比如模型返回了格式正确但内容荒谬的分类，系统照单全收。防护：置信度阈值 + 抽样人工复核 + 异常分布监控（某类占比突变就报警）。"}},{"d":51,"t":"幂等与去重：同样的请求别做两遍","min":80,"steps":["给写操作加幂等键（工单id + 动作类型）","执行前查状态：已处理则直接返回上次结果","实现一个去重表，记录已处理的 id","测试：连续调用两次，确认只写回一次","把这个机制写进架构图"],"concept":{"t":"重试 + 无幂等 = 事故","b":"只要系统里有重试，就必须有幂等。这是分布式系统的铁律，在 Agent 场景更容易被忽略——因为你会觉得\"模型应该只会调一次\"。上线前的检查清单里，这一条必须打勾。"},"quiz":{"q":"幂等键怎么设计？","a":"业务唯一标识 + 动作类型，如 (ticket_id, \"write_back\")。不要用时间戳或随机数（每次不同就失去意义）。服务端存已执行键与结果，重复请求命中即返回，需设置合理过期时间。"}},{"d":52,"t":"限流与并发：别把下游打挂","min":80,"steps":["给 LLM 调用加并发上限（信号量），避免瞬时打满配额","给外部 API 加 QPS 限制（复用 D34 的令牌桶）","处理 429：读 Retry-After，指数退避","压测：一次丢 50 条工单进去，看会不会崩","记录并发下的平均耗时与失败率"],"concept":{"t":"并发是延迟的解药，也是事故的毒药","b":"并行能大幅缩短总耗时，但会把下游 QPS 和成本瞬间拉高。正确做法：有上限的并发 + 退避 + 熔断。FDE 常要在\"客户要快\"和\"系统要稳\"之间找平衡点。"},"quiz":{"q":"客户要求 500 条工单 5 分钟内处理完，怎么做？","a":"先算：单条平均耗时 × 500 / 并发数 ≤ 300s，反推需要的并发与 QPS。再确认 API 配额是否够、成本多少。达不到就谈分批或放宽时限——用数据谈判，而不是硬着头皮承诺。"}},{"d":53,"t":"配置化：所有魔法数字都要能改","min":70,"steps":["把所有阈值、模型名、并发数、超时抽到 config.yaml","实现配置校验：启动时检查必填项，缺了就报清晰错误","区分环境：dev / prod 两套配置","敏感值只从环境变量读，不进配置文件","README 补上配置项说明表"],"concept":{"t":"配置化 = 现场可调试","b":"FDE 在客户现场最常做的事是\"调一下试试\"。阈值写死在代码里，每次调整都要改代码重启服务；配置化后，改一行重启即生效，客户也更容易接受\"我们先保守一点\"。"},"quiz":{"q":"哪些值绝对不能写进配置文件？","a":"密钥、Token、密码、Webhook URL、客户标识。这些只能走环境变量或密钥管理服务，且必须进 .gitignore。配置文件可以提交，密钥不行——这是最基础的红线。"}},{"d":54,"t":"工程地基⑦ Dockerfile：把环境打包","min":90,"steps":["写 Dockerfile：基于 python:3.11-slim，分层装依赖",".dockerignore 排除 .venv / data / logs / .env","构建镜像并本地跑起来，确认行为一致","优化：依赖层缓存、镜像体积（目标 < 500MB）","注意：不要把 .env 打进镜像"],"concept":{"t":"镜像解决的是\"在我机器上能跑\"","b":"FDE 交付经常要部署到客户机器或陌生服务器。Docker 把 Python 版本、系统库、依赖全部固化，消除环境差异。代价是要理解分层缓存和镜像体积——这两点做不好会导致构建巨慢。"},"code":{"t":"Dockerfile","src":"FROM python:3.11-slim\nWORKDIR /app\nENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1\n\nCOPY requirements.txt .              # 先复制依赖，利用缓存\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY . .                             # 代码后复制，改动不触发重装依赖\n# 注意：.dockerignore 必须排除 .env / data / logs\n\nEXPOSE 8000\nCMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]"},"quiz":{"q":"为什么 requirements.txt 要单独先 COPY？","a":"Docker 按层缓存，依赖装好后只要 requirements.txt 不变，改代码就不会重装依赖，构建从几分钟缩到几秒。这是 Dockerfile 最实用的一条优化，也是区分\"会写\"和\"会用\"的标志。"}},{"d":55,"t":"docker compose：一键起全家桶","min":90,"steps":["写 docker-compose.yml：app + 可选的数据库/向量库","挂载卷：data/ 与 logs/ 持久化","配置环境变量注入（env_file: .env）","加健康检查 healthcheck","跑 docker compose up -d，curl 验证"],"concept":{"t":"一条命令启动 = 交付门槛","b":"评价者/客户/面试官要验证你的项目，第一步就是\"怎么跑起来\"。docker compose up 一条命令能起来，和需要装 8 个依赖配 3 个环境变量才能跑，是天壤之别的第一印象。"},"code":{"t":"docker-compose.yml","src":"services:\n  app:\n    build: .\n    ports: [\"8000:8000\"]\n    env_file: .env                    # 密钥走环境变量，不进镜像\n    volumes:\n      - ./data:/app/data\n      - ./logs:/app/logs\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8000/health\"]\n      interval: 30s\n      timeout: 5s\n      retries: 3\n    restart: unless-stopped"},"quiz":{"q":"restart: unless-stopped 有什么风险？","a":"如果启动即失败（如配置错误、端口冲突），它会无限重启刷日志，掩盖真实错误。生产上更稳妥的是配合健康检查 + 告警，并给重启次数设上限（如 on-failure:5），让故障暴露出来而不是被自动重启掩盖。"}},{"d":56,"t":"周末大块：阶段项目 v1 验收 + 第二月复盘","min":180,"steps":["完整跑一遍：docker compose up → 导入 500 条工单 → 跑 eval → 看日志","补 README：架构图、启动命令、指标基线、已知限制","录一段 3 分钟演示（先不剪，W11 会用）","notes/week8.md 复盘：第二月最大的认知变化","把项目推到 GitHub，README 写成能被陌生人看懂"],"concept":{"t":"阶段项目是\"能维护\"的证明","b":"第一月的原型证明\"能做出来\"，第二月的 v1 证明\"能稳定运行\"。面试官看作品集，重点不是功能多炫，而是：能不能一键跑起来、有没有测试、出错怎么办、成本多少。"},"deliver":"验收：主线项目 v1（docker compose 一键起）+ README + eval 基线 + 3 分钟演示粗剪"}]},{"w":9,"range":"D57–D63","theme":"部署 + 前端：让别人用得上","color":"#f0821e","series":"系列 W9：部署 + 前端","foundation":"前端输入校验 / 错误态 / 加载态","deliver":"可访问的 demo（局域网或公网）+ 操作日志表 + 最小权限鉴权","days":[{"d":57,"t":"部署选型：别一上来就上云","min":70,"steps":["列出三种方案：本机 / 局域网 / 云服务器（轻量 2C4G 足够）","对比成本、复杂度、可访问性、合规风险","选定一种（建议：先局域网或内网穿透给 3-5 人用）","配置 HTTPS 与基础防火墙（若上云）","写下选择理由，这就是一个 ADR"],"concept":{"t":"部署方式取决于\"谁要用\"","b":"给 3 个朋友演示：局域网或内网穿透足够，成本 0。给客户长期使用：必须有正式的云环境、备份和监控。FDE 要能按场景选最省事的方案，而不是默认上 K8s。"},"quiz":{"q":"演示环境要不要上 HTTPS 和鉴权？","a":"只要能被公网访问，就必须有。哪怕只是 demo——暴露的界面会被扫描器扫到，未鉴权的管理接口等于把你的 API key 和数据送人。最低限度：一个登录口令 + 不要暴露 /docs 调试接口。"}},{"d":58,"t":"做一个能用的界面：Streamlit 或单页 HTML","min":90,"steps":["用 Streamlit 搭最小界面：粘贴工单 → 看分类/优先级/草稿/依据","或直接写单页 HTML + fetch 调你的 FastAPI","核心三件套：输入框、结果区、确认按钮","确认\"同意/修改/拒绝\"三个按钮都接到了后端","让一个非技术的朋友看一眼，问他每个按钮是什么意思"],"concept":{"t":"界面的目标是让人敢用","b":"不是好看，是\"我知道它要我做什么、我做的会有什么后果\"。AI 界面三要素：能看到依据（为什么这么判）、能改（人比模型懂业务）、能拒绝（有退路）。缺一个，采用率就会掉。"},"quiz":{"q":"为什么一定要展示\"依据来源\"？","a":"没有依据，用户只能全信或全不信。一旦它错一次，信任归零，从此弃用。展示依据后，用户会把它当\"助手\"而不是\"黑箱\"——出错时他会修改而不是放弃。这个细节直接决定人工修改率。"}},{"d":59,"t":"前端三态：加载 / 成功 / 失败都要设计","min":80,"steps":["加载态：流式打字或进度提示，不要只转圈","成功态：结果 + 依据 + 确认按钮","失败态：人话提示 + 重试按钮 + 错误码（便于报障）","空态：没有结果时不要显示空白","超时态：超过 X 秒给出提示而不是一直等"],"concept":{"t":"错误提示是产品的一部分","b":"\"500 Internal Server Error\" 对用户等于\"这玩意儿坏了\"。正确的错误提示说三件事：出了什么问题、是不是你的错、接下来怎么办。FDE 做交付，用户遇到错误时的体验，直接决定他会不会继续用。"},"quiz":{"q":"AI 界面为什么特别需要流式？","a":"因为模型响应普遍 3-15 秒，远超人类耐心阈值（约 1 秒）。流式把\"等待\"变成\"观看\"，主观等待感大幅下降。对客服、审核这类人机协同界面，流式几乎是必备。批处理任务则不必。"}},{"d":60,"t":"用户身份与最小权限","min":80,"steps":["实现最简登录：用户名 + 口令（或一次性邀请码）","区分角色：使用者 / 审核者 / 管理员","最小权限：使用者只能提交与查看自己的工单","所有操作带上\"是谁\"的标识","测试：用使用者账号尝试管理员接口，确认被拒"],"concept":{"t":"最小权限不是安全洁癖，是交付前提","b":"企业客户第一个问的就是\"谁能看到什么、谁能改什么\"。一个没有身份概念的系统，在甲方眼里就是玩具。哪怕只有两个角色，也要做——它体现的是你对生产系统的理解。"},"quiz":{"q":"模拟项目也要做权限吗？","a":"要，而且成本低收益高。面试官打开你的 demo，看到一个\"审核者才能写回\"的设计，和看到一个谁都能改的系统，对你的评价完全不同。权限设计是作品集里性价比最高的一块。"}},{"d":61,"t":"操作日志与审计：谁在什么时候改了什么","min":80,"steps":["设计 audit_log 表：时间 / 用户 / 动作 / 对象 / AI 建议 / 人工最终值 / 原因","每次写回、每次修改、每次拒绝都记一笔","实现按用户和时间筛选的日志页","导出 CSV 用于 W10 分析","思考：如果客户投诉\"系统乱改数据\"，你怎么自证"],"concept":{"t":"审计日志是信任的基础设施","b":"它同时服务三个目的：事故追溯（谁改的）、模型改进（人工修改就是标注）、合规证明（有没有越权）。一个字段都别省——尤其是\"AI 建议 vs 人工最终值\"，这就是你衡量模型价值的核心数据。"},"quiz":{"q":"审计日志要存多久、存什么？","a":"至少覆盖一个业务周期（通常 3-6 个月）。必存：时间戳、操作者身份、动作类型、对象 id、变更前值、变更后值、来源（AI/人工）。不存：完整请求正文（可能含敏感信息，且体积大）——存 hash 或摘要即可。"}},{"d":62,"t":"结果导出与写回：闭环的最后一步","min":80,"steps":["实现导出：CSV / JSON 两种格式","实现\"写回\"：把确认后的结果写回工单表","写回前二次确认 + 幂等校验（用 D51 的机制）","提供撤销：记录变更前值，支持回滚","测试完整闭环：导入 → 处理 → 确认 → 写回 → 导出"],"concept":{"t":"不能写回的系统，价值减半","b":"很多 AI 工具死在最后一步：给了建议，但用户还要手动复制到另一个系统。省下的时间被复制粘贴吃掉，采用率就上不去。\"能写回\"是工具变成流程一部分的分界线。"},"quiz":{"q":"写回失败了怎么办？","a":"三件事：① 不丢失用户的确认结果（先落本地再写回）；② 明确告诉用户写回失败、建议已保存、可稍后重试；③ 记录失败原因并告警。绝不能让用户以为已经成功——静默失败是最伤信任的。"}},{"d":63,"t":"周末大块：demo 上线 + 邀请第一批用户","min":170,"steps":["把 demo 部署到可访问地址，自己用手机访问一遍","写一份 200 字使用说明（给非技术用户看）","邀请 3-5 位朋友，发说明 + 5 个典型任务","确认每个人都能独立完成第一个任务（记下卡点）","notes/week9.md 复盘：onboarding 哪里最卡"],"concept":{"t":"onboarding 卡点 = 真实采用率杀手","b":"用户放弃往往不是因为功能差，而是\"不知道第一步干什么\"。观察 3 个人怎么用，你会发现自己完全没预料到的问题——这些观察是 W10 迭代的输入，也是案例里最真实的素材。"},"deliver":"验收：可访问 demo + 使用说明 + 3-5 位用户已 invite + notes/week9.md"}]},{"w":10,"range":"D64–D70","theme":"模拟用户连用两周 + 数据驱动的迭代","color":"#f59e0b","series":"系列 W10：部署与真实使用（本计划用模拟用户替代）","foundation":"埋点与统计脚本","deliver":"前后对比报告（4 指标）+ 项目 v2","days":[{"d":64,"t":"正式开始：给用户一个明确的两周约定","min":60,"steps":["发一条消息：两周内每周用 3 次，每次做 5 条工单","说清这不是测试他们的能力，是测试工具","提供 5 个典型任务清单（含边界案例）","给出反馈渠道：一句话也行，截个图也行","承诺：第 7 天会做一次回访"],"concept":{"t":"FDE 的真实闭环","b":"系统上线不是终点。找 3-5 个真实用户连续用两周，每隔两三天看四组数据：使用次数、完成时间、人工修改率、放弃位置。这一步是 FDE 与\"写完代码就走的开发者\"最大的区别。"},"quiz":{"q":"用户说\"挺好的\"但数据上没在用，怎么办？","a":"别接受客套，问具体：上次用是什么时候？当时卡在哪？如果他说不清，看埋点——他是在哪一步退出的。礼貌性好评 + 零使用是最常见的假信号，只有数据不说谎。"}},{"d":65,"t":"埋点：把四个指标采下来","min":80,"steps":["埋 4 个事件：打开、提交、修改、放弃（含退出位置）","记录每次任务的处理时长（从打开到确认）","记录人工修改前后的值（差就是模型价值）","做一个简单的统计脚本，每天跑一次","把 D61 的审计日志也纳入统计"],"concept":{"t":"先定义指标再上线","b":"临时补埋点会丢掉前几天的珍贵数据。四个指标对应四个问题：用了吗（次数）、快了吗（时长）、准吗（修改率）、卡在哪（放弃位置）。它们分别对应采用、效率、质量、体验。"},"code":{"t":"week10/metrics.py","src":"import sqlite3, statistics\n\ncon = sqlite3.connect(\"data/app.db\")\n\ndef report(since):\n    rows = con.execute(\"\"\"SELECT action, ts, extra FROM event_log\n                          WHERE ts >= ?\"\"\", (since,)).fetchall()\n    submit = [r for r in rows if r[0] == \"submit\"]\n    edited = [r for r in rows if r[0] == \"edit\"]\n    drop   = [r for r in rows if r[0] == \"drop\"]\n\n    return {\n        \"使用次数\":    len(submit),\n        \"平均处理时长\": round(statistics.mean([float(r[2]) for r in submit] or [0]), 1),\n        \"人工修改率\":  round(len(edited) / max(len(submit), 1), 3),\n        \"放弃位置TOP\": top_n([r[2] for r in drop], 3),\n    }"},"quiz":{"q":"人工修改率居高不下，是模型问题还是产品问题？","a":"先看修改类型：改分类/内容 → 模型问题；改格式/措辞 → 提示词或模板问题；改完还说\"其实它分类没错\" → 那就是用户不信任，需要展示依据。不加区分地调模型，是最常见的无效优化。"}},{"d":66,"t":"第 1–3 天：只修致命问题，不优化","min":60,"steps":["每天看一次指标，只处理：崩溃、数据丢失、无法完成","把所有用户反馈原样记下来，不要立刻反驳或解释","记录自己想优化但忍住没做的点（清单留到 D69）","给用户回应：你反馈的 X 我们记下了","提醒还没用的用户一次（温和）"],"concept":{"t":"使用期不要改功能","b":"中途改版会让前后数据不可比，也会打断用户刚建立的习惯。除非是致命问题，否则忍住。这很难，但这是拿到可信前后对比的前提——FDE 的自律体现在这里。"},"quiz":{"q":"用户报了一个 bug，但只有一个人遇到，修吗？","a":"先看是不是会影响数据正确性或信任。崩溃、错误写回 → 立刻修；界面不顺手、个别分类不准 → 记下来，等观察期结束统一改。一个人遇到的问题，往往代表一类人没说出来。"}},{"d":67,"t":"第 7 天：做一次回访（5 个问题）","min":70,"steps":["每人 15 分钟，问 5 个问题（不是\"满意吗\"）","问：上一次用它是什么时候、为什么不更早用","问：有没有哪次你觉得\"还不如我自己做\"","问：如果只能改一个地方，你改哪","把回答原话记下来（案例里的金句）","感谢对方，并预告第 14 天会给结果"],"concept":{"t":"回访问的是行为，不是态度","b":"\"满意吗\"得到礼貌答案；\"上次什么时候用的、为什么当时没用\"得到真相。客户协作的核心技能是问出可行动的信息，而不是收集赞美。"},"quiz":{"q":"用户说\"我觉得分类挺准的，但我还是每次都自己看一遍\"，怎么理解？","a":"这是信任问题不是准确问题。他每次都检查 = 你的工具没省时间，只是多了个参考。解法不是提高准确率，而是让他不必检查：展示依据来源、给出置信度、对高置信度的明确标绿。这也是一个很好的面试故事。"}},{"d":68,"t":"数据分析：定位最痛的那一个点","min":80,"steps":["汇总 7 天数据，画 4 个指标的每日曲线","分析放弃位置：最多人卡在哪一步","对比：提交量高 vs 低的用户，行为差在哪","把\"想优化清单\"按 影响面 × 实现成本 排序","选出一个本周要改的点（只改一个）"],"concept":{"t":"一次只改一个变量","b":"同时改三处，你就不知道是哪处起了作用。这也是科学方法论在交付中的体现——FDE 要能用证据定位问题，而不是靠猜测堆功能。改一个，测一个，留下对比。"},"quiz":{"q":"如果用户根本不用，问题可能在模型之外吗？","a":"大概率在模型之外。常见原因：登录麻烦、入口太深、结果不能写回原系统、责任边界没说清（\"我确认了是不是我担责\"）。模型准确率很高但没人用，是 AI 项目最典型的失败形态。"}},{"d":69,"t":"一次真迭代：改最痛的那一处","min":90,"steps":["实现 D68 选出的那一个改动","跑一遍 eval，确认指标没有回退（用 W7 的门禁）","灰度：先给自己和 1 位用户看，确认没有新问题","全量发布，并在群里说清改了什么、为什么改","更新 README 与架构说明"],"concept":{"t":"迭代要说清\"为什么\"","b":"告诉用户\"我们改了 X，因为你们中有 3 人在 Y 处放弃了\"，比\"我们优化了体验\"有力得多。这既是对用户的尊重，也把你的工作变成了可展示的证据链。"},"quiz":{"q":"迭代后指标变好了，怎么证明是改动带来的？","a":"靠前后对比 + 单变量。保留改动前的基线数据、只改一处、观察期长度一致。如果同时有多个变化，就如实说明\"无法归因\"——诚实标注局限，比夸大结论更可信。"}},{"d":70,"t":"周末大块：前后对比报告 + v2","min":170,"steps":["跑第 8-14 天数据，与第 1-7 天对比","写 docs/before-after.md：4 指标前后值 + 改动说明 + 没解决什么","诚实写失败：哪里没改善，为什么，下一步怎么验证","项目打 v2 tag","notes/week10.md 复盘：模拟用户哪些反馈最出乎意料"],"concept":{"t":"没改善也可以写，但要解释失败在哪","b":"FDE 的可信度不来自\"项目永远成功\"，而来自你能用证据定位问题。一份诚实说明\"退款类仍保持人工处理，因为 X\"的报告，比一份全是好消息的报告更专业。"},"deliver":"验收：docs/before-after.md（4 指标前后对比）+ 项目 v2 + notes/week10.md"}]},{"w":11,"range":"D71–D77","theme":"客户侧能力：把技术变成别人愿意买单的故事","color":"#ec4899","series":"系列 W11：客户侧能力","foundation":"—","deliver":"作品集四件套：一页案例 / 3 分钟演示 / 脱敏架构图 / 故障复盘","days":[{"d":71,"t":"一页案例摘要：回答 7 个问题","min":80,"steps":["按 7 问写：谁在用 / 原流程什么问题 / 你做了什么取舍 / 怎么控制权限与风险 / 跑了多久 / 数据有什么变化 / 哪些没解决","一页 A4，不超 800 字","每个数字都标来源（\"eval 30 条样本\" / \"5 人 14 天\"）","删掉所有形容词，只留名词和数字","找人读一遍，问他能不能复述出价值"],"concept":{"t":"案例不是产品说明书","b":"不要写\"基于大模型搭建智能客服系统\"。要写\"5 人使用 14 天，单条处理从 180s 降到 55s，人工修改率 46%→18%，退款类仍人工处理\"。前者谁都能写，后者只有做过的人写得出。"},"code":{"t":"docs/case-study.md（骨架）","src":"# 客服工单分类与回复助手\n\n**谁在用**：5 位模拟用户（含 2 名真实客服岗朋友），14 天\n**原流程**：人工阅读 → 判断类别 → 查政策文档 → 手写回复，平均 180 秒/条\n\n**做了什么**\n- 规则前置过滤敏感信息，模型输出结构化分类（类别/优先级/是否转人工）\n- RAG 检索 40 条政策 + 200 条 FAQ，答案带来源编号\n- 低置信度与敏感类强制进人工队列；写回需二次确认且幂等\n\n**关键取舍**\n- 用合成数据（无真实数据权限），已主动加入 30% 噪声样本\n- 选 SQLite 而非向量数据库：数据量 < 1 万条，够用且零运维\n- 放弃自动发送：对外承诺必须人工确认\n\n**数据变化**（14 天，N=142 条）\n| 指标 | 前 | 后 |\n|---|---|---|\n| 平均处理时长 | 180s | 55s |\n| 人工修改率 | 46% | 18% |\n| 转人工准确率 | — | 91% |\n\n**仍未解决**：跨类别工单准确率仅 71%；退款类保持全人工\n**下一步**：扩 golden set 到 100 条，试混合检索"},"quiz":{"q":"案例里要不要写\"没解决的问题\"？","a":"必须写，而且是最能加分的一段。它证明你理解系统的边界、没有被自己的 Demo 说服。面试官一定会追问\"有什么局限\"，主动写出来反而掌握了叙事主动权。"}},{"d":72,"t":"脱敏架构图：一张图讲清系统","min":70,"steps":["画端到端：数据入口 → 规则过滤 → 模型 → RAG → 人工确认 → 写回 → 日志","标出三道保护的位置（超时重试 / 人工复核 / 失败回退）","标出权限边界（谁能写什么）","脱敏：去掉所有真实名称、密钥、内网地址","导出 PNG + 保留可编辑源文件"],"concept":{"t":"架构图要回答\"它挂了你先看哪\"","b":"不是组件罗列。好的架构图标注了：数据流向、失败点、权限边界、外部依赖。面试官看架构图，看的是你有没有想过这些——有没有\"运维意识\"。"},"quiz":{"q":"脱敏要做哪些具体检查？","a":"清单：① 真实公司/客户名、人名；② 内网 IP、域名、数据库连接串；③ 密钥、Token、Webhook；④ 截图里的浏览器标签、路径、用户名；⑤ 日志样本里的真实手机号/订单号。逐项过一遍再发布。"}},{"d":73,"t":"STAR 素材库：把经历变成可讲的故事","min":80,"steps":["写 6 个 STAR：技术决策 2 / 失败处理 2 / 客户协作 2","每个结构：情境 → 任务 → 行动 → 结果（必须有数字）","重点准备\"我搞砸过什么\"的故事","每个故事控制在 90 秒能讲完","朗读一遍，删掉所有技术黑话"],"concept":{"t":"FDE 面试权重：客户故事 30% > 技术 25% ≈ 沟通 25% > 自主判断 20%","b":"技术只是四分之一。淘汰主因往往是：只讲技术不讲业务、低估干系人、看不出业务上下文。所以 STAR 库里\"客户协作\"和\"失败处理\"必须占一半。"},"quiz":{"q":"\"我搞砸过什么\"该怎么讲才加分？","a":"结构：发生了什么 → 我怎么发现的 → 我做了什么止损 → 我改了什么机制防止再犯 → 现在指标如何。重点在\"发现机制\"和\"防复发\"，而不是错误本身。只讲错误不改进 = 减分。"}},{"d":74,"t":"简历与主页改造：让招聘方能搜到你","min":70,"steps":["标题含目标岗位关键词：Forward Deployed Engineer / AI 应用交付 / Agent 工程师","经历描述里嵌入：生产 AI 系统、RAG、Eval、LangGraph、FastAPI、客户交付","每条经历改成\"做了什么 + 带来什么变化（数字）\"","把 GitHub 主页 README 写成作品集入口（3 个项目的链接 + 一句话价值）","检查：搜\"FDE\"\"Agent 交付\"等关键词能否找到你"],"concept":{"t":"招聘方用关键词精确筛选","b":"能力再强，搜不到就等于不存在。把\"production AI systems\"\"evals\"\"RAG\"\"客户交付\"这些词自然写进经历描述，而不是堆在技能栏。同时准备一页可点开的作品集入口。"},"quiz":{"q":"没有正式工作经历怎么办？","a":"用项目经历顶上，但写法要像交付而不是作业：写\"为 5 位用户交付、运行 14 天、指标变化 X\"，而不是\"实现了基于 RAG 的问答系统\"。前者是 FDE 语言，后者是课程作业语言。"}},{"d":75,"t":"3 分钟演示视频：按叙事弧线剪","min":90,"steps":["结构：问题（30s）→ 演示（90s）→ 证据（45s）→ 边界（15s）","演示走真实流程，不要跳剪太多","必须展示一个\"它拒绝/转人工\"的瞬间","最后一屏放指标对比表","配字幕，静音也能看懂"],"concept":{"t":"演示要展示判断力，不只是功能","b":"最打动人的一幕不是它答对了，而是它说\"这个我不确定，转人工\"。那说明你设计的是可交付系统，不是 Demo。这一幕值 30 秒，一定要放。"},"quiz":{"q":"演示时系统卡住了怎么办？","a":"提前录屏，现场只做讲解；或者准备静态截图兜底。如果必须现场演示：保持 narrate（我现在看到它在等 X，通常这一步 3 秒）——把故障变成展示你对系统理解的时刻。慌乱和沉默才是真正的减分项。"}},{"d":76,"t":"故障复盘稿：一次真实或模拟的故障","min":80,"steps":["选一次你真遇到的故障（模型返回垃圾/接口超时/数据写错）","按时间线写：发现 → 定位 → 止损 → 根因 → 改进","写清\"怎么发现的\"（监控？用户反馈？）","写改进措施，并说明是否已验证","一页，放进作品集"],"concept":{"t":"复盘稿证明你能运维","b":"任何人都能做出一个跑通的 Demo，只有做过运维的人才写得出复盘。这份文档在面试里往往比项目本身更有说服力——它展示的是\"你敢不敢对结果负责\"。"},"quiz":{"q":"没有真故障怎么办？","a":"主动做一次故障演练：断网、改错 key、塞入畸形数据，记录系统表现与你的处置过程。诚实标注\"演练\"即可。做过演练的人，比没想过故障的人强得多。"}},{"d":77,"t":"周末大块：作品集打包","min":180,"steps":["四件套归位：案例摘要 / 演示视频 / 架构图 / 复盘稿","GitHub 仓库整理：README 完整、tag 打上、敏感信息复查","建一个作品集首页（GitHub Pages 或单页 HTML）","发给 2 位朋友看，各提一个问题","notes/week11.md 复盘"],"concept":{"t":"作品集 = 一次完整的交付演练","b":"打包作品集本身也是一次交付：别人能不能在 5 分钟内看懂你做了什么、为什么有价值。用做产品的标准要求它，而不是\"把文件放上去\"。"},"deliver":"验收：作品集四件套 + GitHub 仓库整理完毕 + 简历初稿 + 作品集首页"}]},{"w":12,"range":"D78–D90","theme":"面试冲刺与投递（13 天）","color":"#ef4444","series":"系列 W12：作品集 + 面试","foundation":"—","deliver":"面试问答库 + ≥1 次模拟录像 + 投递记录表","days":[{"d":78,"t":"面试地图：FDE 到底考什么","min":60,"steps":["五类题型：技术概念 / 系统设计 / 客户场景 / 现场编码 / 行为","按权重分配练习时间：客户场景 30% / 技术 25% / 沟通 25% / 判断 20%","建一个 qa.md，每类先写 5 个题","标出你最弱的一类，本周重点攻它","每天至少答 2 题，出声答"],"concept":{"t":"面试不是考试，是模拟工作场景","b":"FDE 面试真正想验证的是：需求模糊时你会不会问、系统出错时你找不找得到恢复路径、用户不用时你会不会回到现场。技术只是入场券。"},"quiz":{"q":"哪类题最容易让有经验的工程师翻车？","a":"客户场景模拟。技术强的人习惯\"给一个明确问题求最优解\"，但客户场景没有明确问题——你要先问出真问题。练习方法：任何题目先反问 3 个澄清问题再动手。"}},{"d":79,"t":"技术广度串讲：能讲清取舍才算懂","min":80,"steps":["准备 8 个对比题：RAG vs 微调 / 多 Agent vs 单 Agent / 向量库 vs SQL / 流式 vs 批量 / 手写 vs 框架 / 大模型 vs 规则 / 云 vs 本地 / 缓存 vs 重算","每题准备：定义、适用场景、反例、成本差异","用大白话讲给非技术朋友听，看能不能懂","录一段 5 分钟串讲，自己回听","把讲不清的标记出来，明天补"],"concept":{"t":"广度 > 深度","b":"FDE 淘汰的常见原因是\"只堆技术深度\"。面试官更想听\"我为什么不用 X\"而不是\"X 的内部原理\"。每个技术选择都要能说出放弃了什么、什么信号出现会改。"},"quiz":{"q":"\"什么时候不该用 Agent？\"怎么答才漂亮？","a":"给具体判据：任务步骤固定且已知 → 用工作流；单次调用能解决 → 直接调 API；对延迟和成本极敏感 → 规则优先；出错代价高且无法回滚 → 人工为主 Agent 为辅。能说出\"不用\"的场景，比会搭更有信服力。"}},{"d":80,"t":"现场编码① 手写 agent loop（限时 25 分钟）","min":80,"steps":["计时手写：循环 + 工具分发 + 步数上限 + 错误处理","边写边讲思路（面试官看的是思考过程）","写完后自己 review：死锁？无限循环？异常吞掉？","再写一遍，目标 15 分钟完成","把最优版本背下来（肌肉记忆）"],"concept":{"t":"现场编码考的是习惯，不是聪明","b":"限时下写不出精妙方案，但能暴露习惯：会不会设上限、会不会处理异常、变量命名清不清楚。这些习惯正是平时练出来的。"},"code":{"t":"面试版：25 分钟 agent loop","src":"def run(goal, tools, max_steps=5):\n    msgs = [{\"role\": \"user\", \"content\": goal}]\n    for _ in range(max_steps):                  # 1. 必须有上限\n        msg = llm(msgs, tools=tools).choices[0].message\n        if not msg.tool_calls:                  # 2. 终止条件\n            return msg.content\n        msgs.append(msg)\n        for c in msg.tool_calls:\n            fn = tools[c.function.name]\n            try:\n                out = fn(**json.loads(c.function.arguments))\n            except Exception as e:              # 3. 错误喂回模型，不吞\n                out = \"ERROR: %s\" % e\n            msgs.append({\"role\": \"tool\", \"tool_call_id\": c.id, \"content\": str(out)})\n    return \"超过步数上限，已转人工\"              # 4. 兜底"},"quiz":{"q":"写完了，面试官问\"这段代码线上会出什么问题\"，你怎么答？","a":"主动说：① 没有超时控制，单次调用可能挂死；② 没有成本统计，异常输入会烧钱；③ 工具执行没有权限校验；④ 错误信息原样回传可能泄露内部细节；⑤ 没有 trace，出问题无法复盘。主动暴露 + 给出改进方案，是加分项。"}},{"d":81,"t":"现场编码② tool schema + 结构化输出","min":80,"steps":["限时写一个工具的 JSON Schema（name/description/parameters/required）","description 要写成给模型看的说明书（什么时候用、什么时候别用）","写结构化输出解析 + 校验 + 失败兜底","思考：参数类型怎么设计模型才不容易传错","写完口述一遍 schema 设计原则"],"concept":{"t":"schema 是提示词的一部分","b":"description 写得好不好，直接决定模型会不会选对工具、传对参数。它本质上是一段给模型读的提示词。写清楚\"仅适用于 X，不要用于 Y\"能显著降错。"},"quiz":{"q":"模型总传错参数，怎么改？","a":"按顺序：① description 加示例和反例；② 用 enum 限定取值范围而不是 string；③ 参数名更具体（用 city_name 而非 q）；④ required 只标真正必填；⑤ 在提示词里给 1 个 few-shot 示例。改 schema 比改提示词更快见效。"}},{"d":82,"t":"客户场景模拟① 需求模糊","min":70,"steps":["题目：\"我们要用 AI 提升客服效率\"，你会怎么开场？","练习：先问 5 个澄清问题再谈方案","给出一个\"第一周能交付的最小东西\"","明确说出不做什么","录音 3 分钟，回听是否问够了问题"],"concept":{"t":"先问后做，是 FDE 的第一反应","b":"面试官不期待你当场给出方案，期待你先搞清：谁痛、痛在哪、现在怎么做、什么叫好了、谁拍板。答不上方案不扣分，跳过了提问一定扣分。"},"quiz":{"q":"客户坚持要一个庞大的方案，怎么推回？","a":"不否定，用\"阶段\"替代\"缩减\"：先两周做一个最小可用版本（明确范围和指标），拿到数据后再决定下一步。把对抗变成节奏控制——这是 FDE 处理范围蔓延的标准动作。"}},{"d":83,"t":"客户场景模拟② 演示翻车","min":70,"steps":["模拟：演示现场模型返回荒谬答案，客户当场质疑","练习回应：承认 → 解释原因 → 说明防护 → 给出时间","准备\"我们如何防止这种情况\"的三层答案","练习把翻车转成展示专业度的机会","录音回听，语气是否稳"],"concept":{"t":"翻车不可怕，失态才可怕","b":"AI 系统一定会出错，面试官知道。他们看的是：你会不会慌、会不会甩锅给模型、有没有防护机制、能不能给出下一步。沉着 + 有机制 = 通过。"},"quiz":{"q":"客户问\"它会不会乱说话\"，怎么答？","a":"给机制不给承诺：① 答案必须引用来源，无来源则拒绝回答；② 敏感类别强制转人工；③ 低置信度自动进人工队列；④ 所有输出有 trace 可回溯。然后给数据：当前转人工准确率 91%，人工修改率 18%。"}},{"d":84,"t":"客户场景模拟③ 范围蔓延与期望管理","min":70,"steps":["题目：客户用了一周后要求\"顺便把退款也自动处理了\"","练习：肯定需求 → 指出风险 → 给出分级方案","学会说\"可以做，但需要 X 条件\"","练习用数据谈优先级（工作量 vs 影响面）","录音回听"],"concept":{"t":"期望管理 = 持续的、小剂量的诚实","b":"不是一次性说清，是每次变更都重新对齐范围与指标。FDE 的项目失控，几乎都始于某次\"这个顺手加上吧\"。"},"quiz":{"q":"客户说\"这个很简单吧，加一下\"，你如何判断？","a":"先问三件事：出错代价（不可逆吗）、数据来源（有吗、准吗）、验收标准（怎么算对）。任何一个答不上来，就不是\"简单加一下\"。用问题代替估算，既专业又避免承诺陷阱。"}},{"d":85,"t":"STAR 演练：出声讲，录音自评","min":70,"steps":["把 D73 的 6 个 STAR 逐个出声讲，每个 90 秒","录音，回听三件事：有没有数字、有没有\"我\"、有没有结果","删掉所有\"我们团队\"里的含糊表述，明确你做了什么","挑 2 个故事练到不看稿","找一个朋友当听众，让他复述你讲了什么"],"concept":{"t":"能讲清楚 = 真的做过","b":"讲不顺的故事，通常是自己没想清楚。录音自评是最快暴露问题的方式——你会发现大量口头禅、无意义的技术细节、和缺失的结果。"},"quiz":{"q":"故事里技术细节讲多深合适？","a":"一笔带过技术名词，重点讲\"为什么这么选\"和\"结果如何\"。面试官若要深挖会追问——那才是展示深度的时机。主动堆技术细节，容易被贴上\"只懂技术\"的标签。"}},{"d":86,"t":"系统设计① 客服机器人规模化","min":80,"steps":["题目：日活 10 万的客服机器人，怎么设计","练习结构：需求澄清 → 容量估算 → 架构 → 瓶颈 → 降级","必须谈到：缓存、限流、队列、成本、人工兜底","画出架构并口述","限时 30 分钟"],"concept":{"t":"系统设计考的是取舍而非标准答案","b":"面试官看你能不能有结构地展开：先问清规模和约束，再估算，再画架构，主动指出瓶颈和降级方案。能自己发现\"这里会成为瓶颈\"比给出完美架构更重要。"},"quiz":{"q":"系统设计题开场应该做什么？","a":"先澄清：日活还是日请求量？峰值倍数？可接受的延迟？数据敏感度？准确率要求？——至少问 4 个。跳过澄清直接画图是最常见的失分点，哪怕图画得再漂亮。"}},{"d":87,"t":"系统设计② 百万页文档问答","min":80,"steps":["题目：为一百万页企业文档做问答","练习：切分策略、向量库选型、混合检索、重排、更新机制","必须谈到：权限过滤（谁能看哪份文档）","必须谈到成本：首次索引多少钱、每次查询多少钱","口述完整方案，限时 30 分钟"],"concept":{"t":"文档问答的真正难点是权限与更新","b":"技术上的 RAG 大家都懂，企业级难在：文档有权限等级（HR 文件不是谁都能问）、文档会更新（版本管理）、答案要可溯源。答出这三点，才算有交付经验。"},"quiz":{"q":"权限过滤应该在检索前还是检索后？","a":"检索前（pre-filter），按用户权限缩小候选集。检索后过滤会导致\"召回 10 条里 8 条无权访问\"，实际可用结果只剩 2 条，准确率暴跌。同时要在生成层再兜一道，防止模型从上下文里读出越权内容。"}},{"d":88,"t":"全流程模拟面试（录像 45 分钟）","min":100,"steps":["找人扮演面试官，或用计时自问自答","覆盖五类题型各 1 题","全程录像，事后回看","自评表：清晰度 / 结构 / 数字 / 冷静度 / 时间控制","挑出 3 个最需改的点，明天针对性练"],"concept":{"t":"模拟面试的收益来自回看，不来自演练","b":"当场感觉良好没意义。录像能暴露你自己察觉不到的问题：语速过快、抢话、答案没有结论、遇到不会的题就沉默。看一遍录像，胜过练三遍。"},"quiz":{"q":"遇到完全不会的题，最好的应对是什么？","a":"诚实说\"这块我没实践过\"→ 说出你会怎么在 1 小时内搞懂（查什么、问谁、做什么最小实验）→ 尝试基于已知原理给一个合理推测并标注\"这是我的推测\"。不懂装懂是唯一真正的减分项。"}},{"d":89,"t":"投递与记录：把找工作也当项目管理","min":80,"steps":["列 20 个目标岗位（FDE / Applied AI Engineer / AI 应用交付 / Solutions Engineer / Agent 工程师）","每份投递记录：公司 / 岗位 / 日期 / 渠道 / 反馈","针对每个岗位改 3 处关键词（不是全量重写）","主动找 5 个内推/社群渠道","设立每周投递目标并跟踪"],"concept":{"t":"岗位名称比你想的重要","b":"除了 FDE，还要搜：Forward Deployed AI Engineer、Applied AI Engineer、AI Deployment Engineer、Solutions Engineer、AI Solutions Architect、AI 应用交付工程师、Agent 工程师。看到岗位后问四个问题：是否写生产代码 / 是否对采用率负责 / 现场反馈能否进产品 / 项目结束是否沉淀复用——四个都模糊的，大概率是驻场实施换了个名字。"},"quiz":{"q":"怎么判断这个 FDE 岗位值不值得去？","a":"四问：① 写不写生产代码（还是只做配置）；② 对不对采用率负责（还是交付即结束）；③ 现场反馈能不能进产品；④ 项目结束沉淀不沉淀复用能力。四问都答不清 = 驻场实施换皮，成长有限。"}},{"d":90,"t":"收官：90 天复盘与下一段路","min":120,"steps":["写 notes/retro-90.md：做成了什么、没做成什么、最意外的事","把 12 周的笔记扫一遍，提炼成一篇博客/公众号文章","公开发布（哪怕只有 20 个阅读）——这是你的第 0 个影响力资产","定下一个 30 天目标（换真实用户？补一个 MCP？做第二个项目？）","感谢一路上给你反馈的人"],"concept":{"t":"公开发布是复利的开始","b":"把你 90 天的真实过程写出来（包括踩的坑），它同时是：作品集的补充、面试的谈资、以及让别人找到你的渠道。FDE 这个岗位本身就很看重沟通与影响力——写，就是练。"},"deliver":"验收：90 天复盘 + 一篇公开发布 + 下一个 30 天计划"}]}],"exercises":[{"id":"W1-1","w":1,"lvl":"L1","kind":"py","t":"CSV 校验器","d":"写一个 validate_csv(path)：读取 CSV，校验必需列（id/text/category）是否存在、类型是否正确；坏行不中断程序，写入 error.log 并统计数量，最后返回 (好行数, 坏行数)。","p":"文件 IO / 异常处理 / 日志 / 不因单行错误崩溃 / 中文编码 / 识别非 CSV 文件","h":"用 csv.DictReader 逐行处理，每行 try-except；logging 写 error.log；不要急着用 pandas。扩展名 .csv 可能是 Excel 二进制，用魔数识别后用 python_calamine 读 .xls/.xlsx。","a":"两个坑：① 中文 CSV 常是 GBK，utf-8 直接打开会 UnicodeDecodeError；② 扩展名 .csv 可能是 Excel 二进制（OLE2/ZIP 魔数），直接按文本读会报 new-line 错。\n先按魔数判断类型，文本走 csv，Excel 走 python_calamine（一个库通吃 .xls/.xlsx）。\n\nimport csv, io, logging\nfrom python_calamine import CalamineWorkbook\nlogging.basicConfig(filename=\"error.log\", level=logging.ERROR)\n\ndef detect_format(raw):\n    if raw[:8] == b\"\\xd0\\xcf\\x11\\xe0\\xa1\\xb1\\x1a\\xe1\": return \"xls\"\n    if raw[:2] == b\"PK\": return \"xlsx\"\n    return \"csv\"\n\ndef read_rows(path):\n    raw = open(path, \"rb\").read()\n    if detect_format(raw) == \"csv\":\n        return list(csv.DictReader(io.StringIO(raw.decode(\"utf-8-sig\", errors=\"ignore\"))))\n    grid = CalamineWorkbook.from_path(path).get_sheet_by_index(0).to_python(skip_empty_area=True)\n    header = [str(h) for h in grid[0]]\n    return [{header[i]: r[i] for i in range(len(header))} for r in grid[1:]]\n\ndef validate_csv(path, required=(\"id\",\"text\",\"category\")):\n    rows = read_rows(path)\n    missing = [c for c in required if c not in rows[0]]\n    ok = bad = 0\n    for i, row in enumerate(rows, 2):\n        try:\n            assert all(row.get(c) for c in missing), \"缺必需列\"\n            int(row[\"id\"]); ok += 1\n        except Exception as e:\n            bad += 1; logging.error(\"第 %d 行: %s\", i, e)\n    return ok, bad\n\n加分：required 传你文件真实的列（如 序号/api名称）才能校验出好行；坏行写入 bad_rows.csv 便于复核。"},{"id":"W1-2","w":1,"lvl":"L1","kind":"py","t":"Token 成本累加器","d":"写一个 CostTracker 类：维护一张模型单价表（输入/输出 每千 token 价格），提供 add(usage, model) 累加，total() 返回总费用与明细；要求支持多次调用累加，并能导出 JSON。","p":"类封装 / 累加器 / 数据建模 / 浮点精度","h":"价格存成 dict；注意 usage 里可能有 reasoning_tokens，也要计费。","a":"class CostTracker:\n    PRICE = {\"deepseek-chat\": (0.001, 0.002), \"gpt-4o\": (0.005, 0.015)}  # 每 1K token\n\n    def __init__(self): self.items = []\n\n    def add(self, usage, model):\n        pin, pout = self.PRICE.get(model, (0, 0))\n        cost = usage.prompt_tokens / 1000 * pin + usage.completion_tokens / 1000 * pout\n        self.items.append({\"model\": model, \"cost\": round(cost, 6)})\n        return cost\n\n    def total(self): return round(sum(i[\"cost\"] for i in self.items), 6)\n\n坑：浮点累加误差用 round 控制展示位数，内部保留原始值；推理模型的 reasoning_tokens 别漏算。"},{"id":"W1-3","w":1,"lvl":"L3","kind":"agent","t":"设计一个\"查订单\"工具的 Schema","d":"为 get_order(order_id) 写一份 OpenAI function calling 的 tool schema，要求：description 写清什么时候用、什么时候别用；参数用 enum/pattern 约束；标注 required。再写一段话说明你为什么这么写。","p":"工具即提示词 / schema 约束 / 描述质量决定调用准确率","h":"想想模型最容易传错什么：订单号格式？是否要带用户身份？","a":"{\n  \"type\": \"function\",\n  \"function\": {\n    \"name\": \"get_order\",\n    \"description\": \"按订单号查询单个订单的状态、金额与物流信息。仅当用户提供了 10 位数字订单号时使用；不要用订单号以外的信息（如手机号）查询，查不到时不要反复重试。\",\n    \"parameters\": {\n      \"type\": \"object\",\n      \"properties\": {\n        \"order_id\": {\"type\": \"string\", \"pattern\": \"^[0-9]{10}$\",\n                     \"description\": \"10 位数字订单号\"}\n      },\n      \"required\": [\"order_id\"]\n    }\n  }\n}\n\n为什么：description 里的\"何时不用\"和\"失败怎么办\"比\"这个工具做什么\"更影响模型行为；pattern 能把格式错误挡在调用之前。"},{"id":"W1-4","w":1,"lvl":"L2","kind":"agent","t":"一次调用多个工具","d":"写一个 run_tools(messages) 函数：发一次带 tools 的请求，用 for 循环把 msg.tool_calls 里的每一个都执行完，逐个把结果以 role=tool 且 tool_call_id=call.id 塞回 messages，最后再请求一次拿到最终回答。要求：未知工具名要有兜底，不能崩。","p":"tool_calls 是列表 / id 对应 / 并行调用 / 未知函数兜底","h":"tool_calls 可能是 0 个、1 个或多个；未知函数名时返回一句\"没有这个工具\"比抛 KeyError 好。","a":"for call in msg.tool_calls:                 # 别只取 [0]\n    args = json.loads(call.function.arguments)\n    fn = TOOL_MAP.get(call.function.name)\n    result = fn(**args) if fn else f\"没有名为 {call.function.name} 的工具\"\n    messages.append({\"role\": \"tool\",\n                     \"tool_call_id\": call.id,   # 必须和 call.id 一致\n                     \"content\": result})\n\nfinal = client.chat.completions.create(model=MODEL, messages=messages)\n\n坑：忘记 messages.append(msg)（那条 assistant 消息）会让模型失忆或网关直接报错；tool_call_id 写成固定值会让多工具结果互相覆盖。"},{"id":"W1-5","w":1,"lvl":"L2","kind":"py","t":"滑动窗口裁剪器","d":"写 trim_history(messages, keep_rounds=3)：保住第一条 system，只留最近 keep_rounds 轮（每轮 = user + assistant 两条），返回裁剪后的列表。再写一个变体：额外保证最近一条消息一定是 user。","p":"列表切片 / 边界处理 / 对话历史建模","h":"注意 keep_rounds 大于实际轮数时不能报错；assistant 消息可能是 tool 角色，也要一并保留才不会破坏上下文。","a":"def trim_history(messages, keep_rounds=3):\n    head = messages[:1] if messages and messages[0][\"role\"] == \"system\" else []\n    rest = messages[len(head):]\n    return head + rest[-(keep_rounds * 2):]\n\n坑：\n1) keep_rounds*2 大于 len(rest) 时切片返回全部，这是正确行为，不要特殊处理。\n2) 如果历史里混有 role=\"tool\" 的消息，按 2 条一轮切会切断「tool_calls ↔ tool 结果」的配对，模型下一轮可能报错——裁剪时要按\"调用块\"而不是按条切。\n3) 想让最近一条一定是 user，就在切片后从尾部丢弃多余的 assistant。"},{"id":"W1-6","w":1,"lvl":"L3","kind":"agent","t":"工具失败的两种写法对比","d":"有一个会超时失败的 get_weather()。分别用「raise 异常」和「return 错误字符串」两种写法接入工具调用链路，跑一遍并对比：程序是否中断、用户最终有没有拿到回答、模型分别说了什么。把观察写成 5 行结论。","p":"错误契约 / 链路韧性 / 用户体验 / 降级话术","h":"观察点：异常版本崩在哪一行？返回字符串版本里，模型是怎么把失败转述给用户的？","a":"结论要点：\n1) raise：整条链路在第 2 次调用前就断了，用户什么都看不到。\n2) return \"查询失败：接口 502\"：链路走完，模型会主动说\"暂时查不到，请稍后再试\"。\n3) 工具失败也是\"结果\"，只要它是字符串，模型就能处理。\n4) 生产环境还要配：超时时间、重试次数、失败计数熔断。\n5) 错误文案要写给人看——模型会原样或改写后转述给用户。\n\n加分：给工具加一层统一的 try-except 包装器，所有工具共用同一套错误契约。"},{"id":"W2-1","w":2,"lvl":"L3","kind":"agent","t":"ReAct trace 手推","d":"给定工具 [search(query), calculator(expr)]，手推\"2024 年中国新能源汽车销量同比增长多少\"的 ReAct 循环：写出至少 3 轮 Thought / Action / Action Input / Observation，最后给出 Final Answer。","p":"ReAct 循环 / 分步推理 / 工具选择逻辑","h":"注意第一轮搜索拿不到增速，需要第二轮搜索去年数据，再用 calculator。","a":"Thought 1: 需要今年销量和去年销量才能算增速，先查今年的。\nAction 1: search(\"2024 中国新能源汽车销量\")\nObservation 1: 2024 年约 1286 万辆。\n\nThought 2: 还缺 2023 年数据，再查一次。\nAction 2: search(\"2023 中国新能源汽车销量\")\nObservation 2: 2023 年约 949 万辆。\n\nThought 3: 有了两个数，用计算器算增长率。\nAction 3: calculator(\"(1286-949)/949\")\nObservation 3: 0.355\n\nFinal Answer: 同比增长约 35.5%。\n\n考点延伸：如果第一轮搜索什么都没返回，模型应该换关键词重试还是直接放弃？——正确行为是换一次关键词，再失败就说明\"查不到\"而不是编数字。"},{"id":"W2-2","w":2,"lvl":"L1","kind":"py","t":"CLI 骨架与日志","d":"用 argparse 写一个 CLI：支持 --query（必填）、--max-steps（默认 5）、--verbose；日志同时输出到控制台和 logs/app.log；main() 可被调用也可命令行执行。","p":"CLI 设计 / logging 双输出 / if __name__ 惯用法","h":"logging 用 FileHandler + StreamHandler，verbose 控制 level。","a":"import argparse, logging, sys\n\ndef build_logger(verbose):\n    lg = logging.getLogger(\"app\")\n    lg.setLevel(logging.DEBUG if verbose else logging.INFO)\n    fmt = logging.Formatter(\"%(asctime)s %(levelname)s %(message)s\")\n    fh = logging.FileHandler(\"logs/app.log\", encoding=\"utf-8\"); fh.setFormatter(fmt)\n    sh = logging.StreamHandler(sys.stdout); sh.setFormatter(fmt)\n    lg.addHandler(fh); lg.addHandler(sh)\n    return lg\n\ndef main(argv=None):\n    ap = argparse.ArgumentParser(description=\"研究 Agent\")\n    ap.add_argument(\"--query\", required=True)\n    ap.add_argument(\"--max-steps\", type=int, default=5)\n    ap.add_argument(\"--verbose\", action=\"store_true\")\n    args = ap.parse_args(argv)\n    log = build_logger(args.verbose)\n    log.info(\"query=%s steps=%d\", args.query, args.max_steps)\n\nif __name__ == \"__main__\":\n    main()\n\n加分：main(argv=None) 让它可以被 pytest 直接调用测试。"},{"id":"W2-3","w":2,"lvl":"L1","kind":"py","t":"为 CSV 校验器写 pytest","d":"为 W1-1 的 validate_csv 写 4 条测试：正常文件、缺列、类型错误、空文件。要求用 tmp_path fixture 造临时文件，不污染仓库。","p":"pytest / fixture / 边界用例 / 测试隔离","h":"pytest 的 tmp_path 会自动给临时目录；断言返回元组而不是打印。","a":"import pytest\nfrom validator import validate_csv\n\ndef write(tmp_path, content, name=\"t.csv\"):\n    p = tmp_path / name\n    p.write_text(content, encoding=\"utf-8\")\n    return str(p)\n\ndef test_ok(tmp_path):\n    f = write(tmp_path, \"id,text,category\\n1,hello,A\\n\")\n    assert validate_csv(f) == (1, 0)\n\ndef test_missing_column(tmp_path):\n    f = write(tmp_path, \"id,category\\n1,A\\n\")\n    ok, bad = validate_csv(f)\n    assert ok == 0 and bad == 1\n\ndef test_bad_type(tmp_path):\n    f = write(tmp_path, \"id,text,category\\nabc,hello,A\\n\")\n    assert validate_csv(f)[1] == 1\n\ndef test_empty(tmp_path):\n    assert validate_csv(write(tmp_path, \"\")) == (0, 0)\n\n坑：空文件的 DictReader 没有 fieldnames，要单独处理，否则会抛异常而不是返回 (0,0)。"},{"id":"W2-4","w":2,"lvl":"L1","kind":"py","t":"环境变量加载与启动校验","d":"封装 load_config(required)：从 .env 文件读取 KEY，校验 required 列表中每项都不为空；缺失时抛中文异常并提示用户检查 .env；敏感值只允许来自环境变量。","p":"配置管理 / 启动即失败 / 敏感信息隔离","h":"用 python-dotenv 的 find_dotenv；缺失时给出\"缺少环境变量 XXX，请在 .env 中配置\"而不是裸抛 KeyError。","a":"from dotenv import load_dotenv, find_dotenv\nimport os\n\ndef load_config(required):\n    load_dotenv(find_dotenv())\n    cfg = {}\n    for k in required:\n        v = os.getenv(k)\n        if not v:\n            raise RuntimeError(\"缺少环境变量 %s，请在 .env 中配置\" % k)\n        cfg[k] = v\n    return cfg\n\n# 用法\ncfg = load_config([\"OPENAI_API_KEY\", \"OPENAI_BASE_URL\"])\n\n要点：启动时 fail fast；不要把 .env 提交到 Git；生产环境敏感值应直接由容器/CI 注入环境变量。"},{"id":"W3-1","w":3,"lvl":"L3","kind":"agent","t":"手写最小 Agent Loop","d":"不借助任何框架，写 60 行以内的 run(goal, tools, max_steps=5)：循环调用模型、分发工具、把工具结果塞回 messages，直到不再有 tool_calls 或超过步数上限。","p":"Agent 循环本质 / 工具分发 / 终止条件 / 异常兜底","h":"关键：错误也要作为 Observation 回传给模型，不要吞掉。","a":"def run(goal, tools, max_steps=5):\n    msgs = [{\"role\": \"user\", \"content\": goal}]\n    for _ in range(max_steps):\n        msg = llm(msgs, tools=tools).choices[0].message\n        if not msg.tool_calls:\n            return msg.content\n        msgs.append(msg)\n        for c in msg.tool_calls:\n            fn = tools[c.function.name]\n            try:\n                out = fn(**json.loads(c.function.arguments))\n            except Exception as e:\n                out = \"ERROR: %s\" % e        # 错误回传，让模型自己换招\n            msgs.append({\"role\": \"tool\", \"tool_call_id\": c.id, \"content\": str(out)})\n    return \"超过步数上限，已转人工\"\n\n四个不能省：max_steps、tool_call_id 对应、错误回传、超限兜底。"},{"id":"W3-2","w":3,"lvl":"L1","kind":"py","t":"对话 checkpoint 持久化","d":"实现 save_checkpoint(messages, path) 与 load_checkpoint(path)：把对话历史存成 JSON，程序重启后能继续；要求处理文件不存在、JSON 损坏两种情况。","p":"序列化 / 文件异常处理 / 状态恢复","h":"JSON 损坏时是删掉重建还是报错？思考哪种更安全。","a":"import json, os, logging\n\ndef save_checkpoint(messages, path):\n    tmp = path + \".tmp\"\n    with open(tmp, \"w\", encoding=\"utf-8\") as f:\n        json.dump(messages, f, ensure_ascii=False, indent=2)\n    os.replace(tmp, path)          # 原子写，避免写一半崩溃导致损坏\n\ndef load_checkpoint(path):\n    if not os.path.exists(path):\n        return []\n    try:\n        with open(path, encoding=\"utf-8\") as f:\n            return json.load(f)\n    except json.JSONDecodeError:\n        logging.error(\"checkpoint 损坏，已备份并重建: %s\", path)\n        os.replace(path, path + \".broken\")\n        return []\n\n要点：先写临时文件再 os.replace，是防止\"写一半断电\"的标准做法；损坏文件不要直接删，先备份。"},{"id":"W3-3","w":3,"lvl":"L3","kind":"agent","t":"Chunking 策略对比器","d":"实现固定长度切分与递归分隔符切分两种策略，对同一批文档按 size ∈ {200, 500, 1000}、overlap ∈ {0, 0.15} 组合切分，输出每种组合的：块数、平均块长、最大块长，并说明你会选哪个。","p":"切分策略 / 重叠作用 / 用数据支撑选择","h":"观察：size 太小会出现\"半句话\"块；overlap 能缓解但增加冗余。","a":"def fixed_chunk(text, size, overlap):\n    step = int(size * (1 - overlap))\n    return [text[i:i + size] for i in range(0, len(text), step)]\n\ndef recursive_chunk(text, size, seps=(\"\\n\\n\", \"\\n\", \"。\", \"，\", \" \")):\n    if len(text) <= size:\n        return [text]\n    for s in seps:\n        if s in text:\n            parts, out = text.split(s), []\n            for p in parts:\n                out += recursive_chunk(p, size, seps)\n            return [x for x in out if x.strip()]\n    return fixed_chunk(text, size, 0)\n\n判断依据：优先保证\"不切断语义\"（递归分隔符通常更好），再看平均块长是否落在 300-500 字区间，最后看块数是否过多（影响成本）。"},{"id":"W3-4","w":3,"lvl":"L3","kind":"agent","t":"不可逆动作前的人工确认节点","d":"写一个 confirm_before_write(state, action) 函数：在执行写回/发消息/改状态前，先向用户展示 action 摘要，等待输入；仅当用户回复 y/yes/确认 时才返回 True；输入 n/no/否 返回 False；输入 q/quit 抛出 CancelledError。","p":"Human-in-the-loop / 安全护栏 / 交互设计","h":"展示信息要精简：动作 + 影响对象 + 变更内容；不要一次性给用户看大段 JSON。","a":"class CancelledError(Exception): pass\n\ndef confirm_before_write(state, action):\n    print(\"【待执行动作】%s\" % action[\"name\"])\n    print(\"  对象：%s\" % action[\"object_id\"])\n    print(\"  变更：%s\" % action[\"summary\"])\n    ans = input(\"确认执行？(y/n/q): \").strip().lower()\n    if ans in (\"y\", \"yes\", \"确认\"): return True\n    if ans in (\"n\", \"no\", \"否\"): return False\n    if ans in (\"q\", \"quit\", \"退出\"): raise CancelledError(\"用户取消\")\n    return False\n\n边界：批量场景下应支持 --yes 开关跳过确认（测试/脚本化），但生产默认必须确认。"},{"id":"W4-1","w":4,"lvl":"L3","kind":"agent","t":"Embedding 批处理与去重","d":"写一个 embed_texts(texts)：批量调用 embedding 接口，按内容哈希去重（相同文本不重复花钱），结果缓存到本地 JSON；再次调用相同文本应命中缓存。","p":"批处理 / 缓存 / 内容哈希 / 成本控制","h":"哈希用 hashlib.sha256(text.encode()).hexdigest()[:16]。","a":"import hashlib, json, os\nCACHE = \".emb_cache.json\"\n\ndef _key(t): return hashlib.sha256(t.encode(\"utf-8\")).hexdigest()[:16]\n\ndef embed_texts(texts, client, model):\n    cache = json.load(open(CACHE, encoding=\"utf-8\")) if os.path.exists(CACHE) else {}\n    todo, result = [], {}\n    for t in texts:\n        k = _key(t)\n        if k in cache: result[t] = cache[k]\n        else: todo.append(t)\n\n    for i in range(0, len(todo), 64):                 # 批处理，一次最多 64 条\n        batch = todo[i:i + 64]\n        vecs = client.embeddings.create(model=model, input=batch).data\n        for t, v in zip(batch, vecs):\n            cache[_key(t)] = v.embedding\n            result[t] = v.embedding\n\n    json.dump(cache, open(CACHE, \"w\", encoding=\"utf-8\"))\n    return [result[t] for t in texts]\n\n延伸：文档更新时如何失效缓存？——按内容哈希即天然失效（内容变了 key 就变）。"},{"id":"W4-2","w":4,"lvl":"L3","kind":"agent","t":"召回评估：Hit@K 与 MRR","d":"给定 20 条 (问题, 正确 chunk_id) 和你的检索结果（每次返回排序后的 id 列表），实现 hit_rate(gold, ranked, k) 与 mrr(gold, ranked)，并输出 K=1/3/5 三档对比。","p":"检索指标 / 排序质量 / 评估思维","h":"Hit@K 看\"找没找到\"，MRR 看\"排多前\"，两者含义不同。","a":"def hit_rate(gold, ranked, k=3):\n    return sum(1 for g, r in zip(gold, ranked) if g in r[:k]) / len(gold)\n\ndef mrr(gold, ranked):\n    s = 0.0\n    for g, r in zip(gold, ranked):\n        if g in r:\n            s += 1.0 / (r.index(g) + 1)\n    return s / len(gold)\n\nfor k in (1, 3, 5):\n    print(\"Hit@%d\" % k, round(hit_rate(gold, ranked, k), 3))\nprint(\"MRR\", round(mrr(gold, ranked), 3))\n\n解读：Hit@1 低但 Hit@5 高 → 能找到但排得靠后 → 该加重排（Rerank），而不是换 embedding 模型。Hit@5 也低 → 切分或嵌入有问题。"},{"id":"W4-3","w":4,"lvl":"L1","kind":"py","t":"SQLite 入库与聚合查询","d":"把工单 CSV 导入 SQLite（参数化插入），再实现：按类别统计数量、按优先级统计数量、查询某时间之后的高优先级工单；要求所有查询参数化。","p":"SQL 基础 / 参数化防注入 / 聚合查询 / 上下文管理器","h":"务必用 ? 占位符；用 with 管理连接。","a":"import sqlite3, csv\n\ncon = sqlite3.connect(\"data/app.db\")\ncon.execute(\"\"\"CREATE TABLE IF NOT EXISTS tickets(\n    id INTEGER PRIMARY KEY, text TEXT NOT NULL, category TEXT,\n    priority TEXT, created_at TEXT)\"\"\")\n\nwith open(\"tickets.csv\", encoding=\"utf-8\") as f:\n    rows = [(int(r[\"id\"]), r[\"text\"], r[\"category\"], r[\"priority\"], r[\"created_at\"])\n            for r in csv.DictReader(f)]\ncon.executemany(\"INSERT OR REPLACE INTO tickets VALUES(?,?,?,?,?)\", rows)\ncon.commit()\n\nprint(con.execute(\"SELECT category, COUNT(*) FROM tickets GROUP BY category\").fetchall())\nprint(con.execute(\"SELECT * FROM tickets WHERE priority=? AND created_at>=?\",\n                  (\"high\", \"2026-01-01\")).fetchall())\n\n红线：永不拼接 SQL 字符串。executemany 比循环 execute 快得多。"},{"id":"W4-4","w":4,"lvl":"L2","kind":"py","t":"手动实现余弦相似度","d":"实现 cosine_similarity(a, b)：对两个等长向量返回余弦相似度；再实现 batch_query(query_vec, doc_vecs) 返回每个 doc 与 query 的相似度列表。要求处理零向量、长度不等、输入类型异常。","p":"向量基础 / 相似度计算 / 异常处理","h":"cos = dot / (norm_a * norm_b)；用 math.fsum 提高累加精度。","a":"import math\n\ndef cosine_similarity(a, b):\n    if len(a) != len(b):\n        raise ValueError(\"向量维度不一致: %d vs %d\" % (len(a), len(b)))\n    dot = math.fsum(x * y for x, y in zip(a, b))\n    na = math.sqrt(math.fsum(x * x for x in a))\n    nb = math.sqrt(math.fsum(x * x for x in b))\n    if na == 0 or nb == 0:\n        return 0.0\n    return dot / (na * nb)\n\ndef batch_query(q, docs):\n    return [cosine_similarity(q, d) for d in docs]\n\n延伸：实际 RAG 会用 numpy 或向量库加速；但理解公式才能调得好阈值。"},{"id":"W5-1","w":5,"lvl":"L3","kind":"agent","t":"DAG 任务图建模与校验","d":"定义 Task 结构（id/name/worker/deps/parallel），实现 validate(tasks)：检查依赖指向存在的任务、检测是否存在环、输出可并行执行的批次分组。","p":"有向无环图 / 拓扑排序 / 环检测 / 并行分组","h":"每轮挑出\"所有依赖已完成\"的任务作为一批，它们可以并行。","a":"def topo_batches(tasks):\n    done, batches = set(), []\n    remaining = list(tasks)\n    while remaining:\n        batch = [t for t in remaining if set(t.deps) <= done]\n        if not batch:\n            raise ValueError(\"存在循环依赖: %s\" % [t.id for t in remaining])\n        batches.append(batch)\n        done |= {t.id for t in batch}\n        remaining = [t for t in remaining if t.id not in done]\n    return batches\n\ndef validate(tasks):\n    ids = {t.id for t in tasks}\n    for t in tasks:\n        missing = set(t.deps) - ids\n        if missing: raise ValueError(\"%s 依赖不存在的任务 %s\" % (t.id, missing))\n    return topo_batches(tasks)          # 能跑通即无环\n\n应用：编排者按 batches 顺序执行，批内并发，批间等待。"},{"id":"W5-2","w":5,"lvl":"L2","kind":"py","t":"并发限流调用器","d":"写一个并发执行器：用 ThreadPoolExecutor 并发跑任务，但同时对 LLM 调用限速（每秒最多 N 次），支持单任务超时，失败任务返回错误而不是让整体崩溃。","p":"并发 / 限流 / 超时 / 异常隔离","h":"用 threading.Semaphore + 时间间隔控制；future.result(timeout=) 处理超时。","a":"from concurrent.futures import ThreadPoolExecutor, as_completed\nimport threading, time\n\nclass RateLimiter:\n    def __init__(self, rps):\n        self.min_gap = 1.0 / rps\n        self._lock = threading.Lock()\n        self._last = 0.0\n    def acquire(self):\n        with self._lock:\n            gap = time.time() - self._last\n            if gap < self.min_gap: time.sleep(self.min_gap - gap)\n            self._last = time.time()\n\nlimiter = RateLimiter(rps=5)\n\ndef run_all(items, fn, workers=4, timeout=30):\n    out = {}\n    with ThreadPoolExecutor(max_workers=workers) as ex:\n        futs = {ex.submit(fn, i): i for i in items}\n        for f in as_completed(futs):\n            i = futs[f]\n            try:\n                out[i] = f.result(timeout=timeout)\n            except Exception as e:\n                out[i] = {\"error\": str(e)}      # 单个失败不影响整体\n    return out\n\n注意：并发数 × 单请求耗时决定实际 QPS，限流器要真正生效需要它成为唯一出口。"},{"id":"W5-3","w":5,"lvl":"L4","kind":"agent","t":"三 Agent 协作系统（综合）","d":"实现 retriever / writer / editor 三个 Agent：retriever 检索资料，writer 基于资料起草，editor 校对并要求引用来源。用 W5-1 的任务图驱动，输出最终稿 + 每步 trace。","p":"多 Agent 编排 / 状态传递 / trace / 端到端整合","h":"先跑通串行版，再考虑并行；每步结果都存入黑板和 trace。","a":"结构建议：\n\nstate = {\"goal\": ..., \"chunks\": [], \"draft\": \"\", \"final\": \"\", \"trace\": []}\n\ndef retriever(s):\n    s[\"chunks\"] = search(s[\"goal\"], k=3); log(s, \"retriever\", s[\"chunks\"]); return s\ndef writer(s):\n    s[\"draft\"] = llm(WRITE_PROMPT.format(goal=s[\"goal\"], ctx=s[\"chunks\"])); log(s, \"writer\"); return s\ndef editor(s):\n    s[\"final\"] = llm(EDIT_PROMPT.format(draft=s[\"draft\"], sources=s[\"chunks\"])); log(s, \"editor\"); return s\n\n验收三问：① 某个 Agent 失败会怎样？② 能不能只重跑其中一个？③ trace 能不能还原全过程？\n这三个问题答不上来，说明系统还不可运维。"},{"id":"W5-4","w":5,"lvl":"L2","kind":"py","t":"指数退避重试装饰器","d":"实现 @retry(max_retries=3, backoff=2, max_wait=60, retry_on=(429, 502, 503)) 装饰器：被装饰函数失败时按 1, 2, 4... 秒等待后重试；对 4xx（除 429）不重试；超时加入抖动。","p":"重试 / 指数退避 / 抖动 / 错误分类","h":"用 random.uniform(0, 1) 加抖动；通过异常类型或状态码判断是否可重试。","a":"import time, random, functools\n\ndef retry(max_retries=3, backoff=2, max_wait=60, retry_on=(RuntimeError,)):\n    def deco(fn):\n        @functools.wraps(fn)\n        def wrapper(*args, **kw):\n            wait = 1\n            for attempt in range(max_retries + 1):\n                try:\n                    return fn(*args, **kw)\n                except Exception as e:\n                    if attempt == max_retries or not isinstance(e, retry_on):\n                        raise\n                    sleep = min(wait + random.uniform(0, 1), max_wait)\n                    time.sleep(sleep)\n                    wait *= backoff\n            return None\n        return wrapper\n    return deco\n\n要点：只重试\"可能很快恢复\"的错误；业务错误（如参数非法）不要重，否则会把错误放大。"},{"id":"W6-1","w":6,"lvl":"L2","kind":"py","t":"幂等写回","d":"实现 write_back(ticket_id, result)：用 (ticket_id, action) 作为幂等键，先查已执行表；若已执行过则直接返回上次结果，不重复写；记录执行时间。","p":"幂等设计 / 去重表 / 并发安全","h":"思考两个线程同时调用同一个幂等键会怎样——需要数据库唯一约束。","a":"con.execute(\"\"\"CREATE TABLE IF NOT EXISTS idempotency(\n    key TEXT PRIMARY KEY, result TEXT, created_at TEXT)\"\"\")\n\ndef write_back(ticket_id, result, action=\"write_back\"):\n    key = \"%s:%s\" % (ticket_id, action)\n    row = con.execute(\"SELECT result FROM idempotency WHERE key=?\", (key,)).fetchone()\n    if row:                                   # 已执行 → 直接返回，不重复写\n        return json.loads(row[0])\n    try:\n        con.execute(\"INSERT INTO idempotency VALUES(?,?,?)\",\n                    (key, json.dumps(result), now()))\n        con.commit()\n    except sqlite3.IntegrityError:            # 并发下另一个线程抢先了\n        return json.loads(con.execute(\n            \"SELECT result FROM idempotency WHERE key=?\", (key,)).fetchone()[0])\n    do_real_write(ticket_id, result)\n    return result\n\n关键：唯一约束（PRIMARY KEY）才是真正的幂等保障，应用层的 SELECT 检查有竞态窗口。"},{"id":"W6-2","w":6,"lvl":"L2","kind":"py","t":"合成数据生成器","d":"写一个脚本生成 500 条工单、40 条政策、200 条 FAQ；工单要含 30% 噪声（错别字、口语、多问题混合），并留出 10% 的\"难样本\"标记用于评估。","p":"数据合成 / 随机可控（seed）/ 噪声注入 / 可复现","h":"用 random.Random(42) 固定种子，保证每次生成一致（可复现很重要）。","a":"import random, json\n\nTEMPLATES = {\"退款问题\": [...], \"物流问题\": [...], \"质量问题\": [...]}\nNOISE = [\"\", \"？？？\", \"急急急\", \"客服在吗\", \"（图片）\"]\n\ndef make(n=500, seed=42):\n    rnd = random.Random(seed)          # 固定种子 = 可复现\n    rows = []\n    for i in range(n):\n        cat = rnd.choice(list(TEMPLATES))\n        text = rnd.choice(TEMPLATES[cat]).format(...)\n        if rnd.random() < 0.3:\n            text += rnd.choice(NOISE)\n        rows.append({\"id\": i + 1, \"text\": text, \"category\": cat,\n                     \"hard\": rnd.random() < 0.10})\n    return rows\n\n要点：种子固定（可复现）、噪声比例可控（可调分布）、hard 标记（用于分层评估）。"},{"id":"W6-3","w":6,"lvl":"L3","kind":"agent","t":"失败回退策略设计","d":"为你的主线项目设计三层降级：模型降级（换便宜模型）、功能降级（只给分类不给草稿）、人工降级（全部转人工）。写出触发条件、实现方式、以及每种降级用户看到什么。","p":"降级设计 / 熔断 / 用户体验连续性","h":"触发条件要可量化（如连续 5 次失败、成本超 X、延迟超 Y）。","a":"DEGRADE_RULES = [\n    # (触发条件, 降级动作, 用户可见提示)\n    (\"连续 5 次调用失败\", \"功能降级：只返回分类，不生成草稿\",\n     \"当前回复生成繁忙，已为您完成分类，可手动撰写回复\"),\n    (\"单条成本 > 阈值\", \"模型降级：切换到便宜模型\",\n     \"（无提示，质量略降）\"),\n    (\"模型服务不可用 > 3 分钟\", \"人工降级：全部进人工队列\",\n     \"AI 辅助暂时不可用，工单已转入人工队列\"),\n]\n\n实现要点：\n1. 降级开关集中在配置，改一行即可切换（不要散落 if-else）\n2. 每次降级必须记日志 + 告警（否则静默降级会掩盖故障）\n3. 恢复条件也要写：如\"连续 3 次成功后恢复\"\n\n面试价值：能说清降级策略 = 有生产意识，这是 FDE 与 Demo 选手的分水岭。"},{"id":"W6-4","w":6,"lvl":"L3","kind":"agent","t":"提示词 A/B 测试框架","d":"写一个 ab_test(prompts, cases) 框架：同一批 cases 分别用 prompts A/B 跑，输出：每个 prompt 的成功率、平均长度、格式合规率。要求失败时输出具体 case id，不要整体中断。","p":"提示词迭代 / 对比实验 / 可复现评估","h":"固定 temperature=0；把 prompts 和评价函数参数化，方便加 C/D 版本。","a":"def ab_test(prompts, cases, evaluate_fn):\n    results = {name: {\"ok\": 0, \"len\": 0, \"fmt_ok\": 0, \"errors\": []} for name in prompts}\n    for name, prompt in prompts.items():\n        for c in cases:\n            try:\n                out = llm(prompt.format(input=c[\"input\"]), temperature=0)\n                score = evaluate_fn(c, out)\n                results[name][\"ok\"] += score.get(\"correct\", 0)\n                results[name][\"fmt_ok\"] += score.get(\"format_ok\", 0)\n                results[name][\"len\"] += len(out)\n            except Exception as e:\n                results[name][\"errors\"].append((c[\"id\"], str(e)))\n    return results\n\n价值：提示词优化必须有对照实验，否则\"感觉变好\"往往是幻觉。"},{"id":"W7-1","w":7,"lvl":"L3","kind":"agent","t":"Golden set 与评估脚本","d":"设计 30 条评估样本（高频 15 / 边界 10 / 陷阱 5），写成 JSON；实现 evaluate() 输出准确率、格式合规率、转人工准确率、平均耗时、单条成本。","p":"评估集设计 / 分层覆盖 / 多维度指标","h":"陷阱类样本要包含\"应该拒绝/转人工\"的，否则系统会被调得越来越激进。","a":"样本结构：\n{\"id\": 1, \"input\": \"我买了三天想退款\", \"expect_category\": \"退款问题\",\n \"expect_review\": false, \"expect_sources\": [\"policy_return\"], \"type\": \"高频\"}\n\ndef evaluate(cases, predict_fn):\n    preds = [predict_fn(c[\"input\"]) for c in cases]\n    n = len(cases)\n    return {\n      \"accuracy\":      sum(p[\"category\"] == c[\"expect_category\"] for c, p in zip(cases, preds)) / n,\n      \"format_ok\":     sum(is_valid(p) for p in preds) / n,\n      \"escalation_acc\":sum(p.get(\"need_human_review\") == c[\"expect_review\"] for c, p in zip(cases, preds)) / n,\n      \"avg_latency_ms\":mean(p[\"latency_ms\"] for p in preds),\n      \"cost_per_case\": sum(p[\"cost\"] for p in preds) / n,\n    }\n\n关键：评估要能一键复现（固定 seed、固定样本集、输出可 diff 的结果文件）。"},{"id":"W7-2","w":7,"lvl":"L3","kind":"agent","t":"LLM-as-Judge 评分器","d":"写一个 judge(input, output, rubric) 让模型按 1-5 分给\"回复草稿\"打分；要求：给明确 rubric、让模型输出评分理由、对同一条打 3 次检验一致性。","p":"模型评分 / rubric 设计 / 一致性检验 / 已知偏差","h":"注意偏差：偏爱长答案、偏爱靠前选项、自恋偏差。","a":"RUBRIC = \"\"\"你是客服质检员，按以下标准给回复草稿打分：\n5 分：准确解答、语气得体、引用了正确政策、可直接发送\n4 分：准确但有 minor 措辞问题\n3 分：方向正确但缺关键信息\n2 分：有事实错误\n1 分：完全错误或不相关\n只输出 JSON: {\"score\": 1-5, \"reason\": \"...\"}\"\"\"\n\ndef judge(text, draft, times=3):\n    scores = []\n    for _ in range(times):                    # 多次打分看一致性\n        r = llm(RUBRIC + \"\\n工单：\" + text + \"\\n回复：\" + draft,\n                response_format={\"type\": \"json_object\"}, temperature=0)\n
